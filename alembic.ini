; ASCII only: alembic reads this through configparser with the platform default
; encoding (cp1252 on Windows). Rationale lives in alembic/env.py.
[alembic]
script_location = alembic
; Timestamp-prefixed filenames so the directory listing shows execution order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
; No connection string here: alembic/env.py reads CORE_DATABASE_URL from the environment.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
