# 部署 —— OpenClaw 部署观察契约（ONBOARD-PROJECT.md 的 D1–D5）。
# 推送触发的部署只部署 Demo Core 实例（检出 .env 里 CORE_ENV=demo）；生产实例（CORE_ENV=production）
# 由人手工触发本工作流升级：instance 选 production、ref 填 SHA（docs/PRODUCTION_AND_RECOVERY.md 第 1.2 节第 5 条）。
#
# .platform/project.yaml 写了 `deploy_workflow: deploy.yml`，就是承诺本工作流满足：
#   D1 触发：由 push 到默认分支触发，每次合并都产生一次以合并提交为 headSha 的 push 运行。
#            例外：只改 .platform/tasks.yaml 与 docs/TODO.md 的提交（自动收尾）被 paths-ignore 排除，不部署。
#            workflow_dispatch 保留给手工重部署 / 回滚与生产升级，不计入观察。
#   D2 对象：部署的正是触发它的那个提交（DEPLOY_SHA）：镜像以它为标签构建，服务器上
#            `git checkout --detach` 到它再跑它自己的 deploy/deploy.sh，不 `git pull` 分支最新。
#   D3 结论：只有新版本已上线、且上线后健康检查报出 DEPLOY_SHA 才以 success 结束；迁移失败、
#            不健康、回滚（无论回滚是否成功）、中断都以失败结束。没有 continue-on-error。
#            Core 没有公网入口，健康检查经 SSH 在服务器上进容器取 /healthz（deploy/healthcheck.sh）。
#   D4 并发：不取消进行中的部署（被取消的运行按失败处理）。
#   D5 期限：两个 job 的 timeout-minutes 合计 28 分钟（build 10 + deploy 18），30 分钟内给出结论；不用需要人工批准的 environment。
# OpenClaw 只读结论：不部署、不回滚、不重跑，也不登录生产。
#
# 本文件不写主机名、IP、域名、路径、密钥：连接信息与部署目录放 GitHub secrets。
name: Deploy

# paths-ignore：只改这两个文件的提交（OpenClaw 自动收尾 PR 的 ready → done 与移出「当前计划」）不部署。
# 项目启用自动收尾（控制面登记表 auto_closeout: true）后，Worker 合并收尾 PR 前逐项核对这里的形状，
# 不符即拒绝合并（closeout_would_deploy）。只接受这一种形状：
#   - 触发器键是字面的 on；on 下只有 push，可另有 workflow_dispatch；
#   - push 是 mapping，有 paths-ignore 列表，逐字含 .platform/tasks.yaml 与规划文件路径，没有以 ! 开头的条目；
#   - 没有 paths、没有 branches-ignore；branches 若有，必须含默认分支；
#   - 不用锚点、别名、合并键、重复键。
# 改这里之前先对照这条约束。
on:
  push:
    branches: [main]
    paths-ignore:
      - .platform/tasks.yaml
      - docs/TODO.md
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的完整 40 位 commit SHA（回滚时填上一个好的那个）"
        required: true
      instance:
        description: "部署到哪个实例"
        type: choice
        options:
          - demo
          - production
        default: demo

permissions:
  contents: read

# D4：同一实例不允许并发部署，也不取消正在跑的那个——取消到一半会把线上停在中间状态。
# 并发组按实例分开（推送触发没有 inputs，按 demo）：共用一个组时，排队中的生产手工运行会被新的推送
# 静默顶掉，或者反过来。跨实例的串行交给 deploy.sh 的主机部署锁。
concurrency:
  group: deploy-${{ inputs.instance || 'demo' }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      image_repo: ${{ steps.resolve.outputs.image_repo }}
    steps:
      # D2：先定下要部署的确切提交，后面所有步骤只用这一步的输出。
      # 手工输入只经 env 进 shell（不直接 ${{ }} 拼进脚本，防注入），且只放行 40 位小写十六进制。
      - name: Resolve the commit to deploy
        id: resolve
        env:
          REF: ${{ inputs.ref || github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [[ ! "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full 40-character lowercase commit SHA"
            exit 1
          fi
          echo "sha=$REF" >> "$GITHUB_OUTPUT"
          # 镜像仓库名必须小写，而账号或仓库名可能带大写。
          echo "image_repo=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像在这里构建，不在共享服务器上构建。GIT_SHA 进镜像，健康检查原样返回。
      # acuven.project 标签让 deploy/deploy.sh 只清理本项目的旧镜像。
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: GIT_SHA=${{ steps.resolve.outputs.sha }}
          labels: acuven.project=stock_core
          tags: ${{ steps.resolve.outputs.image_repo }}-api:${{ steps.resolve.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    # 18 = Deploy 步的 command_timeout 14 + 前面几步与上线后健康检查正常情况下约 4。
    timeout-minutes: 18
    permissions:
      contents: read
      packages: read
    env:
      # 生产只接受以 CORE-TASK-067（按 CORE_ENV 区分实例、生产迁移前备份）在 main 上的合并提交为祖先的 SHA：
      # 更早的提交里的部署脚本不认实例，会把生产检出当 Demo 部署。
      PRODUCTION_FLOOR_SHA: "REPLACE-WITH-CORE-TASK-067-MERGE-COMMIT-SHA"
    steps:
      # 定下实例与检出目录，后面的部署与上线后健康检查只用这一步的输出。
      # 推送触发一律按 demo；手工触发只认 demo 或 production。目录为空即失败，不回落到另一个实例。
      - name: Resolve the instance and checkout directory
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_INSTANCE: ${{ inputs.instance }}
          APP_DIR_DEMO: ${{ secrets.VPS_APP_DIR }}
          APP_DIR_PRODUCTION: ${{ secrets.VPS_APP_DIR_PRODUCTION }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            instance=demo
          else
            case "$INPUT_INSTANCE" in
              demo | production) instance="$INPUT_INSTANCE" ;;
              *)
                echo "::error::instance must be demo or production"
                exit 1
                ;;
            esac
          fi
          case "$instance" in
            demo)
              app_dir="$APP_DIR_DEMO"
              secret_name=VPS_APP_DIR
              ;;
            production)
              app_dir="$APP_DIR_PRODUCTION"
              secret_name=VPS_APP_DIR_PRODUCTION
              if [[ ! "$PRODUCTION_FLOOR_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::PRODUCTION_FLOOR_SHA must be a full 40-character lowercase commit SHA"
                exit 1
              fi
              ;;
          esac
          if [ -z "$app_dir" ]; then
            echo "::error::$secret_name is not set; refusing to deploy the $instance instance"
            exit 1
          fi
          echo "instance=$instance" >> "$GITHUB_OUTPUT"
          echo "app_dir=$app_dir" >> "$GITHUB_OUTPUT"

      # 主机指纹没配就直接失败：ssh-action 的 fingerprint 留空时是静默跳过校验。
      - name: Require the host fingerprint
        env:
          FINGERPRINT: ${{ secrets.VPS_FINGERPRINT }}
        run: |
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::VPS_FINGERPRINT is not set; refusing to SSH without verifying the host key"
            exit 1
          fi

      # 所有值经 envs 传给远端脚本，不拼进脚本文本。
      # 远端先检出 DEPLOY_SHA，再跑那个提交里的 deploy/deploy.sh（D2）；它失败即非零退出（D3）。
      # 生产在 git fetch 之后、git checkout 之前核对 PRODUCTION_FLOOR_SHA 是 DEPLOY_SHA 的祖先，不是就退出、
      # 不动检出（检出停在旧提交上的话，cron 的巡检会跑旧脚本）。Demo 不做这项核对。
      # command_timeout：ssh-action v1.0.3 默认 10 分钟。deploy.sh 最坏要等主机部署锁 5 分钟，生产再加迁移前
      # 备份最多 1 分钟（60 秒），再加部署与回滚约 7 分钟：5 + 1 + 7 = 13 分钟，默认值会在部署中途切断 SSH；
      # 设为 14 分钟，留 1 分钟余量。Demo 不备份，同一个值对它多 1 分钟余量。
      # 走到回滚时 deploy.sh 以非零退出，后面的上线后健康检查不运行。成功路径是等锁 5 分钟 + 备份 1 分钟 +
      # 拉取与迁移 + 等健康最多 3 分钟，再加健康检查：此时容器已健康，通常第一次就通过；healthcheck.sh 的上限
      # 是 30 次、每次等 10 秒加取 healthz 最多 5 秒（约 7.5 分钟），只在异常时用满。那时 job 的 18 分钟可能先到，
      # 切断的是只读的健康检查，结论照样是失败，不会切断进行中的部署。
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ needs.build.outputs.sha }}
          IMAGE_REPO: ${{ needs.build.outputs.image_repo }}
          INSTANCE: ${{ steps.target.outputs.instance }}
          APP_DIR: ${{ steps.target.outputs.app_dir }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 14m
          envs: DEPLOY_SHA,IMAGE_REPO,INSTANCE,APP_DIR,PRODUCTION_FLOOR_SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            git fetch --quiet origin
            if [ "$INSTANCE" = "production" ]; then
              if ! git merge-base --is-ancestor "$PRODUCTION_FLOOR_SHA" "$DEPLOY_SHA"; then
                echo "refusing to deploy $DEPLOY_SHA to production: it does not contain $PRODUCTION_FLOOR_SHA" >&2
                exit 1
              fi
            fi
            git checkout --quiet --detach "$DEPLOY_SHA"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
            CORE_IMAGE_REPO="$IMAGE_REPO" bash deploy/deploy.sh "$DEPLOY_SHA"

      # D3：上线后健康检查。Core 没有公网入口，经 SSH 在服务器上进容器取 /healthz，
      # 要求返回体带着 DEPLOY_SHA——通过即同时证明上线的就是这个提交（D2）。
      - name: Post-deploy health check
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ needs.build.outputs.sha }}
          APP_DIR: ${{ steps.target.outputs.app_dir }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: DEPLOY_SHA,APP_DIR
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            bash deploy/healthcheck.sh "$DEPLOY_SHA"
