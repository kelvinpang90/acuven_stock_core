# 生产栈（Demo 与生产两个 Core 实例共用这一个文件，各一个检出）：只有 Core 的 API 一个容器，数据库用共享基建的
# infra_mysql 里的独立库，本项目不起数据库容器。
#
# 只在服务器上用，由 deploy/deploy.sh 驱动：它设置 CORE_API_IMAGE 为本次提交 SHA 标记的镜像。
# 项目名、网络名与别名由 deploy/instance.sh 按 .env 的 CORE_ENV 给出（docs/PRODUCTION_AND_RECOVERY.md 第 1.1、1.2 节）：
# 项目名经 -p 传，网络名与别名经它导出的环境变量传，这里不给默认值、也不写固定的 name，
# 不经 instance.sh 的 compose 命令因变量缺失直接报错，不会悄悄落到 Demo 的名字上。
# 其余变量从服务器上本目录的 .env 读（模板见 .env.example），不进仓库。
#
# 公网入口（契约 §10 第 5 条）：Demo 不开公网入口；生产挂代理网络，由一个只转发后台与平台接口两个路径前缀的
# vhost 对外。两个实例都不发布端口。
# 两个实例都恰好挂两条网络：
# - 数据网络连共享数据库：Demo 是 data_net（多个项目共用，所以服务名带 core_ 前缀，compose 把服务名注册成网络上的 DNS 别名）；
#   生产是只有 infra_mysql 与生产 Core 的 infra_mysql_core_production_net，不挂 data_net。都由 vps_infra 建。
# - callers 这一条按实例不同：Demo 是调用方内部网络 stock_core_net（别名 core_api），只给 Core 与它的调用方用，
#   由 deploy/deploy.sh 确保存在；生产没有外部调用方，是边缘反向代理所在的代理网络 proxy_net（别名 stock_core_production，
#   vhost 按它转发），由 vps_infra 建，deploy/deploy.sh 只核对、不建。

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  core_api:
    image: ${CORE_API_IMAGE:?set by deploy/deploy.sh to the commit-tagged image}
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    # 停止宽限（契约 8.6 第 4、5 条）：uvicorn 收尾上限 10 秒（Dockerfile 的 --timeout-graceful-shutdown）
    # ＋ 定时任务停止的截止时间 30 秒（app/services/periodic.py 的 DEFAULT_STOP_TIMEOUT）＋ 5 秒余量 = 45 秒。
    stop_grace_period: 45s
    environment:
      CORE_ENV: ${CORE_ENV:?set CORE_ENV in .env (demo or production)}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:?set CORE_DATABASE_URL in .env (see .env.example)}
      # 预留有效期（秒），60–3600；没设时取 900（契约 5.6）。
      CORE_RESERVATION_TTL_SECONDS: ${CORE_RESERVATION_TTL_SECONDS:-900}
    networks:
      data: {}
      callers:
        aliases:
          - ${CORE_CALLER_ALIAS:?set by deploy/instance.sh from CORE_ENV}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  data:
    name: ${CORE_DATA_NETWORK:?set by deploy/instance.sh from CORE_ENV}
    external: true
  callers:
    name: ${CORE_CALLER_NETWORK:?set by deploy/instance.sh from CORE_ENV}
    external: true
