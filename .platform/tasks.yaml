  - id: CORE-TASK-097
    title: 运维命令行加管理员账号的建号、改密、停用与恢复子命令
    purpose: >-
      按 docs/ADMIN_AUTH.md 0.3 第 4.6 节（登录三）与契约 docs/CONTRACT_V1.md 0.22 的 7.2（Q-92）。工作包 P3c。
      新模块 app/cli/admin.py，照 app/cli/service_auth.py 的写法接进 app/cli/__main__.py：python -m app.cli admin 下 create-account（必填 --tenant）、reset-password、disable-account、enable-account 四个子命令，都要 --actor 与 --reason（格式与校验同 credential issue）。
      只在 CORE_ENV 为 production 且后台开关为真（在 app/cli/__main__.py 里读 CORE-TASK-073 加的 Settings.admin_enabled，不经 run_command）时可用，否则以退出码 2、标准错误一行原因结束、不碰库；判定顺序照 4.6（argparse → CORE_ENV 与开关 → 用户名合法 → 连库与库里的实例标记 → 查库与提示输入密码）。
      不用 run_command 的 engine.begin() 包装（4.5 的服务函数自己提交）：本模块写自己的执行函数，连库之前与之后的检查照 run_command 的先后与退出码（连接串为空、配置不合格、实例标记核对不过都是退出码 1、一行原因、不写安全事件），再用 engine.connect() 取一个不在事务里的连接交给子命令，异常照 run_command 的映射（OperationalError 与其余 SQLAlchemyError、意外异常都只给固定文字或异常类名，退出码 1），成功后用现有的 write_audit_event 记安全事件，最后 dispose 引擎。
      密码只经 getpass 不回显地输入两次，不接受命令行参数或环境变量；create-account 在提示输入之前用 account_exists 查重，reset-password 在提示之前查账号存在。account_exists 与 get_account 在这个连接上自动开的只读事务，在调 getpass 之前、以及调任何会改数据的服务函数之前，都先 rollback 结束（提示输入时不持有事务与锁；改数据的服务函数自己开事务并提交）；成功后为输出与安全事件再读 get_account 的，读完同样 rollback。命令只调 CORE-TASK-096 的服务函数（含只读的 get_account，用来取输出与安全事件要的账号 ID、租户与主体）与 utc_now，不另写规则或查询。
      退出码照 Core 命令行（app/cli/__init__.py）：0 成功（含两种“已是……状态”）；2 参数或校验错误（参数不对、AccountError、两次输入不一致、实例或开关不对、输入时 EOF 或 Ctrl+C 输出“已取消”）；1 其他失败（SQLAlchemyError 只输出异常类名，不输出连接串）。成功结果写标准输出、错误写标准错误；输出只有规范用户名、账号 ID 与结果，不打印密码或哈希。
      审计：成功（“已是……状态”除外）后在提交之后照 Core 命令行的做法记一条安全事件，类型 admin_account_created、admin_password_reset、admin_account_disabled、admin_account_enabled，tenant_id 为账号的租户、credential_id 为目标账号的主体（同 credential issue 的事件记被签发的凭据），actor_ref 为 --actor，details 写 reason、目标账号 ID、它的主体 credential_id 与规范用户名；事件写入失败时操作照样生效、标准错误多一行警告。服务函数已提交之后的步骤（为输出与事件再读 get_account 等）遇到数据库错误时，退出码 1，标准错误说明操作已生效、安全事件没有记（不用 run_command 的“什么也没写”措辞）。
      明确不做：接口（CORE-TASK-098）；登录尝试的查看与清理。
    status: ready
    depends_on:
      - CORE-TASK-096
      - CORE-TASK-073
    acceptance_criteria:
      - 只改 allowed_change_paths；测试写在 tests/integration/test_cli_admin.py，照 Core 命令行测试的写法直接调 main（参数列表、Settings、两个输出流），替换 getpass.getpass 提供输入
      - 四个子命令各有成功一条与至少一种失败一条，退出码与输出去向照 4.6；输出含规范用户名（输入大写用户名时输出小写），不含密码、哈希、连接串，测试不逐字比对措辞
      - CORE_ENV 为 demo、或 production 而开关为假时，四个子命令都以退出码 2 结束、库里没有变化（测试用不存在的库连接串也得同样结果，证明判在连库之前）
      - 两次输入不一致、EOF、KeyboardInterrupt 都以退出码 2 结束、什么也不写；create-account 遇到已有用户名时 getpass 没有被调用；替换的 getpass 被调用时断言传给子命令的连接不在事务里（in_transaction 为假）
