      - 集成测试验证状态变化：释放、定时任务到期关单、释放命中已到期、确认销售、晚到确认、转入待审、待审结案之后，last_changed_at 都变大，且等于该事务写进预留的 created_at、closed_at、committed_at、review_closed_at 中最晚的一个（不看 expires_at 与 paid_at）；到期未关的 active 预留在确认销售的同一事务里先关单时，无论够不够、确认还是转入待审，都等于关单写的 closed_at（照常调用走不到这条路径：开事务前的先关到期会在另一个事务里关掉它；照 tests/integration/test_sale_commit_late_api.py 的 unclosed 夹具用 monkeypatch 把这一步换成空操作再测），照常调用时确认等于 committed_at、转入待审等于本命令的时间；已关单的预留第一次转入待审（不写这几列）时等于本命令的时间、不早于转入之前的值，也不取 paid_at（paid_at 给一个未来的时间验证）
