  - id: CORE-TASK-039
    title: 实现预留的释放与到期关闭
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.12 的 5.6（释放、到期关闭、隔离级别、锁序、订单行的 sku_id）与 5.2 第 4 条，在 CORE-TASK-038 的 app/api/reservations.py 与
      app/services/reservations.py 上加释放命令、到期关单、定时任务与新预留之前的关单。规则用 app/domain/reservations.py 的 release_decision、is_due。
      零，app/services/stock.py 的 lock_balances 与 append_entry 都从请求的 Execution 取连接、租户与身份，关单没有请求：
      各拆出一个只收连接、租户与身份的底层函数（身份即流水的 channel_id、idempotency_key、credential_id、actor_ref、actor_role、request_id 六项），
      原来的两个函数改为从 Execution 取出这些再调用底层函数，签名与行为不变；关单调用底层函数，身份只给 channel_id（预留的入口），其余为空。不在 reservations.py 里另抄一份写流水的代码。
      一，到期关单 close_if_due：FOR UPDATE 读预留行，不是 active 或未到期什么也不做；否则 FOR SHARE 读订单行，按读到的 sku_id 升序锁余额行，每行一条 RELEASE
      （reason_code expired，不带凭据、幂等键、操作者与请求 ID，channel_id 取预留的入口，每次关单一个新的 command_id），预留改为 expired、记 closed_at。它在调用方给的事务里运行，自己不提交。
      二，POST /v1/reservations/{reservation_id}/release（操作类型 reservations.release，scope orders.write，不要求角色）：正文只有 reason（三个取值之一），其他 422。
      池授权用 app/api/auth.py 的 require_object_pool（对象类型 reservation，404 RESERVATION_NOT_FOUND），经 run_idempotent，read_committed=True，不传 balance_rows（订单行的余额行在预留时已建好）。
      命令 FOR UPDATE 读预留行后按 release_decision：RELEASE 时 FOR SHARE 读订单行、升序锁余额行、每行一条 RELEASE（reason_code 为请求的 reason），预留改为 released，记 release_reason、closed_at 与 released_ 一组列，200；
      EXPIRE 时在同一事务里按第一点关单，200，表示为 expired；UNCHANGED 不写任何东西，200 与当前表示；CONFLICT 为 409 STATE_CONFLICT。
      三，执行器钩子：app/services/idempotency.py 的 run_idempotent 加一个可选参数，在设好 READ COMMITTED 之后、开业务事务之前在同一连接上调用；不传的命令行为不变。
      新预留用它做契约 5.6 的先关到期：用普通读查出所列 SKU 上 active 且已到期的预留，只查凭据的租户、凭据入口的池（订单行与预留都按 tenant_id 与 pool_id 过滤，别的租户的 sku_id 不会关到别人的预留），按 expires_at 升序最多 100 个，逐个在各自的事务里调用 close_if_due 并提交；
      某个关单出错时回滚它、记进程日志、继续下一个；查候选预留的那条普通读本身出错，或连接已作废、回滚本身出错、连接断开时（这时幂等命名锁与 READ COMMITTED 都已不在），不再继续，整个请求 503 UNAVAILABLE，什么也不保存，同键可以重试。
      四，定时任务：app/main.py 的 lifespan 再起一个 app/services/periodic.py 的 PeriodicTask，间隔 30 秒、首次等 30 秒，与安全事件清理并列，退出时一并停止；
      每次从连接池取一个连接，照执行器 _release_locks 的做法：先 SET SESSION transaction_isolation 为 READ-COMMITTED，用完先 SET SESSION transaction_isolation = DEFAULT 再放回池，
      设回出错就把这个连接作废（invalidate）、不放回池（契约 5.6 隔离级别）；不用 execution_options 设隔离级别（它在归还时复原出错既不作废也不归还）。
      用普通读查 active 且已到期的预留，按 expires_at 升序逐个在各自的事务里关单；
      一个关单出错时回滚它、记进程日志、继续下一个；查候选出错、连接已作废、回滚出错或连接断开时停止本轮扫描（不在新连接上接着关），下一轮重新取连接。
      明确不做：确认销售与晚到支付；SKU 合并之前的关单（登记合并任务时做）；可售量查询（CORE-TASK-040）。
    status: done
    depends_on:
      - CORE-TASK-038
    acceptance_criteria:
      - 释放接口与命令加在 app/api/reservations.py 与 app/services/reservations.py；执行器钩子在 app/services/idempotency.py，不传时已有命令的测试照常通过；定时任务在 app/main.py 的 lifespan 起停；app/services/stock.py 只做底层函数的拆分，lock_balances 与 append_entry 的签名与行为不变，已有的收货、调整、盘点、更正、Demo 重置测试照常通过
      - 集成测试验证释放：active 未到期释放后 reserved 按行减回、每行一条 RELEASE 且 reason_code 为请求的 reason、表示为 released 并带 released_at 与 release_reason；再释放（含换原因、换键）200 不写流水、原因不变；已到期未关的 active 释放后为 expired、流水 reason_code 为 expired 且不带凭据与请求 ID；状态为 committed 的预留 409 STATE_CONFLICT（测试直接把行改成 committed）
      - 集成测试验证释放的池授权与正文：别的租户的 reservation_id 404 RESERVATION_NOT_FOUND 并记 cross_tenant；凭据没有入口 403；reason 缺少或不在三个取值里 422
      - 集成测试验证到期关单：直接调用关单函数，已到期的关一次、写对流水、预留为 expired；再调一次什么也不写；未到期的不动；两个连接并发对同一预留关单只写一组 RELEASE
      - 集成测试验证新预留之前的关单：一个已到期未关的预留占着某 SKU 的全部可售量时，对该 SKU 的新预留成功，且旧预留已关为 expired；关单时连接出错（测试里让钩子用的连接失效）时请求 503、没有新预留也没有幂等记录
      - 集成测试验证定时任务：单次扫描函数关掉全部已到期的 active，不碰未到期与非 active 的；扫描用过的连接放回池后隔离级别为默认值，复原隔离级别出错时连接被作废、不放回池；照 tests/integration/test_security_event_purge.py 里 lifespan 那条测试，验证 lifespan 起停到期扫描、间隔与首次等待都是 30 秒
      - 集成测试验证合并改挂的读取：把订单行的 sku_id 改成另一个 SKU 并把 reserved 挪过去（模拟合并）后，释放减的是新 SKU 的 reserved
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
