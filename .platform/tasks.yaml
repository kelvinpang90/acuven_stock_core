      三，按 sku_shortfalls 判可售（停用、合并进行中都不拦）；写预留一行与订单行：fault_mode 为真，created_at 与 closed_at 为现在，ttl_seconds 取当前配置，expires_at 为 created_at 加它，
      request_hash 用 reserve_request_digest，创建的凭据、操作者与请求 ID 取本次请求；够则每行一条 LATE_SALE_COMMIT（reason_code fault_mode）、订单行 committed_qty 等于 quantity、状态 committed、late 为真；
