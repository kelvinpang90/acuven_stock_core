  - id: CORE-TASK-013
    title: 实现目录字段取值、修改差异、编码归属与目录锁名等纯函数
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.7 的 2.2、2.5、2.6 与 2.7，把目录命令不碰数据库的规则写成纯函数，放新文件 app/domain/catalog.py，单元测试放 tests/unit/test_catalog.py（标准库 unittest），
      供之后的目录接口、批量导入与变更流任务调用。只 import 标准库与 app/domain 内的模块。
      一，字段取值（2.6 第 1 条）：对 JSON 解析后的原始值逐个校验并返回规范化值，不合规时抛一个带字段名的异常（导入按字段名记 invalid_format，接口转 422）。类型严格：字符串字段只收 str，
      金额只收 int 且不收 bool。去首尾空白按 str.strip()，控制字符指 U+0000 到 U+001F 与 U+007F。名称（商品与 SKU 的 name）：去首尾空白后 1 到 200 个字符、不含控制字符；
      sku_code：去首尾空白后 1 到 64 个字符，每个字符都是可打印 ASCII（0x20 到 0x7E）；barcode：None 或去首尾空白后为空串时得 None，否则同 sku_code；
      reference_price：None，或恰好含 amount_minor 与 currency 两个键的对象，amount_minor 为 0 到 9007199254740991 的整数，currency 为 3 个大写 ASCII 字母（不查 ISO 4217 清单）；
      reason：None，或去首尾空白后 1 到 500 个字符、不含控制字符的字符串。修改时 name 与 sku_code 不接受 None（另给一个参数或函数区分新建、修改与可清空的字段）。
      二，编码比较键：编码与条码的重复按 ASCII 不区分大小写判断（规范化后转小写比较），提供取比较键的函数；“改没改”按规范化后的字符串原样比较，只改大小写也算改。
      三，修改差异：给定对象当前的字段值与请求里带的已规范化字段，算出改动字段，形如字段名映射到含 before 与 after 的对象；与当前值相同的字段不算；reference_price 整个对象算一个字段；
      全都相同时为空。新建时 before 全为 None 的改动字段也由这里生成：商品为 name 与 status，SKU 为 sku_code、barcode、name、reference_price 与 status；停用与重新启用为 status。
      四，编码归属判定（2.2）：输入新编码在归属表里的归属 SKU（没有为 None）、那个 SKU 的当前编码与新编码的比较键是否相同、发起修改的 SKU（新建时为 None），
      得出：未登记，插入新归属；已归属自己（改回旧编码或只改大小写），不再插入；是别的 SKU 的当前编码，SKU_CODE_TAKEN；是别的 SKU 的退役编码，SKU_CODE_RETIRED。
      五，冲突码：给定一组冲突项（可选 index、field、value、code），按 SKU_CODE_TAKEN、SKU_CODE_RETIRED、BARCODE_TAKEN 的顺序取顶层错误码；全部冲突项保留，按 index 升序、同一 SKU 先 sku_code 后 barcode 排列。
      六，修改请求的形状（2.6 第 4 条中不碰库的部分）：除 expected_version 与 reason 外至少带一个字段；已合并的 SKU 只接受“除 expected_version 与 reason 外只带 barcode，且规范化后为 None”。
      七，目录写锁名（2.7）：数据库名、字面量 catalog、tenant_id 三项以换行符 0x0A 连接后 UTF-8 编码的 SHA-256 小写十六进制，64 个字符。
      八，变更流（2.5）：八个事件类型常量；游标是变更记录 id 的十进制字符串，调用方当不透明值；解析游标只接受正整数的十进制表示：1 到 19 位数字、首位为 1 到 9、不超过 9223372036854775807（0 不合格）；
      limit 不带为 100，带时只接受无符号、无前导零、1 到 100 的十进制数字串；不合格都抛异常（接口转 422）。
      明确不做：数据库、接口、批量导入的逐行判定（下一任务）。
