  - id: CORE-TASK-098
    title: 管理员登录、取当前会话与退出接口，后台接口共用的登录与 CSRF 依赖
    purpose: >-
      按 docs/ADMIN_AUTH.md 0.3 第 5 节（登录四）与契约 docs/CONTRACT_V1.md 0.22 的 8.1 的 0.22 一条（Q-93）、8.6 第 2 条的两个响应头。工作包 P3d。
      一，app/api/admin_session.py 导出 router：POST、GET、DELETE /api/v1/admin/session，请求、响应、状态码与 detail 照 5.1 的表；登录接口是 async def，按 5.1 第 2 到 7 步判定（跨站 403、媒体类型 415、请求体 4096 字节与解析 422 不回显提交内容、进行中满 10 个 503 login_busy、经模块级 anyio.CapacityLimiter(2) 放进线程池调 authenticate、成功时撤销请求带来的旧会话且这一步出错不改变回答）；GET 与 DELETE 与依赖写成普通 def。会话 cookie 照 5.2（名字 __Host-core_admin_session）；来源地址照 5.3（X-Real-IP 恰好一个且是合法地址才用，不读 X-Forwarded-For）。5.1 列出的全部响应带 Cache-Control no-store；处理中 SQLAlchemyError 回 503 database_unreachable。
      数据库连接用新依赖 get_connection(request)：直接返回现有 app/api/requests.py 的 request_connection(request)（本请求唯一的连接，请求结束由中间件归还），一个后台请求只占一个连接；依赖与 GET、DELETE 查完库就在这个连接上 rollback 结束读事务（resolve_session 只读不提交），之后执行器核心照旧用同一个连接。登录接口在线程里自己从 app.state.engine 取连接、用完归还。require_admin 与 require_admin_csrf 照 5.4（Annotated 写法，AdminPrincipal 带 account_id、username、session_id、tenant_id、credential_id），之后的后台接口都用它们；它们查库遇到 SQLAlchemyError 时作废这个连接、回 503 {"detail": "database_unreachable"}（同 5.1，会话依赖的拒绝都是 detail 形状）。连不上库也一样：get_connection 接住 request_connection 取连接失败时抛的 Core 格式 503（以及 SQLAlchemyError），改回 503 {"detail": "database_unreachable"}，所以后台的会话接口与会话依赖不论连不上还是查库出错都是 detail 形状（补的：request_connection 本身与 /v1 的行为不变）。
      二，app/main.py 的 create_app 只在后台开关为真时 include_router（CORE-TASK-073 记在 app.state 上的开关）。
      三，app/api/requests.py 的请求中间件按路径前缀 /api/ 与 /admin/ 判断（与路由挂没挂上无关）：X-Request-ID 一律不用调用方给的值、总是生成，也不因它不合格回 400；路由 404、405 与 128 KiB 的 413 照用、格式同 /v1；这两个前缀下的每个响应都加 Content-Security-Policy 为 frame-ancestors 'none' 与 X-Frame-Options 为 DENY（契约 8.6 第 2 条）；/api/v1/admin/ 下的每个响应另加 Cache-Control 为 no-store（已带的不重复加；后台响应含库存与账号数据，补的）。/v1、/healthz、/readyz 的行为不变。
      明确不做：后台执行器与业务接口（CORE-TASK-099 起）；登录页前端；登录尝试的查看与清理。
    status: ready
