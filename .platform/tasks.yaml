  - id: CORE-TASK-014
    title: 实现批量导入的逐行判定、汇总与确认计划的纯函数
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.7 的 2.3，把批量导入不碰数据库的规则写成纯函数，放新文件 app/domain/catalog_imports.py，单元测试放 tests/unit/test_catalog_imports.py（标准库 unittest）；
      字段取值、比较键用 CORE-TASK-013 的函数，引用格式用 app/domain/requests.py 已有的 is_reference。只 import 标准库与 app/domain 内的模块。
      一，预览判定：输入 rows（JSON 解析后的列表，每个元素已由接口确认是对象）、现有归属表里编码的比较键集合（含任何 SKU 的当前与退役编码）、现有 SKU 当前条码的比较键集合
      （服务层按本次导入出现的编码与条码查出）。逐行先校验字段：必填 external_ref、product_ref（第 1 节引用格式）、product_name（按商品名称）、sku_code、sku_name（按 SKU 名称）；
      barcode、reference_price 可不带或为 null；多出的字段与缺的字段都算不合规，记下出错的字段名；多出的字段统一记为固定字符串 unknown_field（只记一次），不记调用方的键名，以免响应里回显调用方的任意值。因 external_ref 重复而 invalid_format 的行记 external_ref，因同组 product_name 不一致而 invalid_format 的行记 product_name，与行内字段错误合并去重；列表按固定顺序 external_ref、product_ref、product_name、sku_code、sku_name、barcode、reference_price、unknown_field 排列。然后按 2.3 的顺序取第一个命中的结果：
      invalid_format（行内字段不合规；或 external_ref 在本次导入里重复，重复的各行都算；或同一 product_ref 各行的 product_name 去首尾空白后不完全相同，该组各行都算）、
      duplicate_sku_code（别的行用了比较键相同的 sku_code，各行都算）、duplicate_barcode（同上，只比较非空条码）、conflicts_existing（编码键在归属集合里，或条码键在条码集合里）、
      group_blocked（本行没问题，但同一 product_ref 的别的行有问题）、ok。判定细则照 2.3：external_ref 与 product_ref 按字符串原样比较、区分大小写；product_ref 本身不合规的行不归任何组、只影响自己；
      external_ref 本身不合规的行不参加 external_ref 的重复检查；名称一致性只在 product_name 本身合规的行之间比较；记为 invalid_format 的行不参加编码、条码的重复检查与 conflicts_existing 检查，但照样让所在的组 group_blocked。
      每行输出：行下标、行里的 external_ref 与 product_ref 原值（没带为 None）、结果、invalid_format 时出错的字段名列表，以及合格行规范化后的字段值。
      二，汇总：六种结果各自的行数（六个键都有）、可执行的组数与行数（全组为 ok 的组）。
      三，确认计划：输入预览的逐行结果与按当前目录重查得到的冲突（哪些 ok 行的编码或条码现已被占用）；按组在 rows 里首次出现的顺序列出要建的组（整组都没有冲突的 ok 组，名称取 product_name，各 SKU 名称取 sku_name）；
      逐行结果为 created（由服务层建好后填 product_id 与 sku_id）、skipped（预览不合格，带预览结果）或 failed（重查冲突的行为 conflicts_existing，同组别的行为 group_blocked）。
      明确不做：数据库、接口、存放格式。
    status: done
    depends_on:
      - CORE-TASK-013
    acceptance_criteria:
      - 规则放 app/domain/catalog_imports.py，只 import 标准库与 app/domain 内的模块；单元测试放 tests/unit/test_catalog_imports.py
      - 单元测试覆盖字段：缺必填字段、多出字段、类型不对、引用格式不对都为 invalid_format 并带出错字段名；barcode 与 reference_price 不带或为 null 可以；invalid_fields 按 purpose 第一条：多出几个字段都只记一次 unknown_field、external_ref 重复记 external_ref、同组名称不一致记 product_name、与行内错误合并去重、按固定顺序排列
      - 单元测试覆盖顺序与细则：external_ref 重复的各行 invalid_format；同组 product_name 去空白后不一致时组内各行 invalid_format，且只在合规名称之间比较；sku_code 只差大小写的两行都 duplicate_sku_code；非空条码重复为 duplicate_barcode，两个 null 条码不算重复；invalid_format 的行与另一行编码相同时另一行仍可为 ok；一行同时请求内重复且与现有冲突时取 duplicate_sku_code
      - 单元测试覆盖 conflicts_existing（编码在归属集合里，含退役编码与只差大小写；条码在条码集合里）与 group_blocked（组内一行不合格其余合格行为 group_blocked；product_ref 不合规的行不归任何组、不连累别的行）
      - 单元测试覆盖汇总计数与确认计划：两组都 ok 时按首次出现顺序建；一组重查有冲突时冲突行 failed conflicts_existing、同组别的行 failed group_blocked、别的组照建；预览不合格的行 skipped 并带预览结果；全部组都冲突时仍给出完整的逐行结果
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
    allowed_change_paths:
      - app/domain/catalog_imports.py
      - app/domain/catalog.py
      - tests/unit/test_catalog_imports.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
