  - id: CORE-TASK-018
    title: 实现商品与 SKU 的修改、停用与重新启用接口
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.7 的 2.2、2.4 中已合并 SKU 的规则、2.6 第 4、5 条与 2.7，在 CORE-TASK-016、017 的 app/api/catalog.py 与 app/services/catalog.py 上加：
      PATCH /v1/products/{product_id}（products.update）、PATCH /v1/skus/{sku_id}（skus.update）、POST /v1/products/{product_id}/deactivate 与 /reactivate（products.deactivate、products.reactivate）、
      POST /v1/skus/{sku_id}/deactivate 与 /reactivate（skus.deactivate、skus.reactivate）。都要求 catalog.write 与 catalog_admin，经 run_idempotent 并声明目录写锁；规则用 CORE-TASK-013 的纯函数。
      一，修改：正文 expected_version（必填，正整数）与可选 reason；商品另可带 name，SKU 另可带 sku_code、barcode、name、reference_price。除 expected_version 与 reason 外至少带一个字段，否则 422；
      name 或 sku_code 为 null 422；barcode、reference_price 为 null 是清空；其他字段（status、product_id、merged_into_sku_id 等）是未知字段，422。
      在事务里用 SELECT FOR UPDATE 按 ID 读要改的行，依次判定：不存在 404 PRODUCT_NOT_FOUND 或 SKU_NOT_FOUND，属于别的租户时响应完全相同并经执行器登记 cross_tenant；
      已合并的 SKU 不是“只清空条码”的修改时 409 SKU_MERGED；版本不符 409 VERSION_CONFLICT，details.current_version 为当前版本；按 CORE-TASK-013 算改动字段，全都相同时返回 200 与当前表示，
      不加版本、不写变更记录与编码历史；改动的编码或条码与别的 SKU 冲突时 409（同 CORE-TASK-017，冲突项不带 index）；万一写入仍撞上唯一约束，按撞上的约束报 409、不返回 500：撞 skus 的编码唯一约束为 SKU_CODE_TAKEN，撞条码唯一约束为 BARCODE_TAKEN，撞归属表主键时在同一事务里用加锁读（SELECT FOR SHARE，直接查归属行与那个 SKU 的当前编码，不经测试会替换的冲突查询函数）重查，按 CORE-TASK-013 的编码归属判定定 SKU_CODE_TAKEN 或 SKU_CODE_RETIRED（重查仍找不到归属行时不猜码，抛出异常按 500 处理），details.conflicts 只列撞上的那一项；否则写入：改字段、版本加 1、updated_at 写数据库当前时间，
      写一条 product_updated 或 sku_updated，changes 只含改动字段。改了 sku_code 时照 2.2：按编码归属判定决定是否插入归属行，把旧值、新值、X-Actor-Ref 与正文 reason 写进 sku_code_history。
      inactive 的商品与 SKU 也可以改。返回 200 与改后的表示。
      二，停用与重新启用：没有请求体（非空请求体 422）。事务里 SELECT FOR UPDATE 读行；不存在与跨租户同上；重新启用已合并的 SKU 409 SKU_MERGED；已是目标状态时返回 200 与当前表示，
      不加版本、不写记录（停用已合并的 SKU 也按这条）；否则改状态、版本加 1、updated_at 写数据库当前时间，写一条 product_deactivated、product_reactivated、sku_deactivated 或 sku_reactivated，
      changes 为 status 的前后值，reason 为空。停用商品不改它的 SKU 的状态；所属商品 inactive 时照样可以重新启用 SKU；停用不检查库存与未结订单。返回 200 与改后的表示。
      明确不做：预留对商品与 SKU 状态的检查（随预留任务做）、SKU 合并、删除、批量导入、变更流接口。
    status: done
    depends_on:
      - CORE-TASK-017
    acceptance_criteria:
      - 接口加在 app/api/catalog.py，数据库读写加在 app/services/catalog.py；CORE-TASK-016、017 的测试照常通过
      - 集成测试在真 MySQL 上验证修改成功：商品与 SKU 的版本加 1、updated_at 更新，一条 product_updated 或 sku_updated 只含改动字段的前后值，同时改名称与参考价也只有一条；全都与当前值相同时 200、不加版本、没有记录；只改编码大小写算改并写编码历史
      - 集成测试验证改编码与条码：旧值进 sku_code_history（actor_ref 取 X-Actor-Ref、reason 取正文），新编码登记归属；改回自己用过的编码不再插入归属行；改成别的 SKU 的当前编码或退役编码分别 409 SKU_CODE_TAKEN 与 SKU_CODE_RETIRED；条码被占 409 BARCODE_TAKEN；改成只与别的租户的 SKU 相同的编码或条码照常成功；测试让冲突查询漏报时撞约束得对应的 409 而不是 500；清空条码与参考价可以，清空后别的 SKU 能用这个条码
      - 集成测试验证判定顺序：不存在与跨租户得完全相同的 404，跨租户记 cross_tenant；版本不符 409 VERSION_CONFLICT 带当前版本且什么也不改；版本不符同时编码冲突时报 VERSION_CONFLICT；两个 expected_version 相同的修改换键先后提交，后者 409 VERSION_CONFLICT；缺 expected_version、只带 expected_version 与 reason、name 为 null、带 status 都为 422
      - 集成测试验证已合并的 SKU（测试在库里造）：只带 barcode 为 null 或空白串时清空成功；带别的字段 409 SKU_MERGED，且版本不符时仍报 SKU_MERGED；重新启用 409 SKU_MERGED；停用 200 且没有变化
      - 集成测试验证停用与重新启用：状态改变、版本加 1、记录含 status 前后值且 reason 为空；已是目标状态时 200、不加版本、没有记录；停用商品后它的 SKU 状态不变而表示里 product_status 为 inactive；商品 inactive 时能重新启用 SKU；带非空请求体 422
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/api/catalog.py
      - app/services/catalog.py
      - app/domain/catalog.py
      - tests/integration/conftest.py
      - tests/integration/test_catalog_updates_api.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
