nts 的 credential_id 取）；那个主体不是管理员（例如运行手册的 SQL 写的 system 主体）或列为空时为 null；不输出 credential_id；时间用 app/api/catalog.py 的 RFC 3339 微秒 Z。这个租户没有这一行时 paused 为假、其余为 null（补的）。读查询加在 app/services/admin_queries.py。 明确不做：运行手册里设上暂停的 SQL；解除暂停时触发一次全量重写（恢复后的差异由对账与读回设上待核对、解除时按 CORE-TASK-121 的触发 (c) 重写）；前端的按钮与横幅。
