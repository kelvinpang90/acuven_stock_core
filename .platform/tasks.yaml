  - id: CORE-TASK-117
    title: 收事件的服务：webhook 验签后写收件箱，收件箱处理作业的一轮，事件积压与被拒告警
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 3 节（webhook、处理）与第 8 节（严重异常）、契约 docs/CONTRACT_V1.md 0.22 的 5.10 与 8.6 第 3 条（工作包 P4c 的一部分）。新服务模块 app/services/platform_intake.py；写收件箱与处理订单都调 CORE-TASK-086 起的 app/services/platform_events.py，不在这里重写。
      一，handle_webhook(engine, adapters, platform, headers, body) 返回 not_found、rejected、ignored、acknowledged 或 accepted：没有这个平台的适配器得 not_found（接口回 404）；adapter.parse_webhook 抛 SignatureInvalid 得 rejected（接口回 401，不写收件箱）；按 batch.shop_id 找 platform 与 platform_shop_id 都相等的 active platform 入口，找不到或多于一个得 ignored（应答成功、不写，进程日志记平台与店铺 ID；平台重发也找不到它，补的）；连接 mode 为 manual 得 acknowledged、不写（设计第 3 节）；否则先丢掉 payload 的 platform_time 早于连接 takeover_at 的事件（契约 5.10 引用格式第 2 条：平台时间早于接管点的自动事件不处理，webhook 与补拉一样；没有 platform_time 的事件保留，它按 received_at 排序，而 received_at 总晚于接管点；这一条是补的），再对每个事件调 record_auto_event(source 为 webhook)；但这个订单在写这一批之前收件箱里已有 source 为 webhook 或 pull 的事件时，按契约 0.25 的 5.10 引用格式第 2 条例外判。判法写成本模块导出的 takeover_cut(conn, tenant_id, channel_id, platform_order_id, takeover_at)，在写这一批之前读收件箱，返回交给 CORE-TASK-113 的 drop_before_takeover 的起丢点：takeover_at 为空时返回空；这个订单没有 source 为 webhook 或 pull 的事件时返回 takeover_at；有时取这些事件里最早的平台时间记为 T（没有平台时间的那条取它的 received_at），返回 takeover_at 与 T 中较早的（只丢平台时间早于两者的）；CORE-TASK-118 导入同一个函数，不另写一遍（人工登记过的动作都早于 T：接管点之后有人工登记时不能切换，CORE-TASK-120；有了自动事件之后不能人工登记，CORE-TASK-105，人工期里的动作只能靠补拉，不早于 T 的不丢；第一次写这个订单时按接管点丢掉的事件早于 T，下一次照样丢），单个事件报 ValueError（形状不合格，适配器的缺陷）时记一行日志、跳过这一个，数据库错误往外抛（接口回 503，平台重发）；得 accepted。
      二，InboxRunner.run_round(engine, settings)：作业 platform-inbox 的一轮（不取作业锁，按订单取锁，契约 8.6 第 4 条）。orders_with_pending_events(engine, 500)，跳过上一轮没处理完就停下的订单一次（不论停下的原因是锁忙、出错、blocked 还是 missing_prior；CORE-TASK-086 留给作业定：用 InboxRunner 对象上的内存集合，跳过一次后移出，补的；一直停下的订单隔轮才占一次名额，而且由四的积压告警报出），其余逐个 process_order(…, reservation_ttl_seconds 取 settings)。
      三，被拒告警：每轮在处理之后扫一遍 applied_at 在数据库时间减 24 小时之内、满足下面之一的事件：result 为 held 或 attention 且 result_code 不在普通原因表里；或 result_code 为 defect（CORE-TASK-088、089 的重新判定成功时 result 为 applied、result_code 为 defect，设计第 8 节把引用冲突类的缺陷列为严重异常）。这个订单已有 created_at 不早于这个事件 applied_at 的 core_rejected 告警（不论确认与否）就跳过，否则记一条 core_rejected 告警（record_alert，platform_order_row_id 为这个订单，detail 为 event_row_id 与 result_code）。这样扫不靠“这一轮处理了哪些”，发布、对账与后台人工操作里处理的事件、以及上一轮中途出错没扫到的，都在下一轮扫到，重扫也不重复记（补的写法）。普通原因表为 unmapped、unknown_line、cancel_exceeds_remaining、refund_id_missing、cancel_lines_missing、missing_platform_id、line_not_committed（CORE-TASK-087 列的原因里只在后台显示的那些，V-07）；STATE_CONFLICT 不在表里：已确认之后 Core 拒绝的错误码也可能是它，result_code 区分不了，宁可多报。
      四，积压告警：每轮找出 received_at 早于数据库时间减 15 分钟仍未处理的事件（设计第 8 节）：有平台订单的按订单记 inbox_stuck 告警（platform_order_row_id 为这个订单）；还没有平台订单的，每个入口汇总记一条（platform_order_row_id 为空、channel_id 为这个入口，detail 为这样的订单数与最早一个的 platform_order_id；没有地方按订单去重，所以按入口汇总，补的）。已有 created_at 不早于其中最新那个积压事件的 received_at 加 15 分钟的同一 inbox_stuck 告警（不论确认与否）就不再记（同三的截止写法：管理员确认之后，同一批积压不再每轮重报；有新的事件积压满 15 分钟才再报）。
      明确不做：webhook 路由与挂作业（CORE-TASK-119）；补拉（CORE-TASK-118）。
    status: ready
    depends_on:
      - CORE-TASK-115
      - CORE-TASK-089
    acceptance_criteria:
      - tests/integration/test_platform_intake.py 用模拟适配器：签名对、auto 模式的入口，事件进收件箱、得 accepted；同一批再送一次不多写；签名不对得 rejected 且不写；manual 模式得 acknowledged 且不写；店铺 ID 找不到得 ignored；没有适配器得 not_found；一个事件形状不合格时其余照写
      - 同一文件：数据库不可用时 handle_webhook 抛出异常（用替换引擎的方式模拟），不返回 accepted
      - 收件箱一轮处理完已到的新订单与待发货；某订单的锁被别的连接持有时这一轮停在锁忙、下一轮跳过它一次、再下一轮处理它
      - 告警：待发货被 Core 拒绝预留（库存不够）记一条 core_rejected，连跑两轮仍只有一条；找不到平台商品（unmapped）不记；不经收件箱作业、直接调 process_order 处理出的被拒事件下一轮也记上；超过 15 分钟没处理的事件记 inbox_stuck，没超过的不记，两个还没有平台订单的积压订单在同一入口只记一条且 detail 的订单数为 2（received_at 用直接 UPDATE 调早）
      - webhook 里平台时间早于连接 takeover_at 的事件不写，等于与晚于的写，没有平台时间的写；已有自动事件（之后还有 manual 的待处理重试也一样）的订单，早于 takeover_at 但不早于它最早一条自动事件平台时间 T 的写、早于两者的不写；没有自动事件、第一次写时丢掉的早于 takeover_at 的事件，再收到一次仍不写（契约 0.25）
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/platform_intake.py
      - tests/integration/platform_fixtures.py
      - tests/integration/test_platform_intake.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-118
    title: 补拉的服务：按更新时间补拉各入口的订单并推进游标，逐单补拉越阶段的订单并退避
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 3 节补拉、6.2 第 5 条接管点，契约 docs/CONTRACT_V1.md 0.22 的 5.10 第 4 步越阶段补拉（工作包 P4c 的一部分）。新服务模块 app/services/platform_pull.py；拆动作调 CORE-TASK-113，写收件箱调 record_auto_event（source 为 pull），平台只在事务外调。
      一，pull_channel(engine, adapters, secrets, tenant_id, channel_id, *, to_now=False) 返回 pulled、partial、not_allowed 或 failed：连接不满足 pull_allowed、没有适配器或主密钥未配置得 not_allowed；解密 access 令牌，解不开按 CORE-TASK-115 的 mark_connection_failed 改为 auth_failed、得 failed（这里与下面调 mark_connection_failed 时，expected_refresh_ciphertext 都传开始时读到的 refresh 密文，免得把这期间重新授权的连接标成失败）；区间用 pull_window（cursor 为连接的 pull_cursor，takeover_at 为连接的同名列，now 为数据库时间；平常 lag 为默认的 1 分钟，to_now 为真时 lag 为 0，供发布前“补拉到当前时刻”用），区间为 None 得 pulled；分页调 adapter.pull_orders(ShopAuth(…), …)，每个快照 snapshot_events 再 drop_before_takeover（起丢点按订单调 CORE-TASK-117 导出的 takeover_cut 算，契约 0.25 的 5.10 引用格式第 2 条例外），逐个 record_auto_event；某个快照拆不开（ValueError）记日志、跳过这个订单。整个区间都写完之后（record_auto_event 返回假，即这期间连接被切回人工或入口停用，就停下、不推游标、得 not_allowed；每个订单写之前另在一笔短事务里普通读连接行，mode 不是 auto、或 mode_changed_at 与开始时读到的不同，同样停下、不推游标、得 not_allowed：这期间从自动切到人工又切回时，开始时读到的接管点已过时，照它丢会把人工期里登记过的事件再写一遍；takeover_cut 传这一次读到的 takeover_at；record_auto_event 报 ValueError 时照 CORE-TASK-117 记一行日志、跳过这一个事件，补的），用一个单独的短事务 FOR UPDATE 连接行，mode 仍为 auto、mode_changed_at 与 pull_cursor 都仍是开始时读到的值才推进（否则不推：mode 或 mode_changed_at 变了是这期间切换过模式，得 not_allowed；只比游标挡不住从自动切到人工又切回，切回时游标可能恢复成同一个值；两者都没变、只是游标被同时运行的另一次补拉推过了，结果照没有并发时一样得 pulled 或 partial（区间被截断时仍得 partial），事件已写、游标由那一次推，补的），把 pull_cursor 推到区间终点与数据库时间减 1 分钟两者中较早的那个，但不早于原游标（为空时不早于区间起点），游标不往回走（to_now 拉到的最后一分钟下一轮再拉一遍，免得漏掉平台晚写进来的更新，重复的被去重键挡住），last_synced_at 设为数据库时间。区间被 max_span 截短时得 partial（没拉到当前时刻），否则得 pulled。设计第 3 节写的是游标与写收件箱同一事务；record_auto_event 每个事件自己一笔短事务、按去重键幂等，所以改为先写事件后推游标，中途被杀只会重拉一遍（补的写法）。AuthRevoked 与 AuthFailed 按 mark_connection_failed 改状态并告警、得 failed；Unknown、RateLimited、Rejected 不推游标、得 failed，下一轮从原游标重拉。
      二，pull_due_orders(engine, adapters, secrets, memo, *, limit=50)：逐单补拉。对象有两种：(a) platform_orders 里 next_pull_at 不晚于数据库时间的订单；(b) 收件箱里有未处理事件、却还没有平台订单的订单（CORE-TASK-087 留的找法），它们没有地方存退避，用 memo（作业对象上的内存字典，键为租户、入口与平台订单号）记下次时间，进程重启后从头算（补的）。先列出满足 pull_allowed、有适配器的入口，只在这些入口里查：(a) 按 next_pull_at 升序、(b) 按最早未处理事件的 received_at 升序，(a) 取至多 limit 个；(b) 先取至多 500 个、去掉 memo 里还没到下次时间的、再取前 limit 个（这样不合格入口的订单与在退避中的订单都不占名额）。memo 的值为已试次数与下次时间；订单有了平台订单或没有未处理事件时从 memo 里删掉，memo 超过 10000 项时删最早的（补的）。逐个事务外 adapter.read_order，有快照时 snapshot_events、drop_before_takeover（起丢点同样调 takeover_cut 算，写之前照 pull_channel 读连接行，mode 不是 auto 或 mode_changed_at 变了，就不写这个订单、它的 pull_attempts 与 next_pull_at 不动，并跳过这个入口这一轮余下的订单，别的入口照常）、record_auto_event；之后对 (a) 用短事务 FOR UPDATE 这个平台订单，next_pull_at 仍非空时才把 pull_attempts 加 1、next_pull_at 设为数据库时间加 backoff_minutes(加 1 之前的 pull_attempts) 分钟（这期间收件箱作业已把缺的动作补齐、由 CORE-TASK-087 清零了的，不再设回去）；平台上没有这个订单（None）或调平台失败（Unknown、RateLimited、Rejected）也照此退避，(b) 照同一条退避记在 memo 里；访问令牌解不开、AuthRevoked、AuthFailed 时按 mark_connection_failed 处理并停止这个入口这一轮的逐单补拉（同 pull_channel）。
      三，PullRunner.run_round(engine, adapters, secrets)：作业 platform-order-pull 的一轮：对每个租户每个满足 pull_allowed 的 platform 入口调 pull_channel，再调 pull_due_orders。不取作业锁（契约 8.6 第 4 条只给刷新令牌与发布取锁；补拉重复只会被去重键挡住）。周期取 CORE-TASK-111 的 JOB_INTERVALS（设计第 3 节“周期按平台限流定”，V-08 核实前先定 2 分钟，补的）。
      明确不做：挂作业（CORE-TASK-119）；切换模式时写接管点与游标（CORE-TASK-120）；发布前的补拉由发布作业调 pull_channel(to_now 为真)（CORE-TASK-121）。
    status: ready
    depends_on:
      - CORE-TASK-117
      - CORE-TASK-113
      - CORE-TASK-110
    acceptance_criteria:
      - tests/integration/test_platform_pull.py 用模拟适配器：auto 模式的入口补拉一个区间，订单的各动作进收件箱、游标推到区间终点、last_synced_at 有值；再拉一遍同一区间不多写
      - takeover_at 之前的动作不进收件箱、之后的进，已有自动事件的订单早于 takeover_at 但不早于它最早一条自动事件平台时间的动作照样进，第一次补拉丢掉的早于 takeover_at 的动作再补拉一次仍不进，按更新时间补拉与逐单补拉都一样（契约 0.25，经 takeover_cut）；pull_cursor 为空时从 takeover_at 拉起；区间超过 24 小时时得 partial；to_now 为真时拉到数据库当前时刻、游标只推到当前时刻减 1 分钟
      - 逐单补拉写完事件之后、加退避之前订单的 next_pull_at 已被清空（在替身里模拟收件箱作业补齐），不再设回去
      - 平台报 Unknown 时游标不动；报 AuthRevoked 时连接改为 revoked、写了 connection_status_changed 与 auth_failed 告警；manual 模式、缺 read_orders 能力、主密钥未配置都得 not_allowed 且不调平台
      - 逐单补拉：next_pull_at 到期的订单被读一次、事件进收件箱、pull_attempts 加 1、next_pull_at 按 1、2、4 分钟退避（数据库时间用直接 UPDATE 调整）；没有平台订单而收件箱有未处理事件的订单也被读，第二次在 memo 的下次时间之前不读
      - 补拉中途（替身在两页之间）把连接切到人工再切回自动、游标恢复成原值：之后的页不再写、游标不推、得 not_allowed
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/platform_pull.py
      - tests/integration/platform_fixtures.py
      - tests/integration/test_platform_pull.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

