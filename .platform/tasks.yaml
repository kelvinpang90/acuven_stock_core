  - id: CORE-TASK-082
    title: 配额规则写成纯函数：未分配、下单扣配额、取消加回、恢复条件、人工核对逾期与改配额判定
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 3.1（Q-81、Q-82、Q-97、Q-102）与 3.2 的人工核对逾期规则（Q-99）（工作包 P2b）。新模块 app/domain/allocations.py，纯函数，不 import 做 I/O 的库（不碰数据库、时钟、网络；时间由调用方传入）。单元测试 tests/unit/test_allocations.py（unittest）。
      一，unallocated(available, safety_stock, quotas, pendings)：F 等于 available 减 S 减配额之和减 pending 之和，可以为负；参数都是非负整数（bool 不算），否则 ValueError。
      二，take_quota(quantity, quota)：下单时从 Q 扣走 min(quantity, quota)，返回扣走的件数与新的 Q（Q 只减到 0，契约 3.1 平台卖出超过剩余配额）。
      三，add_back(cancelled, quota_taken, quota_returned, restorable)：取消时加回的件数。restorable 为假时 0；为真时 min(cancelled, quota_taken 减 quota_returned)。待处理中的订单被取消一件也不加回由调用方传 restorable 为假。
      四，restore_allowed(mode, connection_status, manual_overdue, has_active_listing, review_hold, unallocated_after)：契约 3.1 恢复条件四项全满足才为真。第 1 项：mode 为 auto 时 connection_status 为 active；mode 为 manual 时 manual_overdue 为假。unallocated_after 是按加回之后算的 F（调用方先减掉取消的 pending、再加上要加回的配额来算），第 4 项要求它不小于 0。不满足时整份不加回（不部分加回）。
      五，manual_check_overdue(mode, last_checked_until, mode_changed_at, now)：mode 为 manual 时，以最近一次核对的 checked_until（没有核对过则用 mode_changed_at；两者取较晚的那个：切到人工之前的核对不算数）为起点，now 减起点超过 12 小时（严格大于）即逾期；mode 为 auto 时总是假。时间都是不带时区的 UTC datetime，带时区的报 ValueError。
      六，judge_allocation_update(current, request)：契约 3.1 改配额的判定，输入是锁内读到的快照（池行 version、S、available、这个池全部 platform 入口在这个 SKU 上的 Q 与 pending、各入口有没有生效的平台商品、各入口人工核对是否逾期）与已校验过形状的请求（expected_version、可选 safety_stock、可选 quotas 列表）。按契约顺序给出第一个不满足的：VERSION_CONFLICT（details 带 current_version）→ QUOTA_CHANGED（details.quotas 列出 expected_quota 与当前不等的那些入口的当前配额，按 channel_id 升序）→ NO_ACTIVE_LISTING（第一个要增加配额而没有生效平台商品的入口，按 channel_id 升序）→ MANUAL_CHECK_OVERDUE（有入口逾期，又要增加逾期入口以外的入口的配额；details 带逾期的 channel_id，有几个取最小的）→ ALLOCATION_EXCEEDS_UNALLOCATED（有任一入口增加时，按新值算的 F 小于 0；details 带 available、safety_stock、quota_total、pending_total、unallocated）。只减配额、只改 S 不做后三项。通过时返回新的 S 与各入口新的 Q。SKU 不存在由服务判，不在这里。
      七，validate_allocation_request(body, platform_channel_ids)：正文形状的校验（契约 3.1 改配额的正文）：expected_version 非负整数；safety_stock 与 quotas 至少一个；safety_stock 0 到 1000000；quotas 非空列表、每个入口最多出现一次、channel_id 必须在给定的这个池的 platform 入口里、expected_quota 与 quota 0 到 1000000 的整数（bool 不算）；reason 1 到 500 个字符。不合格返回 INVALID_REQUEST 与出错的字段。
      单元测试照契约 3.1 例子一逐行（第 0 到 13 步、第 6′ 步）与例子二逐行写，断言每一步的 Q、pending 与 F 等于表里的值。
      明确不做：读写数据库、锁、命令体（改配额的服务是 CORE-TASK-090，取消加回在平台事件执行器里调这些函数）。
    status: ready
    depends_on: []
    acceptance_criteria:
      - 新增 app/domain/allocations.py 与 tests/unit/test_allocations.py，不改别的文件；测试用 ast 读模块的 import，只有标准库里不做 I/O 的模块（dataclasses、datetime、typing、collections 之类）与 app.domain 里的纯模块
      - 契约 3.1 例子一第 0 到 13 步与第 6′ 步逐行断言 Q、pending 与 F；第 8 步 Q 只减到 0、quota_taken 14；第 6′ 步得 ALLOCATION_EXCEEDS_UNALLOCATED 且 details 的 unallocated 为 −1
      - 例子二逐行断言：第 1 步 quota_taken 1；第 2 步加回 1；第 3 步加回 0、Q 仍为 1、F 回到 17；restorable 为假时加回 0
      - 恢复条件逐项各有一条只违反它的用例（auto 而连接非 active、manual 而逾期、没有生效平台商品、读回待核对、加回后 F 为负），每条都得假；四项全满足得真
      - 人工核对逾期：恰好 12 小时不逾期、多 1 微秒逾期；没核对过从 mode_changed_at 算；切换之前的核对不算数；auto 总是不逾期；带时区的时间报 ValueError
      - 改配额判定按契约顺序：两种冲突同时存在时先报 VERSION_CONFLICT；只有被改的入口变过才 QUOTA_CHANGED、没改的入口变了不冲突；只减配额或只改 S 时即使 F 为负、没有平台商品或有逾期也通过；逾期入口自己加配额不报 MANUAL_CHECK_OVERDUE（它的配额照第 3、5 项判）
      - 正文校验的每种不合格各有一条用例（缺两者、重复入口、不是这个池的 platform 入口、越界、bool 当整数、reason 为空或 501 个字符）
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
    allowed_change_paths:
      - app/domain/allocations.py
      - tests/unit/test_allocations.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-083
    title: 平台事件规则写成纯函数：引用派生、事件排序、阶段判定、行合并与命令正文
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 5.10（Q-83、Q-98、Q-100）（工作包 P2b 拆出的平台事件部分；14.2 把这些写在 P2d、P2e 里，这里先抽成纯函数，执行器任务只管数据库与事务）。新模块 app/domain/platform_events.py，纯函数，不做 I/O。单元测试 tests/unit/test_platform_events.py。
      一，引用（契约 5.10 引用格式）：order_ref(platform, shop_id, platform_order_id)，平台前缀 shopee 为 shp、tiktok_shop 为 tts；payment_ref(order_ref) 为加 :c；document_ref(order_ref, kind, platform_id) 的 kind 为 d、r、x。平台给的每一段（店铺 ID、平台订单号、包裹 ID、退款 ID、退货 ID）含字母、数字、点、下划线、连字符以外的字符（冒号也算：段里带冒号会让 A:d:B 加包裹 X 与 A 加包裹 B:d:X 拼出同一个引用，所以比契约的字符集多排除冒号，是补的），或长于 64 个字符，或单据 ID 恰好是 m 加数字（会与人工“平台没有给 ID”的 m1、m2 撞上）、或任何一段恰好是 h 加 32 位十六进制（会与换过的段撞上），就换成 h 加它 UTF-8 的 SHA-256 小写十六进制的前 32 位（后两种是补的）。长度：order_ref 照契约不超过 112（超过时先换平台订单号这一段，还超再换店铺 ID 这一段；每段不超过 64，所以换完必不超限）。单据引用是 order_ref 加 3 个字符的标记再加单据 ID 段，order_ref 长时可能超过 128：这时把单据引用里的 order_ref 部分整体换成 h 加 order_ref 的 SHA-256 前 32 位（契约没写超长时怎么办，照同一条“按它本身确定性变换”补的；Core 对单据引用的唯一性按引用本身，不要求它以 order_ref 开头）。同一输入总得同一结果。manual_document_ref(order_ref, kind, n) 用 m 加 n（人工“平台没有给 ID”）。
      二，order_lock_name(database, tenant_id, channel_id, platform_order_id)：五项（第二项是字面量 platform_order）以换行符连接后 UTF-8 编码的 SHA-256 小写十六进制。
      三，payload 形状（自动适配器与后台登记都按它写，适配器任务照此产出）：parse_payload(action, payload) 校验并返回不可变的数据类，不合格报 ValueError。共同键 platform_time（可选，带 Z 的 ISO 8601 UTC 文本，秒后可带 1 到 6 位小数；解析成不带时区的 UTC datetime）。created：lines 为非空列表，每项 platform_line_id、platform_item_id、platform_model_id（1 到 128 个字符、不含控制字符，不做字符集检查，不合格的由执行器按找不到平台商品处理）、quantity（1 到 1000000 的整数）。ready_to_ship 与 return_requested：除 platform_time 外没有别的键。cancelled：lines 可选（订单级取消不带，表示取消全部剩余件数），每项 platform_line_id 与 cancelled_total（这一行在平台上累计已取消的件数，0 到 1000000；补拉只看得到累计数，按累计数处理，同一次取消从 webhook 与补拉各到一次也只生效一次），带 refund_id 时每项另须有 quantity（这一次退款取消的件数，1 到 1000000，已确认之后的取消用它），不带 refund_id 时不得有 quantity；refund_id 可选；带 lines 时不得为空列表；带 refund_id 而不带 lines 合格（执行器按订单级处理）。shipped：package_id 可选、lines 必填且非空，每项 platform_line_id 与 quantity（这个包裹里这一行的件数，1 到 1000000）。return_received：return_id 可选、lines 必填，每项 platform_line_id、sellable_quantity、unsellable_quantity（非负，两者之和大于 0）。platform_line_id、package_id、refund_id、return_id 为 1 到 128 个字符、不含控制字符；sellable_quantity 与 unsellable_quantity 为 0 到 1000000 的整数；列表都不超过 100 项、platform_line_id 不重复；不认识的键报错（payload 只存改账要用的字段，契约 5.10 存放）。
      四，排序：sort_key(platform_time, action, received_at, event_row_id)（时间都是不带时区的 UTC datetime，received_at 来自数据库） 按平台时间（没有则用 received_at）、再按状态链先后（created 1、ready_to_ship 2、shipped 与 cancelled 3、return_requested 4、return_received 5）、再按 received_at、最后按 event_row_id（保证全序）。
      五，阶段判定 classify(stage, action, ready_at_set)：只管收件箱里的事件（webhook、补拉与后台人工登记的平台动作）；后台的待处理重试、映射补上后继续处理不是收件箱事件，不经 classify（第 3 组的任务直接调对应的处理）。stage 为 None 表示平台订单还不存在。返回五种之一：apply（照常处理）、ignored（落后于阶段，契约 5.10 第 4 步）、missing_prior（越过阶段，并给出缺的前序动作）、blocked（这一轮停下、不补拉）、attention（与阶段矛盾）。规则：created 在不存在时 apply，否则 ignored；ready_to_ship 在 unpaid 时 apply，在 held 时 ready_at 未记过则 apply、记过则 ignored，在 committed 时 ignored，在 cancelled 时 attention，不存在时 missing_prior(created)；cancelled 在 unpaid、held、committed 时 apply（调用方按阶段分扣数前后；已确认之后的取消必须带 lines，不带时调用方写待处理，因为订单级取消的件数里可能含已交运的，而契约 5.10 要求件数取平台的、不取 Core 的余量），在 cancelled 时 ignored，不存在时 missing_prior(created)；shipped 在 committed 时 apply，在 unpaid 时 missing_prior(ready_to_ship)，在 held 时 ready_at 未记过为 missing_prior(ready_to_ship)（待发货还没处理过）、记过为 blocked（待发货处理过、被拒在待处理，只能等后台重试，补拉也补不出来），在 cancelled 时 attention，不存在时 missing_prior(created)；return_requested 总是 ignored；return_received 在 committed 时 apply，其余同 shipped。契约没写的三种（cancelled 阶段收到 ready_to_ship 或 shipped 记 attention、held 阶段收到 shipped 为 blocked）是据契约 5.10 第 4、6 步补的。
      六，按 SKU 合并订单行 assign_line_refs(lines)：输入各平台行的 platform_line_id、sku_id 与剩余件数（剩余件数大于 0 的行 sku_id 为 None 时报 ValueError，由调用方先判 unmapped），剩余件数大于 0 的按 sku_id 合并、按 sku_id 升序编 L1、L2…，返回合并后的 Core 行（line_ref、sku_id、合计件数）与平台行到 line_ref 的对照。
      七，派生正文（契约 5.10 派生的命令正文与请求摘要）：reservation_body、sale_commit_body、dispatch_body、refund_restock_body、return_receipt_body，各返回路径参数与正文，键与契约的表一致，不带 reason_code、note、occurred_at。先整理：映射到同一 Core 行的平台行求和、件数为 0 的行不列、行按 line_ref 升序；整理后一行不剩返回 None（调用方记 ignored）。单据正文收 document_ref 已拼好的引用，平台 ID 缺失由调用方先判（缺了写待处理，不进这些函数）；payload 里的平台行在对照里没有 line_ref 时报 ValueError（调用方先判，写待处理）。sale_commit_body 的 paid_at 取传入的 ready_at，写成 YYYY-MM-DDTHH:MM:SS 加 Z 的文本（ready_at 由执行器截到整秒存），测试断言 app/api/sale_commits.py 的请求模型能解析它。
      八，补拉退避 pull_backoff(attempts)：attempts 是这个订单已经补拉过的次数（非负整数），返回下一次补拉前要等的 timedelta，为 min(2 的 attempts 次方, 60) 分钟，即 0 次 1 分钟、1 次 2 分钟、2 次 4 分钟，6 次起 60 分钟（契约的 1、2、4、8…分钟，最长 60）。
      明确不做：数据库、锁与事务（执行器任务）；用 /v1 请求模型校验派生正文（执行器任务做，它可以 import app/api 的模型，domain 不行）。
    status: ready
    depends_on: []
    acceptance_criteria:
      - 新增 app/domain/platform_events.py 与 tests/unit/test_platform_events.py，不改别的文件；测试用 ast 读模块的 import，只有标准库里不做 I/O 的模块（hashlib、re、dataclasses、datetime、typing 之类）与 app.domain 里的纯模块
      - 引用：契约 5.10 的例子 shp:123456:2611210ABCD 及其付款引用与三种单据引用（后缀 c、d、r、x）原样得出；含空格、中文或斜杠的段换成 h 加 32 位十六进制，同一输入两次结果相同；平台订单号 200 个字符、店铺 ID 64 个字符时 order_ref 不超过 112、单据引用不超过 128；段里带冒号的被换掉，A:d:B 加 X 与 A 加 B:d:X 得到不同的引用；m1、m2 形式正确
      - 锁名对固定输入得到用 hashlib 独立算出的同一个值；五项任一不同锁名不同
      - payload 校验每种动作各有合格与不合格用例（缺必填键、多出的键、件数为 0 或 1000001、bool 当整数、重复 platform_line_id、101 项、时间不带 Z、sellable 与 unsellable 都为 0）
      - 排序：平台时间不同按平台时间（不论动作先后，例如先取消一行、后待发货的顺序保持）；时间相同按状态链；再相同按 received_at 与 event_row_id；没有平台时间用 received_at
      - classify 逐格覆盖 purpose 第五条的表（五个阶段含不存在 乘 六种动作，含 held 下 ready_at 记过与未记过）
      - 行合并与派生正文：两条平台行映射同一 SKU 合成一行、按 sku_id 升序编号；剩余为 0 的行不列；同一包裹里映射到同一 Core 行的件数求和；全部为 0 时返回 None；五种正文的键与契约的表逐项一致、没有 reason_code、note、occurred_at；同一输入不论顺序得到相同正文
