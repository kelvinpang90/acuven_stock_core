      - tests/integration/test_deploy_scripts.py 加两条：读 Dockerfile 的 CMD 核对这两个参数；对 Demo 与生产两组实例变量各跑一次 docker compose config，core_api 的 stop_grace_period 都是 45 秒（没有 docker 时测试失败而不是跳过，同文件已有的做法）
