  - id: CORE-TASK-070
    title: 关停留足宽限：关掉 uvicorn 自带的访问日志，定时任务改为并行停止
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 8.6 第 4、5 条（Q-94）改进程的关停与访问日志（工作包 P0a，docs/PLATFORM_CHANNELS.md 第 14 节）。Demo 与生产用同一个镜像与同一个 compose 文件，两个实例一起改。
      一，Dockerfile 的启动命令（仍为 exec 形式）加 --no-access-log：uvicorn 自带的访问日志记完整的请求行、含查询串，关掉它；Core 自己按路径记的访问日志（app.api.access）不变。再加 --timeout-graceful-shutdown 10：收到停止信号后给正在处理的请求收尾，最多 10 秒。
      二，docker-compose.yml 给 core_api 设 stop_grace_period 为 45s：uvicorn 收尾上限 10 秒，加定时任务停止的截止时间 30 秒（app/services/periodic.py 的 DEFAULT_STOP_TIMEOUT），加 5 秒余量；算式写进注释。
      三，定时任务并行停止：app/services/periodic.py 提供“先通知全部任务停止，再用同一个截止时间等它们全部结束”的停止方式（截止时间默认 DEFAULT_STOP_TIMEOUT），过了截止时间仍没结束的任务各记一行警告（同现在 stop 的写法）；app/main.py 的 lifespan 退出时用它一次停掉全部定时任务，不再逐个等。启动的先后、启动出错时的收尾、退出后在 periodic_tasks 里换上没启动的新任务对象（就绪检查读它；app.state 上的 security_event_purge 与 reservation_expiry 照现在不换），都照现在的做法。
      明确不做：部署脚本与部署工作流（正常关停几秒内完成，45 秒只在作业正在跑时才会用满，不改超时算式）；平台的定时作业与命名锁（第 4 组）；网络与注释（CORE-TASK-072）。
    status: ready
