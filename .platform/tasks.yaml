  - id: CORE-TASK-086
    title: 平台事件执行器骨架：写收件箱、按订单加锁排序、一个事件一笔事务，并处理新订单
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 5.10 存放、处理顺序第 1 到 4、7、8 步与“每个动作调哪个命令体”的 created 一行，3.1 下单扣配额（工作包 P2d1）。新服务模块 app/services/platform_events.py；规则调 CORE-TASK-082、083 的纯函数，不在这里重写。只有函数，不挂作业、不挂接口（作业与 webhook 是第 4 组的任务），所以生产上还不会运行。
      一，record_auto_event(engine, tenant_id, channel_id, platform_order_id, platform_line_id, action, event_key, source, payload)：source 只收 webhook、pull，action 不收 return_received（它只由后台登记）；先用 parse_payload 校验（不合格 ValueError，不写）；入口不是这个租户的 platform 入口、不是 active、或它的连接 mode 为 manual 时不写（契约 5.10 引用格式第 1 条），返回假；created 的 platform_line_id 不是空串、platform_order_id 为空串或超过 128 个字符时报 ValueError；数据库错误照常抛出（webhook 据此回 5xx）；payload 带 package_id、refund_id 或 return_id 时，存进去的 event_key 是传入的 event_key 加竖线再加这个单据 ID；拼出的整串（没有单据 ID 时就是传入的 event_key 本身）超过 128 个字符时，整串换成 h 加整串 UTF-8 的 SHA-256 前 32 位：补拉用状态时间作 event_key，同一行同一时刻的两个包裹或两次取消否则会撞去重键、后一个被静默丢掉（是补的）。否则用单独的短事务 INSERT … ON DUPLICATE KEY UPDATE event_row_id = event_row_id 写一行（event_row_id 用 new_id 的 pev 前缀，credential_id 为这个租户的 system 主体，received_at 为数据库时间），重复送达什么也不改，返回真。
      二，orders_with_pending_events(engine, limit)：按 platform_events 的 (applied_at, tenant_id, channel_id) 索引找出有未处理事件的订单（tenant_id、channel_id、platform_order_id），按各订单最早未处理事件的 received_at 升序、再按三列升序取前 limit 个，供以后的作业用；一直处理不掉的订单会排在前面，作业怎样不被它们占满（例如每轮跳过上一轮停下的订单）由第 4 组的作业任务定。
      三，process_order(engine, tenant_id, channel_id, platform_order_id, *, reservation_ttl_seconds)：处理一个订单这一轮的事件（预留有效期由调用方传入，以后作业从 Settings 取，执行器不自己读配置），返回处理了几个、停在哪个事件与原因。
      第 1 步：在没有打开事务的连接上 GET_LOCK(order_lock_name(…), 5)，取不到或出错就什么也不做、返回“锁忙”。
      第 2 步：取这个订单全部未处理的事件，按 sort_key 排序，逐个处理，每个事件一笔事务。
      第 3 步（每个事件开事务之前）：解析这个事件涉及的订单行的 SKU（已有平台订单行的取已定下的 sku_id；created 的各行按当前 active 的平台商品，普通读）；照现有余额行预建的写法用短事务预建 (tenant_id, pool_id, sku_id) 的余额行、pool_allocations 行，以及这个池全部 platform 入口在这些 SKU 上的 channel_allocations 行（按 sku_id、再按 channel_id 升序）；把会话隔离级别设为 READ COMMITTED，再调 app/services/reservations.py 的 close_due_before_reserving 关这些 SKU 上已到期的预留（它要求连接已是 READ COMMITTED，同 HTTP 执行器的先后）。
      第 4 步：开事务，按契约 5.10 第 4 步的锁序加锁，用不到的层跳过：收件箱行 FOR UPDATE（applied_at 已有值就提交空事务，下一个）→ 平台订单行 FOR UPDATE（没有就留到动作里插入）→ 本任务的 created 只再锁这个入口在这些 SKU 上的 channel_allocations 行（按 sku_id 升序 FOR UPDATE）→ 平台商品 FOR SHARE 重新解析 created 各行的 SKU，与第 3 步不同就回滚、从第 3 步重做一次，再不同就回滚、这个订单这一轮停下。然后 classify：ignored 记 ignored、不改任何量；created 的 apply 照下面第四条；本任务还没有处理办法的情形（其余动作，以及 missing_prior、blocked、attention）回滚、这个订单这一轮停下、不改任何东西（CORE-TASK-087 到 089 逐个补上）。
      第 7 步：写收件箱行的 applied_at（数据库时间）与 result，与改动一起提交。这一轮结束（处理完或停下）时在同一连接上 RELEASE_ALL_LOCKS() 并用 SET SESSION transaction_isolation = DEFAULT 复原隔离级别，出错就作废这个连接（照 app/services/idempotency.py 的 _release_locks）。
      第 8 步：数据库错误或程序异常时整笔回滚，收件箱行仍未处理，这个订单这一轮停下；异常不向外抛，记一行进程日志（不含 payload），返回原因。
      四，created：插入平台订单（new_id 的 pfo 前缀，order_ref 由 order_ref(入口的 platform, platform_shop_id, platform_order_id) 得出，stage unpaid）与各行（sku_id 取重新解析的结果，找不到为空）。按 platform_line_id 升序逐行，对有 SKU 的行用 take_quota 从这个入口这个 SKU 的 quota 扣走、记 quota_taken，pending 加这一行的件数；（契约 0.24 的 3.1、3.2）这一行 channel_allocations 的 manual_confirmed_quota 非空时同时减去 min(这一行的件数, manual_confirmed_quota)，不论入口模式，不写 platform_ops_log。有行找不到生效平台商品时订单设为 held、attention 为 unmapped、attention_code 为空，那些行不计 pending、不扣配额，result 记 held、result_code 记 unmapped；否则 result 记 applied、result_code 为空。result 记 ignored 时 result_code 为空。（CORE-TASK-093 的约束：held 与 attention 时 result_code 非空、ignored 时为空；完整的通用规则见 CORE-TASK-087。）
      record_auto_event 收到 source 为 manual 或 action 为 return_received 时报 ValueError（调用方的程序缺陷），入口不对或人工模式时返回假。测试要在第 3、4 步之间插入动作（改挂用直接 UPDATE sku_listings，本任务不依赖平台商品命令）、让某条语句失败：模块里设一个默认为空的模块级钩子 _between_prepare_and_lock(connection)，第 3 步之后、开事务之前调它，测试用 monkeypatch 设它；失败用 monkeypatch 替换本模块里写平台订单的那个函数。
      五，测试辅助模块 tests/integration/platform_fixtures.py：建租户、池、SKU、platform 与 backoffice 入口（直接插行，含 system 主体与连接行）、平台商品，提交；purge_tenant(engine, tenant_id) 在一个连接上 SET SESSION foreign_key_checks = 0，删掉这个租户在所有带 tenant_id 列的表里的行，在 finally 里设回 1、设不回就作废这个连接（use_alter 的外键让按表排序删不干净，例如池行上的 went_live_credential_id；只给测试用）。之后的平台事件任务复用它。
      明确不做：取消、待发货、交运、退货的处理（CORE-TASK-087 到 089）；补拉与退避（087）；作业、webhook、告警（第 4 组）；后台的人工登记（第 3 组）。
    status: ready
    depends_on:
      - CORE-TASK-081
      - CORE-TASK-082
      - CORE-TASK-083
    acceptance_criteria:
      - 新增 app/services/platform_events.py、tests/integration/platform_fixtures.py 与 tests/integration/test_platform_events_created.py，不改别的文件；每个测试用自己的租户，在 finally 里 purge_tenant，会话结束时 migrated_engine 降到 base 照常成功
      - 契约 5.10 例子第 1 种的前一半：created 2 件、Q 为 10 时 Q 变 8、pending 变 2、quota_taken 2、stage unpaid、result applied；契约 3.1 例子一第 8 步：16 件而 Q 为 14 时 Q 变 0、quota_taken 14、pending 加 16；manual_confirmed_quota 为 20 时这 16 件之后为 4、为 3 时为 0、为空时仍为空（契约 0.24）
      - 一行找不到生效平台商品：订单 held、attention unmapped，那一行 sku_id 为空、不计 pending、不扣配额，别的行照常；result held、result_code unmapped
      - 例子第 2 种：同一去重键 record_auto_event 两次只有一行；同一事件处理之后再 process_order 不改任何量；例子第 3 种的 created 版：pull 来源以另一个 event_key 再写一个 created，处理得 ignored、不改任何量
      - 连接为 manual 时 record_auto_event 返回假、不写；source 为 manual、payload 不合格、入口不是 platform 时不写
      - 另一个连接先持有这个订单的命名锁时 process_order 返回锁忙、什么也不改；同一订单两个事件按平台时间先后处理；处理中数据库出错（测试里让一条语句失败）时整笔回滚、收件箱行仍未处理
      - 第 3 步与第 4 步之间有人改挂了平台商品（测试用钩子在两步之间提交一次改挂）时，created 按改挂后的 SKU 记账；连续两次都变时这一轮停下、什么也不改；本任务未处理的动作（例如 ready_to_ship）让这一轮停在它这里、它和它之后的事件都仍未处理；一轮结束后连接的隔离级别复原、不再持有命名锁
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/platform_events.py
      - tests/integration/platform_fixtures.py
      - tests/integration/test_platform_events_created.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-087
    title: 平台事件执行器处理扣数之前的取消、退货申请，以及乱序时先处理前序或标记补拉
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 5.10 第 4 步（落后、越过阶段的三种情形）与“每个动作调哪个命令体”的扣数前 cancelled、return_requested 两行，3.1 的取消加回与恢复条件（工作包 P2d2）。在 CORE-TASK-086 的 app/services/platform_events.py 上补。
      一，扣数之前的 cancelled（订单 unpaid 或 held）：payload 带 lines 时按行取消所给件数，不带时取消各行全部剩余件数。每行这次要取消的件数是 cancelled_total 减这一行已有的 cancelled_qty（不大于 0 就是这一行没有新取消）；全部行都没有新取消时 result 记 ignored、不改任何量（同一次取消从另一个来源又到一次）。cancelled_total 超过 quantity，或 payload 里有这个订单没有的 platform_line_id 时，这个事件不改任何量，写 attention 为 cancel_exceeds_remaining 或 unknown_line，result 记 attention（契约没写这两种情形，据第 6 步“不改量、写待处理”补的）。写 attention 的通用规则（本任务与之后的平台事件任务都照此）：收件箱行的 result_code 写这个事件的 Core 错误码，没有错误码时写原因（stage_conflict 的错误码是 STATE_CONFLICT，所以写 STATE_CONFLICT）。原因分两类：让订单进 held 的原因（unmapped、core_rejected、invalid_request、defect）总是覆盖订单上的 attention 与 attention_code，因为后台要照它重试；其余原因（unknown_line、cancel_exceeds_remaining、stage_conflict、refund_id_missing、cancel_lines_missing、missing_platform_id、line_not_committed，以及已确认之后的 core_rejected）在订单已有 attention 时不覆盖，没有时写上；被盖掉或没写上的原因都留在各自事件的 result_code 里。一个取消事件同时有不认识的行与超额的行时记 unknown_line。
      锁序（契约 3.1、5.10 第 4 步）：收件箱 → 平台订单 → 池行 FOR SHARE → 这些 SKU 的余额行 FOR UPDATE（按 sku_id 升序）→ pool_allocations 行 FOR UPDATE → 这个池全部 platform 入口在这些 SKU 上的 channel_allocations 行 FOR UPDATE（按 sku_id、再按 channel_id 升序）→ 这个入口在这些 SKU 上的平台商品 FOR SHARE。
      每行加 cancelled_qty；有 SKU 的行从这个入口的 pending 减取消的件数。订单 unpaid 时，按 SKU 汇总这次各行可加回的件数（add_back，quota_taken 减 quota_returned 封顶），用 restore_allowed 判这个 SKU 能不能加回：mode 与 status 读这个入口的连接行，逾期用 manual_check_overdue（最近一次核对的 checked_until 取 manual_checks 里这个入口的最大值，now 为数据库时间），has_active_listing 与 review_hold 读上面锁住的行，unallocated_after 用锁住的余额行的 available、pool_allocations 的 S 与各入口的 Q、pending 按加回之后算。能加回就加到这个入口的 quota、各行 quota_returned 加上各自的件数；不能就整份不加（进 F）。订单 held 时一件也不加回。各行剩余件数都为 0 时阶段改为 cancelled（attention 不清）。result 记 applied。
      二，return_requested：classify 总是 ignored，只留事件、不改任何量。
      三，classify 给出 missing_prior 时：这个订单这一轮还没处理的事件里有缺的那个动作，就回滚当前事件，先处理那个事件（不看平台时间；有几个就取排序最前的一个，其余的处理时自然落后于阶段、记 ignored），再回到当前事件；同一轮里每个事件最多这样被提前一次，不会来回循环。没有就回滚，在一笔短事务里把平台订单的 next_pull_at 设为数据库当前时间（已非空就不动，pull_attempts 不动，真正的补拉、退避与计数由补拉作业做），这个订单这一轮停下；平台订单还不存在（缺的是 created）时什么也不写，只停下：补拉作业从收件箱里“有未处理事件、却没有平台订单”的订单找到它（第 4 组的任务照此找）。
      classify 给出 blocked 时：回滚，这一轮停下，不标补拉。给出 attention 时：订单写 attention 为 stage_conflict、attention_code 为 STATE_CONFLICT，阶段不变，result 记 attention。
      四，一轮结束时这个订单没有未处理的事件了，而 next_pull_at 非空或 pull_attempts 大于 0：用一笔短事务把它们清为空与 0（契约只说“补拉到缺的动作后清零”，这里落实为“缺的动作补齐、全部处理完”，是补的写法）。
      明确不做：待发货与已确认之后的动作（CORE-TASK-088、089）；补拉作业本身（第 4 组）。
    status: ready
    depends_on:
      - CORE-TASK-086
    acceptance_criteria:
      - 只改 allowed_change_paths；新增 tests/integration/test_platform_events_cancel.py（复用 platform_fixtures，在 finally 里 purge_tenant）
      - 契约 3.1 例子一第 4 步：订单 C 3 件 quota_taken 3，付款前整单取消，Q 先 5 后 8、pending 先 3 后 0，阶段 cancelled；契约 3.1 例子二第 1 到 3 步逐行断言 Q、pending、quota_taken、quota_returned 与 F
      - 恢复条件逐项各有一条只违反它的用例（auto 而连接非 active、manual 而逾期、平台商品 inactive、review_hold、加回后 F 为负），都整份不加回、pending 照减；held 的订单被取消一件也不加回
      - 行级取消只动所给的行；超过剩余件数时什么量也不改、订单 attention 为 cancel_exceeds_remaining；找不到 SKU 的行只加 cancelled_qty；整单已 cancelled 后又来一个 cancelled 得 ignored
      - 乱序：unpaid 时先到 shipped、收件箱里没有 ready_to_ship，这一轮停在 shipped、next_pull_at 被设上、pull_attempts 不变，下一轮再撞仍不重设；平台订单不存在时先到的 cancelled 在 created 也在收件箱时先处理 created 再处理它；held 时到 shipped 停下、不标补拉；cancelled 阶段收到 ready_to_ship 写 stage_conflict
      - 先取消一行、后待发货（平台时间先后如此）时，取消先处理（只验到取消生效、待发货仍未处理为止，待发货由 CORE-TASK-088 处理）；webhook 与补拉各送一次同一个行级取消（cancelled_total 相同、event_key 不同）只生效一次，第二个得 ignored；一轮处理完全部事件后 next_pull_at 与 pull_attempts 清掉
      - CORE-TASK-086 的测试照常通过（它断言“本任务未处理的动作停下”的用例改为用仍未实现的 ready_to_ship）
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/platform_events.py
      - tests/integration/platform_fixtures.py
      - tests/integration/test_platform_events_created.py
      - tests/integration/test_platform_events_cancel.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-088
    title: 平台订单进入待发货时在一个保存点里预留并确认销售，被拒时设为待处理
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 5.10 派生的命令正文、第 3 到 6 步、命令体共用与 ready_to_ship 一行，3.1 进入待发货的 pending（工作包 P2e1）。新模块 app/services/platform_commands.py 放调 Core 命令体的动作，由 app/services/platform_events.py 的执行器分派。
      一，命令执行：为每个 Core 命令建一个 Execution（CORE-TASK-079 之后它不持 HTTP 请求）：上下文的租户、入口与池取平台订单的入口，credential_id 为这个租户的 system 主体，操作者为空，request_id 为这个收件箱事件的 event_row_id（流水与预留由它追到事件），幂等键为空，预留有效期取 process_order 传入的 reservation_ttl_seconds，HTTP 三项为空；operation 用 /v1 对应接口的操作类型名；request_digest 用 app/domain/idempotency.py 的 request_digest(路径参数, 派生正文)。派生正文先用 app/api 下对应接口的请求模型校验（model_validate），HTTP 的批量上限（私有、回 413）与 line_ref 不重复（回 422）在 app/api/requests.py 里，这里自己判：行数超过 100 或 line_ref 重复都按 INVALID_REQUEST 处理（见下），再交给命令体。命令登记的安全事件在事务提交之后用 app/services/security_events.py 写（照 HTTP 执行器的做法，HTTP 的三项为空）。
      二，ready_to_ship（classify 为 apply，即订单 unpaid，或 held 而 ready_at 未记过）：先在保存点之外记 ready_at（payload 的 platform_time，没有则用这个事件的 received_at，截到整秒存；已记过不改）。有剩余件数大于 0 的行 sku_id 为空：订单保持或设为 held、attention unmapped，不调 Core，result 记 held。否则用 assign_line_refs 合并行，派生 reservations.create 与 sale_commits.create 的正文；校验不过：held、attention invalid_request、attention_code INVALID_REQUEST，不调 Core，result held。
      开保存点之前按契约 5.10 第 4 步的锁序先锁：池行 FOR SHARE → 这些 SKU 的余额行 FOR UPDATE（按 sku_id 升序）→ 这个入口在这些 SKU 上的 channel_allocations 行 FOR UPDATE（按 sku_id 升序）→ 平台商品 FOR SHARE；之后命令体再锁同样的余额行（已持有）与 SKU、商品行，先后合契约。然后 SAVEPOINT → create_reservation → 用它返回的 reservation_id 派生并调 create_sale_commit（它要的 CommitSkus 用这个池与这些 SKU 组，prepared 取第 3 步预建余额行时算出的 SKU 及其合并去向集合，同 HTTP 接口的做法）→ RELEASE SAVEPOINT。成功后写各平台行的 line_ref，pending 减各行剩余件数，阶段 committed，attention 不动（unpaid 订单上可能有 CORE-TASK-087 写的原因，留给后台清除），result applied。
      三，命令以业务拒绝结束（ApiError 4xx）：ROLLBACK TO SAVEPOINT，执行命令登记的“被拒也要保留的写入”，命令登记的安全事件照 HTTP 的规则随拒绝保留；订单设为 held、attention core_rejected、attention_code 为错误码，pending 不动，result held。错误码是 BUSINESS_REF_CONFLICT、ORDER_REFERENCE_CONFLICT、RESERVATION_MISMATCH 时 attention 改为 defect（契约第 6 步“另标为缺陷”）。
      四，命令抛 BusinessRefTaken(rejudge)：ROLLBACK TO SAVEPOINT，丢弃这次登记的安全事件与被拒仍保留的写入，新开一个保存点，用新的 Execution 调 rejudge；rejudge 返回成功就照成功继续（预留之后接着确认销售），以业务拒绝结束就照第三条；两种情形都另写 attention 为 defect（committed 也可以带 attention），阶段按实际结果定。rejudge 这条路上预留已存在，确认销售会在余额行之后才锁预留行，与契约“预留行在余额行之前”的锁序相反，可能与到期关单互锁；InnoDB 选中牺牲者回滚，按 086 第 8 步下一轮重来，生产的池里平时没有 active 预留，接受，PR 里写明。命令抛 RedoCommand：回滚整笔事务，从第 3 步重做一次，再抛就回滚、这一轮停下。其余异常照 CORE-TASK-086 的第 8 步。
      五，classify 为 ignored（已 committed，或 held 而 ready_at 已记过）照 086 记 ignored。订单 unpaid 或 held 时预留或确认销售却按业务引用返回原结果（085 的标记为真）：照成功处理（阶段 committed、pending 照减），另写 attention 为 defect（这时 Core 里已有这个订单，说明状态记录有缺陷）。rejudge 成功与按引用返回原结果这两种“成功但缺陷”的情形：收件箱 result 记 applied、result_code 记 defect，订单 attention 写 defect（属于让人去查的原因，覆盖已有的）、attention_code 为空。预留按引用返回的是一张已释放或已到期的预留、接着确认销售被拒时：按业务拒绝处理、attention 为 defect，命令登记的“被拒也要保留的写入”（例如晚到付款转待审）不执行、丢弃——平台订单不走晚到与故障补交（契约 5.10），契约说这条路用到的命令里没有这种写入，实际确认销售有，这里写明不执行，PR 里请 Kelvin 确认。写 attention 照 CORE-TASK-087 的通用规则。
      明确不做：交运、已确认后的取消、退货验收（CORE-TASK-089）；后台的重试与继续处理（第 3 组）；告警（第 4 组）。
    status: ready
    depends_on:
      - CORE-TASK-087
      - CORE-TASK-085
    acceptance_criteria:
      - 只改 allowed_change_paths；新增 app/services/platform_commands.py 与 tests/integration/test_platform_events_ready.py（复用 platform_fixtures，在 finally 里 purge_tenant）
      - 契约 5.10 例子第 1 种完整：created 与 ready_to_ship 各一次，第二笔预留并确认 2 件、pending 2 变 0、阶段 committed；账面、预留状态与订单行的 committed_qty 照 /v1 的同样命令的结果；流水与预留上的 credential_id 是 system 主体、actor 为空
      - 例子第 3 种：补拉以另一 event_key 再写的 ready_to_ship 得 ignored、不改任何量；例子第 6 种：available 只有 1 时预留 409 INSUFFICIENT_STOCK，账面不变、没有预留、阶段 held、attention_code INSUFFICIENT_STOCK、pending 仍为 2、ready_at 已记
      - 契约 3.1 例子一第 11 步（E 被拒进待处理）与第 9 步（D 16 件预留只看 available）各一条用例
      - 摘要：同一订单的 ready_to_ship 分别从 webhook 与补拉到达（平台时间不同）时，reservations.create 的派生正文与摘要相同，sale_commits.create 在给定同一个 reservation_id 时派生正文与摘要相同（reservation_id 每次保存点里新生成，不比它本身）；派生正文超过 100 个 SKU 时不调 Core、held、attention_code INVALID_REQUEST
      - 例子第 4 种：在确认销售之后、提交之前让事务失败，什么也没留下（没有预留、流水，pending 不变），收件箱行仍未处理，下一轮照常处理一次
      - BusinessRefTaken：测试用 monkeypatch 让本模块调用的 create_reservation 先真正执行一次、再抛 BusinessRefTaken(rejudge)，rejudge 分别是用新的 Execution 再真正调一次 create_reservation 的函数（保存点已回滚了第一次的写入，这一次重新写入）与抛 ApiError 的函数；断言第一次的写入被回滚、rejudge 成功时用它返回的 reservation_id 继续确认销售得 committed、失败时得 held，两种都 attention 为 defect；087 里断言“待发货仍未处理”的用例改为断言待发货已按本任务处理；CORE-TASK-086、087 的测试照常通过（它们里“未处理的动作停下”的用例改为用仍未实现的 shipped 或 return_received）
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
