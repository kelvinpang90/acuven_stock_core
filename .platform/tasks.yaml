    title: 预留表加最后变更时间，改预留或订单行的命令都同步设它
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.15 的 5.9 最后变更时间与存放，新增迁移 alembic/versions/20261119_0010_reservation_last_changed_at.py（revision 0010，接在 0009 之后），
      在 app/models/orders.py 的 Reservation 加列 last_changed_at（DATETIME(6)，非空）与两个索引，并让现有改预留行或订单行的命令在同一事务里设它。
      数据库与命令放在同一个任务里（拆分规则的例外），原因：只加列而命令不设，部署之后到下一个任务合并之前写入的预留会带着错的最后变更时间，对账会漏掉它们；拆开就要在第二个任务里再回填一次。
      一，迁移只加列、加索引（契约 2.2）：加列时以 CURRENT_TIMESTAMP(6) 为默认值，同一迁移里回填已有的行，取 created_at、closed_at、committed_at、review_closed_at
      与该预留 order_documents.created_at 中最大的一个（空值不计）；索引 (tenant_id, channel_id, last_changed_at, reservation_id) 与 (tenant_id, channel_id, status, reservation_id)；downgrade 删去两个索引与这一列。
      不新建模型模块，所以不用改 alembic/env.py 与 app/models/__init__.py。
      二，设它的事务（契约 5.9 列出的全部）：预留新建（等于 created_at）、释放、到期关单（定时任务、新预留之前、确认销售之前、释放命中已到期，各条路径都算）、确认销售（正常与晚到）、第一次转入待审、故障补交新建、待审结案，
      在 app/services/reservations.py 与 app/services/sale_commits.py 里写预留行的同一条 UPDATE 或 INSERT 里带上；发货、退款回库、退货验收在 app/services/fulfilment.py 里，写单据的同一事务里对预留行加一条 UPDATE，取本命令的时间。
      一个事务为写库取了不止一次数据库时间时，用写库用到的最晚一次；只为生成响应而取的时间不算。
      事务改了预留或订单行、却没有写任何时间列的（例如已到期、已关单的预留第一次转入待审，只写 payment_ref、paid_at 与确认的各列），取本命令的时间（app/services/stock.py 的 command_now）；
      paid_at 是调用方给的业务时间，任何情况下都不用它。
      三，不改任何列的路径不设：幂等重放与换键重报返回已有结果、对已 released 或 expired 的再释放、待审重试仍不够、对已 closed_refunded 的再结案。
      四，last_changed_at 不进预留的表示，现有接口的响应不变。
      明确不做：对账查询与待审列表接口（CORE-TASK-056）；不变量自查（CORE-TASK-057）；SKU 合并改挂时设它（登记 SKU 合并时做）。
