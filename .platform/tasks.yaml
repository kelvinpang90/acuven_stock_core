  - id: CORE-TASK-120
    title: 平台连接在人工与自动之间切换模式的命令，切到自动时记下接管点
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 6.2 第 5 条、契约 docs/CONTRACT_V1.md 0.22 的 3.2（逾期时不能从人工切到自动）与 10 第 3 条的角色表（切换模式要 stock_admin）（工作包 P4c 之后，Kelvin 2026-11-24 定放在第 4 组）。
      一，命令体 switch_mode(execution, body)，加在 app/services/platform_connections.py（正文 channel_id、mode、reason，已由接口校验）：事务里 FOR UPDATE 连接行，再普通读这个入口 manual_checks 里 checked_until 的最大值；目标与当前相同 409 STATE_CONFLICT（details {"reason": "mode_unchanged"}）。
      切到 auto，按先后只报第一个：status 不是 active 409 STATE_CONFLICT（{"reason": "not_connected"}）；pull_allowed 按目标模式 auto 与当前 status、capabilities 判，不满足 409 STATE_CONFLICT（{"reason": "capability_missing"}）；manual_check_overdue（CORE-TASK-082，mode 传当前的 manual，mode_changed_at 取连接行，now 为数据库时间）为真 409 MANUAL_CHECK_OVERDUE（契约 3.2）；接管点取逾期判定的起点（最近一次核对的 checked_until 与 mode_changed_at 中较晚的那个；没核对过就是 mode_changed_at；契约只写了“最后一次核对的 checked_until”，这样取是为了与逾期规则的“切换之前的核对不算数”一致，补的）；这个入口有 source 为 manual、action 为 created、ready_to_ship、cancelled 或 shipped（契约 5.10 第 3 条人工登记的四种；退货验收不算；后台的待处理重试、继续处理与关闭写的也是这几种动作，收件箱分不出来，一并算上，宁可多要求补一次核对）、received_at 晚于接管点的收件箱事件时 409 STATE_CONFLICT（{"reason": "manual_events_after_check"}）：接管点之后的人工登记（尤其用 m<n> 派生引用的交运）会被补拉再记一次，要先补一次核对把接管点推到它们之后（补的）。这一项是在连接行锁下的普通读，挡不住切换同一刻才提交的人工登记；运行手册写明切换前先停止人工登记（另行补上），残余风险列进登记 PR。都通过时 takeover_at 设为接管点；pull_cursor 在这个入口第一次切到自动时（原 takeover_at 为空）设为接管点，从自动切回人工再切回自动时设为原 pull_cursor 与原 mode_changed_at（这段人工期的开始）两者中较早的那个（原游标为空时取后者；人工期里补拉不运行，游标可能落后于人工期的开始）：已有自动事件的订单在人工期里不能人工登记（CORE-TASK-105），它们的事件按契约 0.25 的例外不丢（CORE-TASK-117 的 takeover_cut，118 照用），要从人工期开始拉起才补得上（补的；人工期长于平台订单列表能回溯的范围时补拉会一直失败，要等 V-08 核实回溯范围后再定怎么办，登记 PR 列为待定）；mode 改为 auto，mode_changed_at 设为数据库时间。设计写的是“向前补拉、去重、对账，然后把 mode 改为 auto”；CORE-TASK-086 的 record_auto_event 在人工模式下不写收件箱，所以改为先切模式、由补拉作业从接管点拉起；切换之后、这个租户跑完一次对账之前，发布作业不写这个入口（CORE-TASK-121），对账跑完前的事件照常处理（补的写法）。切换之后由管理员在后台手动发起一次对账（CORE-TASK-125），不等每天一次的定时对账；运行手册的这一步另行补上。
      切到 manual：任何 status 都可以；mode 改为 manual，mode_changed_at 设为数据库时间，takeover_at 与 pull_cursor 不动（下次切到自动时重算）；从 auto 切到 manual 时，同一事务把这个入口全部 channel_allocations 行按 sku_id 升序 FOR UPDATE 后（契约 3.1 的锁序）将 manual_confirmed_quota 与 manual_confirmed_at 清空（契约 0.24 的 3.2：自动期间写到平台的值不经确认；不另记日志，由 connection_mode_changed 的 mode 可知）。
      两种切换都写 platform_ops_log（connection_mode_changed，object_type channel、object_id 为 channel_id，before 与 after 为 channel_id、status、mode、capabilities，reason 为正文的，操作主体列取上下文）。返回连接在 CORE-TASK-116 列表里的表示。
      接口另由 CORE-TASK-155 做（设计预审报 TOO_LARGE 后拆出，补的）。
      明确不做：接口（CORE-TASK-155）；人工模式下的其余运营操作（CORE-TASK-151～154）；前端。
    status: ready
    depends_on:
      - CORE-TASK-119
    acceptance_criteria:
      - tests/integration/test_platform_connection_mode.py：经 CORE-TASK-099 的 run_admin 调 switch_mode（operation 为 platform_connections.mode、角色 stock_admin，上下文照 tests/integration/test_platform_authorization_service.py 的做法构造）：人工模式、active、有 read_orders 能力、核对未逾期的入口切到 auto 成功，takeover_at 等于最近一次核对的 checked_until、pull_cursor 等于 takeover_at、写了一条 connection_mode_changed（actor_role 为 stock_admin）
      - 没核对过的入口切到 auto 时 takeover_at 等于原 mode_changed_at；切换之前（mode_changed_at 之前）的核对不算数
      - 逾期 409 MANUAL_CHECK_OVERDUE、未连接 409 STATE_CONFLICT、缺能力 409 STATE_CONFLICT、接管点之后有人工登记 409 STATE_CONFLICT、目标与当前相同 409 STATE_CONFLICT，details 如 purpose 所写，被拒的都不改连接、不写日志；补记一次核对之后再切换成功
      - 切到 manual 在 auth_failed 状态下也成功，takeover_at 与 pull_cursor 不变，这个入口各配额行的 manual_confirmed_quota 与 manual_confirmed_at 清空、别的入口不变（契约 0.24）；切到 manual 之后补拉作业不再拉这个入口（调一次 PullRunner 的一轮，模拟平台没有收到读订单的调用）
      - 从自动切回人工再切回自动时，pull_cursor 取原 pull_cursor 与原 mode_changed_at 中较早的那个，原游标为空时取后者
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/platform_connections.py
      - tests/integration/test_platform_connection_mode.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-121
    title: 库存发布的服务：先补拉再按配额写平台绝对值，逐个 SKU 记结果，失败退避，遵守写入暂停
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 4 节（只写绝对值、什么时候写、发布前先补拉、逐个 SKU 记结果）与第 5 节（自动写平台暂停、待核对），契约 docs/CONTRACT_V1.md 0.22 的 3.1 与 3.2（工作包 P4d 的发布部分）。新服务模块 app/services/platform_publish.py。
      一，什么时候写（不建队列表，每轮从现状算出，补的）。平台卖出时自己会扣展示量，Core 不再写一次（设计第 4 节），所以不拿“Q 与上次写的值不等”当触发。对象是“SKU × 入口”，满足全部前提：入口的连接 auto_sync_allowed；这个租户已有一次 started_at 晚于这个入口的 mode_changed_at、finished_at 非空的 reconciliation_runs（从人工切到自动之后先对账再写，设计 6.2 第 5 条，CORE-TASK-120）；SKU 在这个入口有 active 平台商品；channel_allocations 的 review_hold 为假。“上次落定的发布”指这条平台商品（按 listing_id）最近一条 result 为 confirmed、unsupported 或 platform_controlled 的 publish。触发有三种，满足其一就写：(a) 这条平台商品在这个入口最近一次切到自动（mode_changed_at）之后还没有落定的发布（刚切到自动，包括从人工切回自动，人工期间平台显示量可能已与 Q 不同；或新挂上的平台商品）；(d) 这条平台商品有晚于上次落定的发布的 catalog_changes（object_type listing；改挂与解除后再挂沿用同一个 listing_id，契约 2.9，靠这一条触发）；(b) 这个池这个 SKU 有晚于上次落定的发布的 allocation_changes（管理员改了配额或安全库存，设计“改配额后排进发布”；只改 S 也算，多写一次无妨）；(c) 这个入口这个 SKU 有晚于上次落定的发布的 review_hold_cleared 日志（按 object_type sku、object_id 为 sku_id、after 里的 channel_id 为这个入口找，同 CORE-TASK-122 写 review_hold_set 的形状；写它的“解除待核对”在第 3 组其余运营操作里，登记时照这个形状）（管理员核对后解除了待核对，按解除时的 Q 写一次；“恢复了 Q 而平台没有自动加回”由读回发现、设上待核对，管理员核对解除后走这一条，设计“先核对，再写绝对目标”）。退避与下面三的连续失败都按 listing_id 算：这条平台商品最近连续 n 条 publish 是 failed 或 unknown（n 大于 0，在上次落定的发布之后）的，在最后一条的 created_at 加 backoff_minutes(n 减 1) 分钟之前不写（设计“失败或结果未知时保留差距、不叠加、退避重试”）。
      二，PublishRunner.run_round(engine, adapters, secrets, settings, *, database)：作业 platform-publish 的一轮。在专用连接上取作业锁（job_lock_name，取不到返回 SKIPPED，用法同 CORE-TASK-115 的刷新作业）。按租户：这个租户 platform_write_pause.paused 为真时整个租户跳过（不写平台，设计第 5 节；读与补拉由别的作业照常做）。按入口，有要写的 SKU 时：先 pull_channel(…, to_now 为真)（CORE-TASK-118），不是 pulled（partial、failed）就这一轮跳过这个入口；再对这个入口有未处理事件的订单（按最早 received_at 升序，至多 500 个）逐个 process_order，有任何一个返回锁忙也这一轮跳过这个入口（别的路径正在处理它，Q 还没定）；停在 blocked、missing_prior 或出错的订单不挡发布（它们由收件箱作业的积压告警报出）。然后逐个 SKU：在一个短事务里对这个 SKU 的 pool_allocations 行与这个入口的 channel_allocations 行 FOR SHARE（等正在改配额的事务提交），拿到之后读 quota、review_hold、platform_write_pause.paused 与数据库时间，读完即提交（不在持有行锁时调平台）；此时已设上待核对或写入暂停就跳过；事务外 adapter.write_stock(ShopAuth(…), 平台商品与规格 ID, quota)；用短事务追加一行 platform_publishes（kind publish，target_quantity 为写的值，listing_id 为这条平台商品，created_at 取读 quota 那个事务里拿到行锁之后读到的数据库时间，而不是写这一行的时间：改配额要先锁这两行，所以读 Q 之后才开始的配额变更 created_at 一定晚于它，仍会触发下一次写，补的）：WriteResult 的 confirmed、unsupported、platform_controlled 照记，platform_quantity 取平台确认的值，平台没给时取写的值；Rejected 记 failed、error_code 取平台错误码；Unknown 先 adapter.read_stock 读回这一个规格（设计“结果未知时先读回再决定”），读到的等于写的值记 confirmed（platform_quantity 为读到的），否则或读失败记 unknown；RateLimited 记 unknown、这个入口这一轮停下（限流按店铺算，补的）；AuthRevoked 与 AuthFailed 按 mark_connection_failed 改状态并告警，这个入口这一轮停下。
      三，连续失败告警：一个“SKU × 入口”最近连续 3 条 publish 都是 failed 或 unknown 时记 publish_failed 告警（channel_id、sku_id，detail 为最后一条的 result 与 error_code；门槛 3 是补的），未确认的不重复（record_alert）。
      四，访问令牌解不开时按 mark_connection_failed 处理，这个入口这一轮停下。主密钥未配置或没有适配器的入口跳过（记一行日志）。
      明确不做：读回比对与设上待核对（CORE-TASK-122）；挂作业（CORE-TASK-122）；解除写入暂停与待核对的后台操作（第 3 组其余运营操作，它写的 review_hold_cleared 日志就是上面的触发 (c)）。
    status: ready
    depends_on:
      - CORE-TASK-118
      - CORE-TASK-090
    acceptance_criteria:
      - tests/integration/test_platform_publish.py 用模拟适配器：切到自动并跑完一次对账之后，有平台商品的 SKU 第一次写入当前 Q、记一条 confirmed；对账跑完之前不写；平台卖出一件（经补拉处理、Q 减 1）之后不再写；改了配额（经 CORE-TASK-090 的服务）之后写新值；改挂到新的平台商品之后写一次；模拟平台记下的写入都是绝对值
      - 发布前先补拉到当前时刻：模拟平台上有一张新订单，这一轮写给平台的是处理完这张订单之后的 Q；补拉得 partial 或有订单锁忙时这个入口这一轮不写
      - 写入暂停设上时整个租户不写、不记 publish；待核对设上的 SKU 不写，同入口别的 SKU 照写
      - Rejected 记 failed 并按 1、2、4 分钟退避；连续 3 条失败记一条 publish_failed 告警且不重复；Unknown 而读回等于写的值记 confirmed，不等记 unknown；unsupported 与 platform_controlled 之后在没有新的触发时不再写
      - 另一个连接持有作业锁时一轮返回 SKIPPED、不调平台
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/platform_publish.py
      - tests/integration/platform_fixtures.py
      - tests/integration/test_platform_publish.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-122
    title: 读回比对：写入后与定时读平台库存，读数不符设上待核对并告警；发布与读回作业挂进进程
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 4 节读回比对与第 5 节“SKU × 入口待核对”，契约 docs/CONTRACT_V1.md 0.22 的 3.2（review_hold 三列、platform_ops_log 的 review_hold_set）（工作包 P4d 的读回部分）。在 CORE-TASK-121 的 app/services/platform_publish.py 上补。
      一，哪些 SKU 拿来比（补的，免得把“还没写过去的新 Q”当成平台不符）：这个 SKU 在这个入口上次落定的发布（CORE-TASK-121 的定义）是 confirmed，而且没有 CORE-TASK-121 一里的待写触发、也没有在退避中的失败。不满足的这一次不比，等发布作业先写过去。
      二，readback(engine, adapters, secrets, tenant_id, channel_id, skus)：解密访问令牌（解不开、AuthRevoked、AuthFailed 都按 mark_connection_failed 处理、这次不比）；先 pull_channel(…, to_now 为真) 并处理这个入口有未处理事件的订单（同 CORE-TASK-121 二的做法；补拉不是 pulled 或有订单锁忙就这次不比），再按 CORE-TASK-121 二的读法（FOR SHARE 两行、读完即提交）读各自当前的 quota，并在同一事务里重新判一（不满足的、没有 active 平台商品的这次不比，返回 skipped），再事务外 adapter.read_stock 读这些 SKU 当前 active 的平台商品（两次读之间的销售可能让两边差几件，所以下面复核）。读平台失败记一行 readback（target_quantity 为读到的 quota）、result 为 failed、error_code，不设待核对。读到的与 quota 相同记 matched。不同的先复核一次：再补拉、处理，再照上面先读 quota 并重新判一（已不满足就这次不比）、后读平台，仍不同才记 mismatched 并设待核对，复核时相同记 matched（补的：缩小设计第 4 节说的那个窗口带来的误报）。
      设待核对在一笔事务里：FOR UPDATE 这一行 channel_allocations，review_hold 为假时设 review_hold 为真、review_reason 为 readback_mismatch、review_since 为数据库时间，写 platform_ops_log（review_hold_set，object_type sku、object_id 为 sku_id，before 与 after 为 channel_id、sku_id、review_hold、review_reason 四个键，credential_id 为这个租户的 system 主体，actor_ref、actor_role、request_id 为空），同一事务 record_alert(readback_mismatch, channel_id, sku_id，detail 为两个数)；已设上的不改原因与时间、不再告警（同设计第 5 节“已设上时再设不改原来的原因”；告警只在新设上时记一次）。不用 Q 覆盖平台，也不把平台读数当成新的实物（设计第 4 节）。readback 返回每个 SKU 的结果（matched、mismatched、failed 或 skipped），供对账（CORE-TASK-123）计差异。
      三，写入之后读回：CORE-TASK-121 的一轮里，每个入口写完之后，对这一轮记了 confirmed 的 SKU 调一次 readback。
      四，ReadbackRunner.run_round：作业 platform-readback 的一轮（周期取 JOB_INTERVALS；设计“以及定时”没写周期，补的）：对每个满足 readback_allowed（CORE-TASK-111）、有适配器、主密钥已配置的入口，对满足一的 SKU 调 readback。写入暂停设上时照常读与比对（设计第 5 节：读平台库存照常；停的只是往平台写数）。不取作业锁（只读平台，设上待核对在行锁下做、是幂等的；补的）。
      五，app/main.py：create_app 在后台开关为真时再建两个定时任务 platform-publish（调 PublishRunner.run_round）与 platform-readback（调 ReadbackRunner.run_round），周期取 JOB_INTERVALS，与现有任务一起启动、并行停止，就绪检查列出它们；开关为假时不建、不列。
      明确不做：解除待核对（第 3 组其余运营操作）；对账作业里的库存比对调本任务的 readback（CORE-TASK-123）。
    status: ready
    depends_on:
      - CORE-TASK-121
      - CORE-TASK-120
    acceptance_criteria:
      - tests/integration/test_platform_readback.py 用模拟适配器：已写过去的 SKU 读数与 Q 相同记 matched、不设待核对；模拟平台自己改了显示量时复核后仍不同，记 mismatched、设上 review_hold 与原因和时间、写一条 review_hold_set 与一条 readback_mismatch 告警；再比对一次不改原来的原因与时间、不再告警
      - 第一次读平台时不同、复核时相同（替身在两次之间改回）记 matched、不设待核对
      - 改了配额还没写过去的 SKU、刚切到自动还没写过的 SKU 都不比；平台卖出一件（经补拉处理、Q 减 1）之后照常比、得 matched；补拉没拉完时这次不比
      - 写入后读回：写入之后模拟平台改了显示量，这一轮之后这个 SKU 在这个入口已设上待核对，下一轮不再写它，同一 SKU 在别的入口照写；读回不符之后模拟平台没有收到新的写入
      - 写入暂停设上时定时读回照常比对并设上待核对，但不写平台；读平台失败记 failed、不设待核对
      - tests/integration/test_platform_jobs.py 加：后台开关为真时就绪检查列出 platform-publish 与 platform-readback，为假时不列
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/platform_publish.py
      - app/main.py
      - tests/integration/platform_fixtures.py
      - tests/integration/test_platform_publish.py
      - tests/integration/test_platform_readback.py
      - tests/integration/test_platform_jobs.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-123
    title: 对账的服务：补拉核对未结订单与平台库存，查超额与不变量自查，差异记告警不自动修
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 7 节（三项对账、差异进待处理不自动修、恢复后的第一次对账手动发起）与第 5 节（对账差异设上待核对），契约 docs/CONTRACT_V1.md 0.22 的 3.2（reconciliation_runs）、3.1（F 与超额）与 4.4（不变量自查第 6 项）（工作包 P4e 的对账部分）。新服务模块 app/services/platform_reconcile.py。
      一，execute_run(engine, adapters, secrets, run)：执行一行已存在、finished_at 为空的 reconciliation_runs（行由二或后台接口 CORE-TASK-125 插入），调用方已持有对账的作业锁。
      第 1 步，平台订单（只对这个租户满足 pull_allowed 的入口）：先 pull_channel（CORE-TASK-118）；之后重新读连接，status 已不是 active（补拉时撤权、令牌失效）的这个入口跳过第 1、2 步；补拉得 failed（暂时性的）或 partial 的照常做逐单核对；再对这个入口未结的平台订单（stage 为 unpaid 或 held，或 committed 而还有未交运也未取消的件数）逐个事务外 adapter.read_order：有快照就照补拉写进收件箱（snapshot_events、drop_before_takeover、record_auto_event）并 process_order；Unknown、RateLimited、Rejected 记为这次没核对上（只计数、写日志，不算差异）；AuthRevoked、AuthFailed 按 mark_connection_failed 处理并停止这个入口。有任一行记了 known_discrepancy 的订单整单不比（管理员已认定的差异，契约 3.2）；process_order 返回锁忙的订单这次不比（计入没核对上）。之后下面任一算这个订单的一条差异（每个订单最多记一条，代码取第一个）：仍有 received_at 早于这次 process_order 之前读到的数据库时间的未处理事件（pending_events；之后才到的不算）；订单为 unpaid 或 held 时快照里某行的 cancelled_total 与 Core 的 cancelled_qty 不等（cancelled_mismatch；已确认之后的取消在 Core 里不记 cancelled_qty，CORE-TASK-089，所以 committed 的不比）；committed 的订单按 CORE-TASK-083 的行合并（同一 SKU 的平台行合并成一个 Core 订单行）把快照各包裹的件数按 platform_order_lines 上已存的 sku_id 汇总（不按当前的平台商品映射），与对应 Core 订单行的累计交运量不等（shipped_mismatch）；平台上没有这个订单（missing_on_platform）。每条差异计入差异数；这个订单已有 detail 里差异代码相同的 reconcile_discrepancy 告警（不论确认与否）时只计数，不再告警、不再设待核对（管理员处理过、解除了的不每天重设；新出现的别种差异照常报，补的）；否则记 reconcile_discrepancy 告警（platform_order_row_id，detail 带差异代码），并把这个订单有 SKU 的各行在这个入口的 channel_allocations 设上待核对（review_reason 为 reconcile_discrepancy，做法同 CORE-TASK-122 的设待核对，已设上的不改；设计第 5 节“对账发现差异时由对账作业设上”）。差异都不自动修，平台订单的阶段与数量不动（设计第 7 节的“进待处理”在这里落为告警加待核对，补的）。
      第 2 步，平台库存（只对满足 readback_allowed 的入口）：对满足 CORE-TASK-122 一的 SKU 调它的 readback，mismatched 的各算一条差异（那里已设上待核对并告警）。
      第 3 步，配额约束：在一个只读事务里（一致性快照，所以各数取自同一时刻）读这个租户每个有 platform 入口配额行的池与 SKU 的 available、S、各入口 Q 与 pending，用 CORE-TASK-082 的 unallocated 算 F，小于 0 的各算一条差异、记 over_allocated 告警（sku_id，detail 为 F）；超额不设待核对、不写 0、不停售（契约 3.1）。
      第 4 步，Core 自查：在进程内调 app/services/invariants.py 里给 GET /v1/ops/invariants 用的那个读函数（CORE-TASK-091 加了第 6 项），有违反时算一条差异、记一条 invariant_violation 告警（detail 为 violation_count、返回的违反里出现的检查名，以及是否被截断）。
      时间预算：一次执行的第 1、2 步合计最多 4 分钟（就绪检查的停转判定是 2 个周期加 300 秒，作业一轮不能跑太久，补的）；到了预算就停下，剩下的订单与 SKU 这次不核对（计入没核对上、写日志），照常做第 3 到 5 步。
      第 5 步，用短事务写 finished_at 与 discrepancy_count。中途出了程序异常时记日志、finished_at 留空（后台显示为未完成）、不往外抛。manual 模式的入口只做第 3、4 步涉及它的部分（没有令牌，读不了平台）。
      二，ReconcileRunner.run_round(engine, adapters, secrets, *, database)：作业 platform-reconcile 的一轮（周期取 JOB_INTERVALS，1 分钟）。在专用连接上取作业锁 job_lock_name(database, platform-reconcile)，取不到返回 SKIPPED（契约 8.6 第 4 条只给刷新令牌与发布取锁；对账也取，免得手动与定时的两次同时跑、重复设待核对，补的）。一轮只执行一行 run（免得两次对账相加超过停转判定）：有 trigger 为 manual、finished_at 为空、started_at 在 24 小时之内、本进程还没试过的行时，执行其中 started_at 最早的一行（试过的 run_id 记在 Runner 对象上，出了异常的不反复重试）就结束这一轮；没有时，找第一个满足下面条件的有 platform 入口的租户（按 tenant_id 升序）：24 小时之内没有 trigger 为 scheduled 的行、且 platform_write_pause.paused 为假时，插入一行 scheduled（new_id 的 rcn 前缀，started_at 为数据库时间，credential_id 为空）并执行，然后结束这一轮。写入暂停设上时不跑定时对账：整机恢复之后的第一次对账由管理员手动发起（设计第 7 节），暂停在那之前一直设着，这样定时的不会抢先。用完 RELEASE_LOCK，出错作废这个连接。
      明确不做：后台接口与挂作业（CORE-TASK-125）；告警推送（CORE-TASK-124）。
    status: ready
    depends_on:
      - CORE-TASK-122
      - CORE-TASK-091
