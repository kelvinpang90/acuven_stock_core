  - id: CORE-TASK-115
    title: 平台连接的作业服务：刷新令牌并立即存下、改连接状态、清理授权 state、记严重告警、作业可跳过一轮
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 2 节（令牌刷新、授权失效）与第 8 节、契约 docs/CONTRACT_V1.md 0.22 的 3.2（platform_connections、platform_oauth_states、platform_alerts、platform_ops_log）与 8.6 第 4 条（工作包 P4a 的服务部分之一；第 2 轮预审嫌一个任务太大，发起授权、回调与断开拆到 CORE-TASK-127）。新服务模块 app/services/platform_connections.py 与 app/services/platform_alerts.py；规则调 CORE-TASK-111 的纯函数，平台只经 CORE-TASK-112 的协议调用，且都在事务外（设计第 10 节）；测试用模拟适配器。
      一，platform_alerts.record_alert(connection, *, tenant_id, kind, channel_id=None, sku_id=None, platform_order_row_id=None, detail=None)：在调用方的事务里写一行 platform_alerts（new_id 的 alr 前缀，kind 只收 ALERT_KINDS，created_at 为数据库时间，发送相关的列为空）；同一个 kind 与同一组对象（三列逐一相等，都为空也算相等）已有未确认的告警时不再写、返回那一条的 ID（补的：同一个问题不刷屏，重复提醒由推送作业每 15 分钟做；去重是普通读，不加锁，两个作业同时记同一个问题可能各写一条，只是多一条提醒，接受）。detail 只放 ID、件数与错误码，不放令牌、平台返回的原文与顾客资料。
      二，mark_connection_failed(connection, *, tenant_id, channel_id, status, expected_refresh_ciphertext)：在调用方的事务里 FOR UPDATE 连接行，status 仍为 active 且 refresh 密文仍等于 expected（为 None 时不比）才改：status 改为参数的 auth_failed 或 revoked，写 platform_ops_log（connection_status_changed，object_type channel、object_id 为 channel_id，before 与 after 为 channel_id、status、mode、capabilities 四个键，credential_id 为这个租户的 system 主体，actor_ref、actor_role、request_id 为空），record_alert(auth_failed, channel_id)；否则什么也不写（这期间被断开或重新授权了）。之后的补拉、发布、对账任务也用它。
      三，refresh_tokens(engine, adapters, secrets, *, database) 作业 platform-token-refresh 的一轮：主密钥未配置时记一行日志、正常结束；在一个专用连接上 GET_LOCK(job_lock_name(database, 作业名), 0)，取不到返回 SKIPPED（见五），用完 RELEASE_LOCK，出错作废这个连接，这个连接不用来执行别的语句（契约 8.6 第 4 条）。对 status 为 active、access 到期时间早于数据库时间加 REFRESH_AHEAD 的连接逐个（没有这个平台的适配器的跳过、记一行日志）：记下读到的 refresh 密文，解密（解不开按 auth_failed 处理）；事务外 adapter.refresh_token(platform_shop_id, …)。成功时 TokenGrant 的 shop_id 与入口的 platform_shop_id 不同按 auth_failed 处理；否则先用单独的短事务存下新令牌与到期时间、last_refreshed_at，再做别的（契约 8.6 第 4 条）；之后再看重新 normalize 的 capabilities：原来 available 的某一项不再是 available（获批 scope 不足，设计第 2 节）时，另用一笔事务存下新的 capabilities 并经 mark_connection_failed 改为 auth_failed、告警；没少的只存下新的 capabilities；normalize 不合格时 capabilities 不变、记日志；这个事务先 FOR UPDATE 连接行，只有 status 仍为 active 且 refresh 密文仍是刚才读到的那一份时才写，否则什么也不写（新令牌丢掉无妨，那边已断开或有更新的令牌）。AuthRevoked 改为 revoked，AuthFailed 与 Rejected 改为 auth_failed（都经 mark_connection_failed）；Unknown 与 RateLimited 不改状态、下一轮再试，但 access 已经到期时记一条 auth_failed 告警（不改状态，record_alert 去重；补的：令牌过期了还刷不成，管理员要知道）。
      四，purge_oauth_states(engine)：删 expires_at 早于数据库时间减 1 天的行（多留一天供排查，补的），一次最多删 1000 行。
      五，作业可以跳过一轮：app/domain/periodic.py 加常量 SKIPPED；app/services/periodic.py 的 run_once 在作业函数返回 SKIPPED 时这一轮既不记正常结束也不记失败（最近一次正常结束的时间与 last_outcome 不变），所以连续跳过会按契约 8.5 stale 第 3 条报出（契约 8.6 第 4 条）；其他返回值照旧算正常结束。
      明确不做：发起授权、回调与断开（CORE-TASK-127）；接口与挂作业（CORE-TASK-116、126）；切换模式（CORE-TASK-120）；Telegram 推送（CORE-TASK-124）。
    status: ready
    depends_on:
      - CORE-TASK-110
      - CORE-TASK-112
      - CORE-TASK-114
    acceptance_criteria:
      - tests/integration/test_platform_connections_service.py 用模拟适配器与 tests/integration/platform_fixtures.py 的租户（连接直接写成 active、令牌用主密钥加密）：快到期的连接刷新后新令牌已存下、能解回；模拟“存下新令牌之后、改能力或状态之前出错”，库里已是新令牌；刷新时平台收窄了能力，capabilities 跟着改且连接改为 auth_failed 并告警
      - 撤权改为 revoked、令牌失效改为 auth_failed、店铺 ID 不符改为 auth_failed，各写一条 connection_status_changed 与一条 auth_failed 告警；Unknown 不改状态，access 已到期时多记一条 auth_failed 告警且不重复
      - 刷新拿到新令牌时连接已被断开或令牌已换（在调平台的替身里直接 UPDATE），不写回令牌、不改状态；另一个连接持有作业锁时返回 SKIPPED、不调平台；没有适配器的连接跳过
      - record_alert：同一 kind 同一组对象未确认时不重复写，确认之后再记会写新的一行；detail 里没有令牌。清理只删过期满 1 天的 state
      - tests/integration/test_periodic_skip.py：作业返回 SKIPPED 的一轮不改最近一次正常结束的时间与 last_outcome，连续跳过超过 2 个间隔加 300 秒后 stale 为真；返回 None 照旧算正常结束
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/platform_connections.py
      - app/services/platform_alerts.py
      - app/services/periodic.py
      - app/domain/periodic.py
      - tests/integration/platform_fixtures.py
      - tests/integration/test_platform_connections_service.py
      - tests/integration/test_periodic_skip.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-127
    title: 平台授权的服务：发起授权、跳转到平台授权页、回调换令牌并立即存下、断开连接
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 2 节（OAuth、state、令牌）、契约 docs/CONTRACT_V1.md 0.22 的 3.2 与 8.6 第 2、3、4 条（工作包 P4a 的服务部分之二，第 2 轮预审后从 CORE-TASK-115 拆出）。加在 CORE-TASK-115 的 app/services/platform_connections.py；规则调 CORE-TASK-111，平台只经 CORE-TASK-112 的协议在事务外调用；测试用模拟适配器，新测试文件 tests/integration/test_platform_authorization_service.py（夹具用 CORE-TASK-115 之后的 tests/integration/platform_fixtures.py，本任务不改它）。
      一，发起授权分两步，都不改连接、不写 platform_ops_log：
      start_authorization(execution, *, channel_id, key, admin_session_id)：给 run_admin 用的命令体（契约 8.6 第 2 条：后台写操作都走后台执行器）；channel_id 来自接口的路径参数，主密钥 key 与适配器是否存在由接口在调执行器之前判。命令体在事务里 FOR SHARE 读入口行，不再是本租户 active 的 platform 入口时 409 STATE_CONFLICT（{"reason": "channel_not_active"}，预检之后被停用的竞态）；否则写一行 platform_oauth_states：oauth_state_id 用 new_id 的 oas 前缀，state_hash 为 state_hash(derive_state(key, oauth_state_id))，platform 取入口的，credential_id 取上下文，admin_session_id 取参数，expires_at 为数据库时间加 STATE_TTL；返回 oauth_state_id 与 expires_at（响应与幂等记录里都没有 state 原文）。
      authorize_redirect(connection, adapters, key, *, tenant_id, admin_session_id, oauth_state_id) 按先后只给第一个结果：这一行不存在、属于别的租户、或 admin_session_id 不是当前会话为 not_found（只许发起的那个会话跳转，补的）；check_state（platform 取行上的）为 used 或 expired 时为 used 或 expired；key 为 None 为 token_key_missing；没有行上那个平台的适配器为 adapter_missing；否则为 ok 与 adapter.authorize_url(derive_state(key, oauth_state_id))。
      二，complete_authorization(engine, adapters, secrets, *, platform, code, state, extra, request_id) 返回 authorized、failed 或 expired（只给回调跳转用）：
      第 1 步，短事务按 state_hash(state) FOR UPDATE 读 state 行；行存在且 used_at 为空时不论之后结果如何都把 used_at 设为数据库时间（用过即作废）。结果按先后只取第一个：check_state 为 expired 得 expired；为 unknown、used、platform_mismatch 得 failed；这一行的 admin_session_id 对应的会话已无效得 failed（本模块自己写这个按会话 ID 的只读查询，有效条件照 CORE-TASK-096 resolve_session 的：未撤销、未过期、账号未停用；会话 cookie 是 SameSite=Strict，平台跳回来的请求不带它，所以“绑定管理员会话”在这里按 state 行上的会话 ID 查，管理员退出或会话过期都让未完成的授权作废，是补的）；code 为 None（平台带回 error、用户拒绝授权、或接口判 code 不合格）得 failed；主密钥未配置或没有这个平台的适配器得 failed。
      第 2 步，事务外 adapter.exchange_code(code, extra)；任何 PlatformError 得 failed，进程日志只记 describe_error。TokenGrant 的 shop_id 与入口的 platform_shop_id 不同得 failed（补的：防把别的店铺授权到这个入口）；capabilities 用 normalize_capabilities，不合格得 failed。
      第 3 步，平台返回令牌后立即用一个单独的短事务存下（契约 8.6 第 4 条）：FOR UPDATE 入口行与连接行；入口已不是 active 的 platform 入口，或这个入口在 state 的 created_at 之后有 connection_disconnected 的日志（发起授权之后被停用或断开了）时不存、得 failed（补的）；否则 access 与 refresh 各用一个新 nonce 加密，写两列密文与到期时间、status 改为 active、capabilities、last_refreshed_at；同一事务写一条 platform_ops_log（action connection_authorized，object_type channel、object_id 为 channel_id，before 与 after 为 channel_id、status、mode、capabilities 四个键，credential_id 为 state 行上的管理员主体，actor_ref 为这个会话的管理员账号 ID，actor_role 为 stock_admin，request_id 为本次回调的）；得 authorized。
      三，disconnect_connection(execution, body)：给 run_admin 用的命令体（正文 channel_id 与 reason，已由接口校验）。事务里 FOR UPDATE 连接行（入口 inactive 的也可以断开，免得停用的入口留着令牌）；status 已是 not_connected 时 409 STATE_CONFLICT（{"reason": "not_connected"}），active、auth_failed、revoked 都可以断开；清空两列密文与到期时间、status 改为 not_connected、capabilities 改为空对象，mode 不变，并把这个入口 used_at 为空的 platform_oauth_states 都设上 used_at（未完成的授权作废）；写 platform_ops_log（connection_disconnected，键同上，reason 为正文的，操作主体列取上下文）。不去平台撤销授权（平台未必提供，运行手册写明到卖家后台撤销）。
      明确不做：接口（CORE-TASK-116、126）；切换模式（CORE-TASK-120）。
    status: ready
    depends_on:
      - CORE-TASK-115
      - CORE-TASK-099
    acceptance_criteria:
      - tests/integration/test_platform_authorization_service.py：发起授权的命令体只存 oauth_state_id 与哈希；authorize_redirect 的五种拒绝各一条（别的会话、别的租户、过期、用过、没有适配器），对发起的会话返回带 derive_state 文本的地址
      - 回调成功后连接为 active、两列密文能用同一主密钥解回模拟平台发的令牌、写了一条 connection_authorized 且前后值里没有令牌与 code、state
      - 回调的每种失败各一条用例（state 不存在、用过、过期、平台不符、会话已撤销、code 为空、没有适配器、换令牌时平台报错、店铺 ID 不符、能力矩阵不合格、发起之后入口被停用），都不改连接；凡是读到了没用过的 state 行的，used_at 都被设上；过期且 code 为空得 expired；同一个 state 回调两次，第二次为 failed
      - 断开：清空令牌、status 为 not_connected、mode 不变、写一条 connection_disconnected、未用的 state 都作废；inactive 入口也能断开；已断开的再断开 409 STATE_CONFLICT；发起授权之后断开、再回调得 failed 且连接不变
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/platform_connections.py
      - tests/integration/test_platform_authorization_service.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-116
    title: 后台的平台连接列表、发起授权、跳转到平台授权页与断开接口
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 8.6 第 2 条（连接页、写接口的检查顺序、后台写操作走后台执行器）与 docs/PLATFORM_CHANNELS.md 第 2 节（工作包 P4a 的后台接口部分；第 1 轮预审嫌一个任务太大，回调与作业拆到 CORE-TASK-126）。新接口模块 app/api/admin_connections.py，在 app/main.py 只在后台开关为真时挂上；读查询加在 app/services/admin_queries.py。
      一，接线：create_app 在后台开关为真时把 app.state.platform_adapters 设为 build_adapters(settings)（CORE-TASK-112；测试替换成模拟适配器），开关为假时为空字典。
      二，GET /api/v1/admin/connections：只要求登录（CORE-TASK-099 的读依赖）；列这个租户全部 platform 入口（含 inactive）的连接，按 channel_id 升序、不分页（V1 一个租户两个）：channel_id、platform、platform_shop_id、channel_status、mode、mode_changed_at、takeover_at、status、app_profile、capabilities（normalize 后的五项）、auto_sync（auto_sync_allowed）、has_token（布尔）、access_expires_at、refresh_expires_at、last_refreshed_at、last_synced_at、pull_cursor、inbox_backlog（这个入口 applied_at 为空的收件箱事件数）、oldest_pending_received_at（其中最早的 received_at，没有为空）。不出任何令牌（明文与密文）。时间按 app/api/catalog.py 的 RFC 3339 微秒 Z 格式。
      三，POST /api/v1/admin/connections/{channel_id}/authorize：经 CORE-TASK-099 的依赖与 run_admin（operation platform_connections.authorize，角色 stock_admin，上下文的入口与池为空），命令体为 CORE-TASK-127 的 start_authorization（channel_id 取路径参数，admin_session_id 取当前会话，key 取 app.state.platform_secrets）；正文为空对象（有键 422）。在调执行器之前用本请求的连接普通读预检，不合格的都在这里拒绝、什么也不写：channel_id 格式按 is_admin_id，入口不存在 404 NOT_FOUND，属于别的租户经 admin_not_found 记 cross_tenant 后同样 404；不是 platform 入口或不是 active 422 INVALID_REQUEST；主密钥未配置 503 UNAVAILABLE（details {"reason": "token_key_missing"}）；没有这个平台的适配器 503 UNAVAILABLE（{"reason": "adapter_missing"}）。成功 201，data 为 oauth_state_id、expires_at 与 redirect_path（四的路径加查询参数）；响应在交给 run_admin 的命令里拼好（本模块包一层 CORE-TASK-127 的命令体，加上 redirect_path），这样重放与第一次一字不差；同键同正文重放得同样的响应（响应里没有 state 原文，所以可以照常存幂等记录）。
      四，GET /api/v1/admin/connections/authorize-redirect?oauth_state_id=：要求登录（同站点的页面跳转会带会话 cookie）；oauth_state_id 恰好一个且符合 is_admin_id，否则 422；调 CORE-TASK-127 的 authorize_redirect（结果的先后由它定）；ok 时 303 跳到平台授权页地址，响应带 Cache-Control: no-store 与 Referrer-Policy: no-referrer；not_found 404 NOT_FOUND；expired 与 used 409 STATE_CONFLICT（{"reason": "state_expired"} 或 {"reason": "state_used"}）；token_key_missing 与 adapter_missing 503 UNAVAILABLE，details 同三。进程日志不记跳转地址（里面有 state）。
      五，POST /api/v1/admin/connections/{channel_id}/disconnect：经 run_admin（operation platform_connections.disconnect，角色 stock_admin，上下文的入口与池为空），命令体为 CORE-TASK-127 的 disconnect_connection；正文只有 reason（同契约 2.6 的 reason 惯例）；入口的预检只做三里的格式、不存在、别的租户与不是 platform 入口四项（inactive 的 platform 入口也可以断开；断开用不到主密钥与适配器，所以不判那两个 503）；200 返回这个连接在二里的表示，同样在交给 run_admin 的命令里、断开之后在同一事务里读出拼好。
      明确不做：授权回调与作业（CORE-TASK-126）；切换模式（CORE-TASK-120）；前端的连接页。
    status: ready
    depends_on:
      - CORE-TASK-127
    acceptance_criteria:
