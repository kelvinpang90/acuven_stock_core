  - id: CORE-TASK-006
    title: 实现请求 ID、错误封装、请求体解析与大小限制等共用请求处理
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.6 的 7.1、8.1 与 8.3，在接口层实现所有接口共用、与鉴权无关的请求处理，格式规则调用 CORE-TASK-004 的纯函数。
      一，请求 ID：每个请求校验或生成 X-Request-ID，每个响应（含错误与 healthz、readyz）都带这个头，响应体的 request_id 与它相同；
      X-Request-ID 不合格时 400，这个响应带 Core 生成的 ID；healthz 与 readyz 不校验，不合格时改用生成的 ID；路由 404 与 405 的响应在提供的 ID 合格时回显，否则用生成的。
      二，错误封装：成功体为 data 加 request_id，错误体为 error（code、message、retryable、details）加 request_id；接口层统一的业务异常带状态码、错误码、是否可重试、details，并可附带响应头（如 Retry-After）；
      未知路由 404 NOT_FOUND，方法不对 405 METHOD_NOT_ALLOWED，未处理的异常 500 INTERNAL_ERROR（retryable 为 true）且响应体不含异常文本与内部信息。
      三，请求大小：请求体超过 128 KiB 为 413 REQUEST_TOO_LARGE，先按 Content-Length 判断，没有时按实际读到的字节数。
      四，请求体：按契约 8.1 第 7 步，接口声明有没有请求体：没有请求体的接口收到空请求体跳过本步、收到非空请求体 422；有请求体的接口请求体为空或 Content-Type 不是 application/json 为 422（只比较媒体类型、不分大小写，允许带 charset 等参数）；然后分三小步，先解析 JSON（不是合法 JSON——含不是 UTF-8 的字节、带 UTF-8 BOM、Content-Type 的 charset 不是 utf-8、整数位数超过 Python 解析上限——、顶层不是对象、重复的键、带小数点或指数的数、NaN 与 Infinity、含孤立代理项的字符串都 422 INVALID_REQUEST），
      再查请求体模型声明的批量数组长度（各最多 100 个元素，超过 413；字段不是数组时不计数），最后做字段校验 422（未知字段、类型与取值、lines 中重复的 line_ref；类型严格匹配，整数字段不接受字符串与布尔，不做转换）；
      提供请求体模型的基类（禁止未知字段、可声明批量数组）与解析依赖，供之后的接口与幂等执行器取得原始 JSON 解析结果算摘要。
      五，进程日志：每个请求结束时写一行结构化日志（方法、不含查询串的路径、状态码、X-Request-ID、截断到 200 字符的 User-Agent、耗时），不记 Authorization 头、令牌与请求体（契约 7.2、8.1）。
      六，检查顺序：本任务实现契约 8.1 十步里的第 1、2、3、7 步，并在第 3 步与第 7 步之间留出鉴权、scope、其他请求头的位置（下一任务接入），一个请求只报最先遇到的错误。
      本任务不新增任何业务接口；集成测试在测试里给 create_app 返回的应用挂测试专用路由来验证。明确不做：鉴权、授权、安全事件（下一任务）、幂等执行器、命令行、限流。
    status: done
    depends_on:
      - CORE-TASK-004
    acceptance_criteria:
      - 新代码放 app/api 下 allowed_change_paths 所列的文件，在 app/main.py 里挂上中间件与异常处理；healthz 与 readyz 原有返回体不变，只多 X-Request-ID 头
      - 集成测试验证请求 ID：回显合格的 X-Request-ID、没带时生成 req_ 加 ULID、非法时 400 且响应带生成的 ID、healthz 带非法 ID 时照常 200 并带生成的 ID、404 与 405 的回显规则；未知路径带非法请求 ID 或超过 128 KiB 的请求体时得 404（第 1 步先于第 2、3 步）
      - 集成测试验证错误封装：成功体与错误体的形状，未知路由 404、方法不对 405，测试路由抛出未处理异常时 500 且响应体不含异常文本
      - 集成测试验证请求体：非法 JSON、顶层为数组、重复的键、浮点数、NaN、孤立代理项、未知字段、重复 line_ref、整数字段传字符串或布尔、有请求体的接口收到空请求体或非 JSON 的 Content-Type、没有请求体的接口收到非空请求体都为 422，没有请求体的接口收到空请求体正常；超过 128 KiB（有与没有 Content-Length 各一例）与批量数组 101 个元素为 413，100 个可以；lines 不是数组时 422 而不是 413；101 个元素且含未知字段时得 413
      - 测试路由能取得请求体的原始 JSON 解析结果（不补默认值）；业务异常附带的响应头出现在响应里；每个请求写一行进程日志，含请求 ID 与截断后的 User-Agent，不含 Authorization 头与请求体
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/main.py
      - app/api/__init__.py
      - app/api/errors.py
      - app/api/requests.py
      - tests/integration/conftest.py
      - tests/integration/test_api_requests.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-007
    title: 实现鉴权、scope、角色与池授权的依赖及安全事件记录
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.6 的 7.2、8.1 与第 10 节第 3、4 条，在接口层实现鉴权与授权，规则调用 CORE-TASK-004 的纯函数，表用 CORE-TASK-005 的模型，
      请求处理与错误封装用 CORE-TASK-006 的。
      一，鉴权依赖：除 healthz、readyz 外，解析 Authorization 头，按摘要查令牌，并在同一条查询里联查凭据、租户、销售入口与入口绑定的池，截止时间按数据库时间比较；
      令牌不存在、已吊销、已到截止时间、凭据已吊销、租户已停用，与头缺少或格式不对一样，一律 401 UNAUTHORIZED、同一个错误体；每个请求都查库、不缓存；
      成功时给出租户、凭据、销售入口与它绑定的池（入口已停用时视同没有入口）、scope。鉴权与授权查库时数据库不可用为 503 UNAVAILABLE（还没进入幂等，确定未生效，契约 8.3），不是 500。
      二，授权依赖：接口声明要求的 scope，缺少时 403 FORBIDDEN；其他请求头格式（Idempotency-Key 在写接口必带、操作者头）不对为 400；
      接口声明接受的角色（可以按请求体里的动作决定），要求角色却没带操作者头为 400，角色不被接受为 403；池授权按契约 10.4 的三类与顺序返回 403 或 404，
      按对象判定时由接口提供查对象所属池的函数；404 按契约 8.3 用 POOL_NOT_FOUND 或该对象的错误码，对象不存在与属于别的租户时错误码与 message 完全相同。
      三，接入检查顺序：放在 CORE-TASK-006 留出的位置，按契约 8.1 第 4、5、6 步在请求体之前，第 8、9 步在请求体之后；一个请求只报最先遇到的错误。
      四，安全事件：401、403 与跨租户 404 各写一条，按契约 7.2 在返回响应前、业务事务之外另开短事务写入（用处理请求的连接，还没取连接就从池里取一个），
      写入失败只记进程日志，不改变响应；字段与补充说明的内容按契约 7.2（401 的内部原因只记在事件里、不进响应；403 记被拒类别及缺的 scope、被拒的角色或请求的池），两个操作者头都带且都合格时才记操作者；请求路径超过 512 字符时截断到 512 再记；同时有几种 401 原因时，按令牌不存在、令牌已吊销、令牌已到截止时间、凭据已吊销、租户已停用的顺序记第一种；不记 Authorization 头、令牌与请求体，路径不含查询串，User-Agent 截断到 200 字符。
      提供写安全事件的服务函数（可传入已有连接），供之后的幂等执行器、业务引用冲突与命令行复用。
      本任务不新增任何业务接口；集成测试给应用挂测试专用路由来验证。明确不做：幂等执行器（下一任务）、命令行、限流、到期清理。
    status: done
    depends_on:
      - CORE-TASK-005
      - CORE-TASK-006
    acceptance_criteria:
