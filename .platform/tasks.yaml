  - id: CORE-TASK-024
    title: 写库存命令字段取值、期初逐行判定与流水游标的纯函数
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.10 的 6.2 第 5、6 条、6.3 与 6.8，加两个纯函数模块，作为之后接口层与服务层的规则来源。
      只做纯 Python，不 import FastAPI、SQLAlchemy 或做 I/O 的库。
      一，app/domain/stock.py：
      reason_code 校验（字符串，1 到 32 个小写字母、数字或下划线，不去空白）；note 规范化复用 app/domain/catalog.py 的
      normalize_reason（契约 6.2 第 6 条规则同 2.6 的 reason）；occurred_at 解析：字符串，RFC 3339 的日期加 T 加时间，秒必须有，
      小数秒 0 到 6 位，时区必须是 Z 或正负 hh:mm，换算成 UTC 的不带时区 datetime（微秒精度），不合规抛错；分隔的 T 与 Z 只接受大写；
      秒为 00 到 59（不接受闰秒 60）；年份为 1001 到 9998（DATETIME(6) 存 1000 到 9999 年，两头各留一年余量，换算时区不会越界）；
      件数校验：正件数为 1 到 1000000 的整数，非负件数为 0 到 1000000 的整数，布尔一律不算整数；
      sku_ids 查询参数解析：逗号分隔，1 到 100 个，不能有空项、不能重复，不校验 ID 格式；
      流水查询的 from、to 解析同 occurred_at，两个都带而 from 不早于 to 时报错；limit 复用 app/domain/catalog.py 的 parse_limit；
      流水游标：format_ledger_cursor(version, pool_id, sku_id, from_, to) 返回 v1 加点加 balance_version_after 的十进制加点加筛选摘要，
      摘要为 pool_id、sku_id、from、to 规范化后（时间写成 UTC 的 YYYY-MM-DDTHH:MM:SS.ffffffZ，没带为空串）以换行符连接、UTF-8 编码的
      SHA-256 小写十六进制的前 16 个字符；parse_ledger_cursor(value, pool_id, sku_id, from_, to) 返回版本号，
      格式不对（前缀、段数、十进制为 1 到 19 位且首位 1 到 9、不超过 BIGINT 上限、摘要为 16 个小写十六进制字符）或摘要与本次筛选条件不符时抛错。
      二，app/domain/stock_imports.py（照 CORE-TASK-014 的写法）：
      逐行判定 judge_rows(rows, lookup)：rows 为预览正文的 rows 列表，lookup 由服务层提供，按 sku_id 给出本租户里该 SKU 是否存在、
      是否已合并、在该池是否已有有效期初；按契约 6.3 的顺序取第一个命中的结果：invalid_format（不是对象、缺字段、多字段、sku_id 不是字符串、
      quantity 不是 0 到 1000000 的整数）、duplicate_sku（本次导入里别的行也是这个 sku_id，按字符串原样比较，相关各行都算，
      invalid_format 的行不参加）、sku_not_found、sku_merged、already_opened、ok；行与行互不牵连。
      逐行结果的键固定且都出现：index、sku_id（只在是字符串时回显，否则为 null）、quantity（只在是整数时回显，否则为 null）、result。
      汇总 summarize：counts（六种结果的行数，六个键都出现）、executable_rows、executable_quantity（ok 行的件数合计）。
      确认计划 plan_confirm(previews, lookup)：对预览为 ok 的行按当前 lookup 重查后三种情形，给出 created 或 failed（带原因），
      预览不合格的行为 skipped（带预览结果）；确认结果每项的键固定且都出现：index、sku_id、quantity、outcome、entry_id（计划里为 null，
      由服务层落账后填）、preview_result（created 与 failed 的行为 ok，skipped 的行为预览时的结果）、failure（只有 failed 的行有，其余为 null）。
      明确不做：数据库读写、接口、错误码到 HTTP 的映射。
    status: done
    depends_on: []
    acceptance_criteria:
      - 新增 app/domain/stock.py 与 app/domain/stock_imports.py，不 import FastAPI、SQLAlchemy 或做 I/O 的库；单元测试放 tests/unit/test_stock.py 与 tests/unit/test_stock_imports.py，用标准库 unittest
      - 单元测试覆盖字段取值：reason_code 的长度边界、大写、空格、连字符与非字符串被拒；note 与目录 reason 规则一致；occurred_at 接受 Z 与正负偏移并正确换算 UTC，拒绝缺时区、缺秒、7 位小数秒、非法日期与非字符串
      - 单元测试覆盖件数：正件数 1 与 1000000 通过、0 与 1000001 与布尔与字符串被拒；非负件数 0 通过；sku_ids 的 1 个、100 个通过，101 个、空项、重复、空串被拒
      - 单元测试覆盖流水查询：from 不早于 to 被拒；游标往返得到原版本；改了 pool_id、sku_id、from、to 任一项后原游标被拒；前缀不对、段数不对、版本为 0 或有前导零或超过 BIGINT 上限、摘要不是 16 位小写十六进制都被拒
      - 单元测试覆盖逐行判定的六种结果与顺序，包括：重复的各行都记 duplicate_sku；invalid_format 的行不让别的行变成 duplicate_sku；同一行既重复又已合并时记 duplicate_sku；回显规则；汇总的六个键都出现、件数合计只算 ok 行
      - 单元测试覆盖确认计划：预览 ok 而重查时已有有效期初、已合并、已不存在分别为 failed 与对应原因；预览不合格为 skipped 且带预览结果；结果每项键固定
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
    allowed_change_paths:
