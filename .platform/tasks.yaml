      一，app/services/idempotency.py 的 Execution 加一个方法 mark_answered_by_reference()（命令体在按业务引用返回原结果的分支上调）与只读属性 answered_by_reference（默认假）。标记属于这一次命令执行：现在 _execute 用同一个 Execution 调 rejudge，所以在调 rejudge 之前把标记清为假；RedoCommand 重做时新建的 Execution 本来就从假开始。
