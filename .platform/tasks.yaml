  - id: CORE-TASK-023
    title: 写更正、不可售调整与账面核实判定的流水纯函数
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.10 的 4.1（last_book_only_version 与 last_reconciled_version）、4.3、6（COUNT_STALE）、6.5 与 6.7，在 CORE-TASK-001 的
      app/domain/ledger.py 加纯函数，作为之后服务层的唯一规则来源。只做纯 Python，不 import FastAPI、SQLAlchemy 或做 I/O 的库。
      一，EntryType 补上 MERGE_TRANSFER_OUT、MERGE_TRANSFER_IN、CORRECTION 三个值（取值与 app/models/inventory.py 的 ENTRY_TYPES 一致），
      它们不按件数落账，不进 QUANTITY_RULES，apply_entry 对它们照旧报错。
      二，只改账的流水集合 BOOK_ONLY_TYPES：OPENING_BALANCE、COUNT_ADJUSTMENT、CORRECTION、DEMO_RESET、MERGE_TRANSFER_OUT、MERGE_TRANSFER_IN。
      函数 last_book_only_version_after(entry_type, current, version_after)：只改账的流水返回 version_after，其他类型返回 current 不变；
      定数类流水集合 RECONCILING_TYPES 为 BOOK_ONLY_TYPES 去掉 CORRECTION；函数 last_reconciled_version_after(entry_type, current, version_after)：
      定数类流水返回 version_after，其他类型（含 CORRECTION）返回 current 不变（契约 0.10：更正不核实账面）；
      函数 is_stale(last_book_only_version, snapshot_version)：前者大于后者为真（契约 6 的 COUNT_STALE 与 2.4 执行前置检查）。
      合并执行与 Demo 重置差额为 0 时把两个判定列都设为当时的 balance_version；盘点确认的 last_reconciled_version 取快照版本而不是这条流水的版本
      （契约 0.10 的 4.1 例外）；这些由服务层传入覆盖值，本任务的函数只给默认规则，不另写函数。
      三，不可售调整：AdjustmentAction 取 mark_unavailable、restore_available、write_off，对应 MARK_UNAVAILABLE、RESTORE_AVAILABLE、
      WRITE_OFF；adjustment_limit(action, current) 返回这一行当前最多能做的件数（标不可售为 available，恢复与报损为 unavailable）；
      apply_adjustment(action, current, q) 在 q 超过上限时抛 AdjustmentExceedsLimit，带错误码（标不可售为 INSUFFICIENT_STOCK，
      恢复与报损为 QUANTITY_EXCEEDS_UNAVAILABLE）与上限，否则返回 apply_entry 的结果。q 不是正整数时照 apply_entry 抛 InvalidQuantity。
      AdjustmentExceedsLimit 继承 ValueError、不继承 InvariantViolation（它是命令事先的上限检查，不是落账后违反不变量）；
      CorrectionBreaksInvariants 照 CountBelowCommitments 继承 InvariantViolation。
      四，更正：CORRECTABLE_TYPES 为 OPENING_BALANCE、RECEIPT、MARK_UNAVAILABLE、RESTORE_AVAILABLE、WRITE_OFF；
      correction_blocker(entry_type, entry_version, last_reconciled_version, pool_live) 按契约 6.7 第 1、2 步的顺序返回 None 或原因
      entry_type、pool_live（原流水是 OPENING_BALANCE 且池已 live）、superseded（判定列大于 entry_version；或等于 entry_version
      且原流水不是 OPENING_BALANCE）；apply_correction(current, deltas) 把四个量各减去原流水的增量（deltas 为 stock_balance、reserved、unavailable、paid_pending_dispatch
      四个增量组成的整数元组，可为负；不用 Quantities，它不接受负数），
      落账后违反不变量时抛 CorrectionBreaksInvariants，带落账后的四个量与缺口数（公式同 CountBelowCommitments）。
      能更正的五种流水都不动 reserved 与 paid_pending_dispatch，所以这两个增量不为 0 的 deltas 直接抛 ValueError（程序错误），缺口公式因此不需要考虑这两个量为负。
      明确不做：数据库读写、opening_entry_id 的维护（服务层做）、合并迁移的落账规则。
    status: done
    depends_on: []
    acceptance_criteria:
      - 改动在 app/domain/ledger.py 与 tests/unit/test_ledger.py；模块不 import FastAPI、SQLAlchemy 或做 I/O 的库；已有的单元测试照常通过
      - 单元测试覆盖 EntryType 与 app/models/inventory.py 的 ENTRY_TYPES 取值完全一致（读模块常量比较，不连数据库也能跑；若 import 模型模块会拉进 SQLAlchemy，则改为在测试里逐字列出十八个值比较）
      - 单元测试覆盖判定列：六种只改账的流水返回 version_after、其余十二种返回原值；last_reconciled_version_after 对五种定数类流水返回 version_after、对 CORRECTION 与其余十二种返回原值；is_stale 在大于时为真、等于与小于时为假
      - 单元测试覆盖不可售调整：三种动作的上限、恰好等于上限通过、超过一件抛出带正确错误码与上限的异常、报损同时减 stock_balance 与 unavailable、q 为 0、负数、布尔或非整数时抛 InvalidQuantity
      - 单元测试覆盖更正的类型与顺序：不可更正的十三种类型返回 entry_type；期初在池已 live 时返回 pool_live，未 live 时不拦；判定列大于原版本返回 superseded；等于原版本时非期初返回 superseded、期初返回 None；类型不可更正同时又被吸收时先报 entry_type
      - 单元测试用版本号模拟契约 6.7 与审查提出的边界场景：两次收货 R1（版本 1）、R2（版本 2）后差额为 0 的盘点把判定列设为 2，更正 R1 与 R2 都得 superseded；初始化期 期初 E1（版本 1）、更正 C1（版本 2）、重导 E2（版本 3）后再更正 E2 不被拦；合并迁移（版本更大的定数类流水）之后更正较早的收货得 superseded；R1、R2 两笔收货都录错，更正 R2（CORRECTION 版本 3，last_reconciled_version 不变）之后更正 R1 不被拦，而 last_book_only_version 变为 3；标不可售（版本 1）与恢复（版本 2）录反了，先后更正两笔都不被拦；快照与差额为 0 的核实之间有、没有别的流水两种情况，is_stale 分别为真与假
      - 单元测试覆盖 apply_correction：反向后合法时返回新账面；收货后已被预留用掉而反向使 reserved 超过 stock_balance 时抛 CorrectionBreaksInvariants，缺口数与落账后四个量正确
