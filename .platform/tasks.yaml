# 控制契约 —— 可调度任务的 allowlist
#
# 默认 deny。未在 tasks 里列出的任务 id 一律拒绝，不做前缀匹配、不做模糊匹配，
# 也不因为「格式看起来像本项目的编号」就放行 —— 格式合法只是进入校验的门槛，不是授权。
#
# 这份文件说「怎么做、能碰什么」；「做什么、先做什么」在 docs/TODO.md 的 planning-v1 块里。
# 两边必须一致：每个 ready 任务都要出现在计划块里，计划块「当前计划」里的每一项都要在这里登记为 ready，
# 否则整个项目 fail closed（自检与 Worker 用同一个解析器）。
#
# ⚠️ Worker 的 run 改不了 .platform/：run 自己的 PR 不能改这份文件。任务完成后，启用了自动收尾的项目
#    （控制面登记表 auto_closeout: true，且 Worker 本机 merge_enabled 为真）由 OpenClaw 自动开收尾 PR，把 ready 改成 done、从 planning-v1 块的
#    「当前计划」移出，CI 通过后自动合并、不触发部署；未启用或自动收尾失败时，由运营者手工开同样的收尾 PR。

# 必须是整数 1。
schema_version: 1
# 与 .platform/project.yaml 的 project_id 相同。
project_id: stock_core
# 必须是 deny。
default: deny

# 每个任务的字段（标 * 的由 Worker 机器校验，不合规则整个任务加载失败）：
#   id *                   符合控制面登记的 task_id_pattern（例如 ^<PREFIX>-TASK-[0-9]{3}$），全文件唯一
#   title *                一句中文说明，单行，80 字符内；不用反引号、尖括号、「」『』【】〖〗、emoji、链接、路径
#                          （OpenClaw 推荐行显示它；超长、反引号、尖括号、上述括号、不可见字符、泄漏形状会被控制面
#                          拒绝而不显示，其余是填写约定）
#   purpose *              为什么做、做到什么程度、明确不碰什么
#   status *               ready = 已登记、可以在 Telegram 发「开启」；done = 已交付（合并并部署）；
#                          blocked / superseded / cancelled = 不可开始（superseded 写明原因）。Worker 只接受 ready
#   depends_on *           前置任务 id 列表；「当前计划」第一项的依赖必须全部为 done
#   acceptance_criteria *  非空列表，每条一句可验证的标准
#   allowed_change_paths * 本 run 允许改动的文件：仓库根相对的 POSIX 路径，**逐个精确匹配**，不是 glob、不是目录前缀；
#                          不能是 .platform/ 下、.git、凭据形状的文件名（.env、*.pem、含 secret/token/key 的名字等）
#   allowed_commands *     非空列表，只能引用 .platform/commands.yaml 里已有的 id；不写只在 CI 跑的检查
#                          （测试客户端 / asyncio 的 pytest、node 检查），它们由 PR 的必需 CI 检查执行
#   creates_branch *       必须是 true
#   creates_pull_request * 必须是 true（Worker 以 Draft PR 交付，不合并、不直推）
#   acceptance             可选，浏览器验收（见文件末尾注释与 CLAUDE.md 的「登记约定」）
#
# ⚠️ title / purpose / acceptance_criteria / allowed_change_paths / allowed_commands 会原样进 PR 正文并过泄漏规则：
#    不写任何 xxx:// 形式的地址、主机名、邮箱地址、IP、绝对路径。被拒的文本会让 run 以 pr_policy_failed 结束。
#
# 例（取消注释并按项目实际改写）：
#   - id: <PREFIX>-TASK-001
#     title: <一句中文说明，80 字符内>
#     purpose: >-
#       <为什么做；做到什么程度；明确不碰什么>
#     status: ready
#     depends_on: []
#     acceptance_criteria:
#       - <一条可验证的标准>
#       - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖
#       - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
#       - <依赖只在 CI 跑的测试时：「测试由 PR 的必需 CI 检查 <job 名> 执行并通过」>
#     allowed_change_paths:
#       - <path/to/file>
#     allowed_commands:
#       - <沙箱里跑得动的 command.id，例如 lint.check；不写只在 CI 跑的检查>
#     creates_branch: true
#     creates_pull_request: true
#
# 浏览器验收块（只有有用户可见页面的前端任务才带；需要 project.yaml 的 acceptance_hosts
# 与 commands.yaml 里一条 network: true 的验收命令，而且那条命令**不能**同时写在 allowed_commands 里）：
#     acceptance:
#       kind: browser
#       command: <acceptance.command.id>
#       writes: false
#       steps:
#         - <lowercase_step_name>
#       timeout_seconds: 300
tasks:
  - id: CORE-TASK-001
    title: 实现库存账面量不变量与流水类型的纯领域层
    purpose: >-
      按已批准契约 docs/CONTRACT_V1.md 的 4.1、4.3 与 6.1，把四个账面量（stock_balance、reserved、unavailable、
      paid_pending_dispatch）、派生的可售量、不变量和每种流水类型对四个量的增减规则写成纯函数，作为之后数据库层与接口层的唯一规则来源。
      只做 app/domain 下的纯 Python：不 import FastAPI、SQLAlchemy 或任何做 I/O 的库，不建表、不加接口。
      SKU 合并的迁移流水与 CORRECTION 的依赖检查不在本任务（之后随合并与更正任务做）。
    status: done
    depends_on: []
    acceptance_criteria:
      - 账面量是不可变值对象；可售量按契约 4.1 由 stock_balance 减 reserved 减 unavailable 派生，不作为可写字段
      - 不变量按契约 4.1 校验：四个量为非负整数，且 reserved 加 unavailable 不超过 stock_balance；违反时抛出同一个明确的领域异常，不返回半改的结果；标不可售超过可售、恢复或报损超过不可售量、释放超过预留等超量操作都归到这个异常
      - 契约 4.3 表中除 MERGE_TRANSFER、CORRECTION、COUNT_ADJUSTMENT 外的每种流水类型都有对应规则，给定正整数 q 返回新的账面量；q 不是正整数（含 0、负数、布尔、非整数）时抛出单独的数量无效异常
      - COUNT_ADJUSTMENT 按契约第 6 节的差额法：由提交时快照与两项实数算出差额，加到最新账面；两项实数须为非负整数，否则抛数量无效异常；违反不变量时抛出领域异常，带落账后的四个量与 6 节的缺口数（任一量为负时缺口也大于 0）；DEMO_RESET 按 6.1 计算，target 为负时拒绝，增量可为 0
      - 单元测试逐条复算契约 11.3 与 11.5 两张示例表的每一步结果；每种会减少某个量的流水类型都测超量拒绝（例如释放超过预留、发货超过待发货量），只增不减的类型测无效数量拒绝
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - PR 的必需 CI 检查 unit 与 integration 通过
    allowed_change_paths:
      - app/domain/quantities.py
      - app/domain/ledger.py
      - tests/unit/test_quantities.py
      - tests/unit/test_ledger.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-002
    title: 建立商品目录的数据库表与首个迁移
    purpose: >-
      按已批准契约 docs/CONTRACT_V1.md 的第 1 节与 2.1、2.2，建立租户、商品、规格 SKU 与 SKU 编码历史四张表的 SQLAlchemy 模型和首个
      Alembic 迁移，另加 2.2 的编码归属表 sku_code_claims，共五张表，为之后的目录接口打底。按契约 0.3（第 14 节）：稳定 ID 是
      类型前缀加 ULID 的字符串，列宽 32；主键为单列 ID，业务唯一约束都含 tenant_id，表间引用用 tenant_id 加 ID 的复合外键；
      租户内 sku_code 唯一，条码空值存 NULL、拒绝空串、非空唯一；编码归属表主键为 tenant_id 加 code、复合外键指向 SKU（SKU 不反向外键），历史表只追加、主键为自增 BIGINT；参考价只在 SKU 上，
      整数最小货币单位加三位币种，可空但两者同有同无；商品与 SKU 带 version 与 active 或 inactive 状态；merged_into_sku_id 不能指向自身，
      非空时 SKU 必须 inactive；列类型、排序规则、时间戳与状态列按 2.2 的数据库列约定，另定：租户表只有 tenant_id、name VARCHAR(200)、status、created_at、updated_at，status 取 active 或 inactive；
      参考价金额列为 BIGINT；表默认字符集 utf8mb4、排序规则 utf8mb4_0900_ai_ci，ID 类列与 status 列用 utf8mb4_bin 精确比较（大小写不同的状态值被检查约束拒绝）；
      历史表的旧编码与新编码列沿用编码列的类型、排序规则与首尾空格检查，但不设唯一；只追加的历史表与归属表只有 created_at、没有 updated_at；
      其余表的 created_at 与 updated_at 在插入时都用数据库默认 CURRENT_TIMESTAMP(6)，之后 updated_at 由应用在修改时写入。只做数据库层：不加接口、不写业务服务、不碰库存账表（另一个任务）。
    status: done
    depends_on: []
    acceptance_criteria:
      - 模型放在新文件 app/models/catalog.py，并在 alembic/env.py 里 import 登记；迁移文件放 alembic/versions，upgrade 与 downgrade 都写全；不含任何顾客个人资料字段
      - 唯一约束、复合外键与检查约束按 purpose 所列在数据库层生效（含 version 不小于 1、参考价不为负）；约束名遵循 app/db.py 的命名约定
      - 集成测试在真 MySQL 上验证：同租户重复 sku_code 被拒、不同租户可用相同 sku_code、两个相同非空 barcode 被拒而多个 NULL 可并存、空串条码被拒、编码只差大小写被视为重复、合并指向别的租户或自身被拒、已合并却 active 被拒
      - 需要表结构的集成测试经 tests/integration/conftest.py 的共享夹具在开始时升级到 head、结束时降到 base，CI 之后的迁移往返照常从空库开始
      - CI 的迁移往返（upgrade、downgrade 到底、再 upgrade）与 alembic check 通过
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖
      - allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试与迁移检查由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/models/__init__.py
      - app/models/catalog.py
      - alembic/env.py
      - alembic/versions/20261111_0001_catalog.py
      - tests/integration/conftest.py
      - tests/integration/test_catalog_schema.py
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-003
    title: 建立地点、库存池、销售入口、余额、流水与幂等记录的数据库表
    purpose: >-
      按已批准契约 docs/CONTRACT_V1.md 的第 1 节、第 3 节、4.1、4.3、7.1 与第 10 节第 1 条，建立库存侧六张表的 SQLAlchemy 模型和第二个
      Alembic 迁移，为之后的幂等中间件与库存命令打底。沿用 2.2 的数据库列约定与 CORE-TASK-002 的写法：稳定 ID 为类型前缀加 ULID、
      VARCHAR(32)、utf8mb4_bin；主键都是单列稳定 ID（第 10 节第 1 条，六张表无例外）；各表 tenant_id 都非空并外键到 tenants；业务唯一约束都含 tenant_id；表间引用用 tenant_id 加 ID 的复合外键，被引用的表另设 tenant_id 加 ID 的唯一约束作引用目标（同目录表）；状态列 VARCHAR(16) 加检查约束，不用 ENUM；
      时间列 DATETIME(6)，created_at 默认 CURRENT_TIMESTAMP(6)，updated_at 插入时同默认、之后由应用写入；只追加的表没有 updated_at。
      六张表：一，locations（前缀 loc_）：location_id 主键、tenant_id、name VARCHAR(200)、status 取 active 或 inactive。
      二，stock_pools（前缀 pool_）：pool_id 主键、tenant_id、location_id 复合外键指向同租户地点、name VARCHAR(200)、status 取 initializing 或 live（第 6 节期初只在 initializing 可用）。
      三，sales_channels（前缀 chn_）：channel_id 主键、tenant_id、pool_id 复合外键指向同租户的池、name VARCHAR(200)、status 取 active 或 inactive；
      按第 3 节一个池只允许一个销售入口，以 tenant_id 加 pool_id 唯一约束在数据库层兜底（将来启用共卖时另行迁移放开）。
      四，stock_balances（前缀 bal_）：balance_id 主键；每个 tenant、pool、sku 一行，以 tenant_id、pool_id、sku_id 三列唯一约束保证（多 SKU 命令按 pool_id、sku_id 升序锁行）；
      pool 与 sku 各用复合外键指向同租户的池与 SKU；四个账面量为 BIGINT、默认 0，检查约束要求各自不小于 0 且 reserved 加 unavailable 不超过 stock_balance；
      不设 available 列（4.1 派生量）；balance_version 为 BIGINT、默认 0、不小于 0，由应用在每写一条流水时加 1（4.1 的每次变化即每条流水；一个命令对同一行写多条流水时逐条加）。
      五，ledger_entries（前缀 led_）：只追加；entry_id 主键；
      tenant_id、pool_id、sku_id 以复合外键指向 stock_balances 那三列的唯一约束；entry_type VARCHAR(32) utf8mb4_bin，检查约束限定为 4.3 表的十八种
      （含 MERGE_TRANSFER_OUT、MERGE_TRANSFER_IN、DEMO_RESET、CORRECTION）；四个量各一列增量（BIGINT，可正可负）与一列变动后值（BIGINT），
      变动后值的检查约束与余额表相同；balance_version_after 为 BIGINT 不小于 1，即写这条流水后余额行的 balance_version；channel_id 可空，非空时复合外键指向同租户的销售入口；
      source_type VARCHAR(32) 与 source_ref VARCHAR(128) 同空同有，line_ref VARCHAR(128) 可空；command_id VARCHAR(32) 非空（前缀 cmd_，同一命令写的各条流水相同，建索引）；
      idempotency_key VARCHAR(128) 可空（Core 自己的到期关闭没有请求）；credential_id VARCHAR(32) 可空，actor_ref VARCHAR(128) 可空，actor_role VARCHAR(32) 可空；
      reason_code VARCHAR(32) 可空，note VARCHAR(500) 可空，request_id VARCHAR(128) 可空；corrects_entry_id 可空，非空时复合外键指向同租户的另一条流水，
      检查约束要求 entry_type 为 CORRECTION 时它非空、否则为空，且不等于自身 entry_id；occurred_at 非空，recorded_at 默认 CURRENT_TIMESTAMP(6)；
      以 tenant_id、pool_id、sku_id、balance_version_after 四列唯一，同一余额行的流水按 balance_version_after 排序（不按 recorded_at 或 entry_id，同一命令的多条流水时间相同）。
      六，idempotency_records（前缀 idem_）：只追加；idempotency_record_id 主键；按 7.1 作用域以 tenant_id、credential_id、operation、idempotency_key 四列唯一；
      credential_id VARCHAR(32)、operation VARCHAR(64)、idempotency_key VARCHAR(128)、request_hash CHAR(64)（规范化请求摘要 SHA-256 的小写十六进制）、response_status SMALLINT、response_body JSON 都非空；
      response_status 的检查约束限定 200 到 499 且不为 429（7.1 与 8.3：5xx、限流与处理中都不作为确定结果保存）；request_id VARCHAR(128) 可空；created_at。
      超过 64 字符的约束名照 CORE-TASK-002 先例由命名约定生成，迁移里用 op.f 引用，不手写。
      调用方引用、幂等键、操作人、凭据 ID、原因代码都用 utf8mb4_bin 精确比较，格式由接口层按第 1 节与 7.1 校验，数据库不另加格式约束。
      明确不做：服务凭据表与鉴权（下一任务，届时再给 credential_id 加外键）；业务引用唯一（随各自的预留、收货、盘点等事实表做）；
      预留、订单行累计、盘点单、outbox 与目录变更流的表；流水禁改禁删的触发器或权限；DEMO_RESET 在生产库被数据库拒绝的防护（6.1，随 Demo 重置任务做）。
      只做数据库层：不加接口、不写业务服务、不改领域层与目录表。
    status: done
    depends_on:
      - CORE-TASK-002
    acceptance_criteria:
      - 模型放在新文件 app/models/inventory.py，并在 alembic/env.py 里 import 登记；迁移文件放 alembic/versions，revision 接在 0001 之后，upgrade 与 downgrade 都写全；不含任何顾客个人资料字段
      - 主键、唯一约束、复合外键、检查约束与索引按 purpose 所列在数据库层生效；约束名遵循 app/db.py 的命名约定
      - 集成测试在真 MySQL 上验证地点、池与入口：池指向别的租户的地点被拒、同一个池登记第二个销售入口被拒、池状态取 initializing 与 live 以外的值（含只差大小写）被拒
      - 集成测试在真 MySQL 上验证余额：同一 tenant、pool、sku 第二行被拒，任一账面量为负被拒，reserved 加 unavailable 超过 stock_balance 被拒，指向别的租户的 SKU 被拒
      - 集成测试在真 MySQL 上验证流水与幂等记录：未知 entry_type 被拒、变动后值违反不变量被拒、CORRECTION 不带被更正流水或非 CORRECTION 带了都被拒、同一余额行两条流水的 balance_version_after 相同被拒、source_type 与 source_ref 一空一有被拒；同一 tenant、credential、operation、键的第二条幂等记录被拒而换 operation 可以，response_status 为 500 或 429 被拒
      - CI 的迁移往返（upgrade、downgrade 到底、再 upgrade）与 alembic check 通过；集成测试经 tests/integration/conftest.py 的 migrated_engine 夹具升降迁移；两个 schema 测试共用的连接夹具与辅助函数可以移进 conftest
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试与迁移检查由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/models/__init__.py
      - app/models/inventory.py
      - alembic/env.py
      - alembic/versions/20261111_0002_inventory.py
      - tests/integration/conftest.py
      - tests/integration/test_catalog_schema.py
      - tests/integration/test_inventory_schema.py
    allowed_commands:
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-004
    title: 实现请求头、幂等摘要与令牌的纯规则及稳定 ID 生成
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.6 的第 1 节、7.1、8.1 与第 10 节第 1、3、4 条，把鉴权与幂等里不碰数据库、不碰框架的规则写成纯函数，
      作为之后凭据表、鉴权与幂等执行器的唯一规则来源。只做 app/domain 下的纯 Python，只用标准库，不 import FastAPI、SQLAlchemy 或任何做 I/O 的库。
      一，稳定 ID：类型前缀加下划线加 26 个字符的 ULID（Crockford Base32，大写；前 10 个字符是毫秒时间戳，后 16 个是随机数），
      生成函数可注入时间与随机字节以便测试；前缀只接受小写字母，总长不超过 32。
      二，请求头：Idempotency-Key 为 1 到 128 个 0x21 到 0x7E 的字符；X-Request-ID 与 X-Actor-Ref 为 1 到 128 个字母、数字或点、下划线、冒号、连字符；
      X-Actor-Role 只接受 stock_operator、stock_admin、catalog_admin，区分大小写；两个操作者头要么都有要么都没有；User-Agent 截断到 200 字符。
      不合格时抛出同一个带头名的格式异常，不猜、不去空格。
      三，令牌：csk_ 加 32 字节的 base64url 编码（不补等号，43 个字符）；摘要是令牌全文 UTF-8 的 SHA-256 小写十六进制；
      解析 Authorization 头：方案名 Bearer 不区分大小写，与令牌之间正好一个空格，令牌须符合上述格式，否则视为认不出（返回空，不抛出）；
      令牌可用的判断：未吊销、所属凭据为 active、所属租户为 active、没有截止时间或当前时间早于截止时间（到点即失效），当前时间由调用方传入。
      四，scope：契约 10.4 的八个 scope 常量；判断授予的 scope 是否覆盖接口要求的全部 scope（合并接口要求两个）；
      签发时的 scope 校验：非空、无重复、都是已知值，含 ops.read 时不能有别的 scope、凭据也不能带销售入口。
      五，池授权：给定凭据销售入口绑定的池（可空）、请求的池、该池是否属于本租户，按契约 10.4 的顺序判定：没有销售入口 403，池不属于本租户 404，
      属于本租户但不是获准的池 403，否则允许；销售类命令不带池，只判有没有销售入口；按对象判定时，请求的池就是对象所属的池、属于本租户即对象属于本租户。
      六，幂等：规范化请求摘要按 7.1（路径参数与请求体放进 path 与 body 两个键，没有请求体时 body 为 null；只有 body 顶层名为 lines 且元素都是带字符串 line_ref 的对象的数组按 line_ref 排序，
      line_ref 相同时按元素的规范化 JSON 排序以保证确定，更深层与其他数组保持原序；键名排序、无空白、非 ASCII 原样、UTF-8 后取 SHA-256 小写十六进制；
      输入里出现浮点数、NaN、Infinity 或含孤立代理项的字符串时抛出异常，不算摘要，这些输入本应在请求体校验时被 422 拒绝）；
      命名锁的锁名是数据库名与 tenant_id、credential_id、操作类型、幂等键五项以换行符连接后 UTF-8 的 SHA-256 小写十六进制，64 个字符；
      已有记录与本次摘要的比较返回执行、重放或冲突三种决定；结果是否作为确定结果保存：200 到 499，但 429 与错误码为 REQUEST_IN_PROGRESS 或 IDEMPOTENCY_CONFLICT 的 409 除外。
      明确不做：建表、HTTP 接口、中间件、命令行、读写数据库。
    status: done
    depends_on: []
    acceptance_criteria:
      - 规则分放 app/domain/ids.py、app/domain/requests.py、app/domain/service_auth.py、app/domain/idempotency.py，单元测试放对应的 tests/unit 文件，用标准库 unittest
      - 稳定 ID 测试覆盖：长度与字符集、注入固定时间与随机字节时结果确定、时间戳在前所以较晚生成的 ID 按字符串排序更大、非法前缀被拒
      - 请求头测试覆盖每个头的边界：长度 0、1、128、129，越界字符（含空格、制表符、非 ASCII），角色只差大小写被拒，只带一个操作者头被拒，User-Agent 恰好 200 与 201 字符
      - 令牌测试覆盖：生成的令牌符合格式、摘要与已知向量一致、Authorization 头的方案名大小写、多空格、缺令牌、格式不对都返回认不出；截止时间恰好等于当前时间时不可用
      - scope 与池授权测试覆盖：合并要求两个 scope 缺一不可、未知 scope 与重复 scope 被拒、ops.read 与别的 scope 同时出现或带销售入口被拒；池授权每个判定分支各有用例，没有销售入口且池属于别的租户时得 403 而不是 404
      - 幂等测试覆盖：请求体键序不同、顶层 lines 顺序不同时摘要相同，路径参数不同、更深层或 lines 以外的数组顺序不同、多一个值为 null 的键时摘要不同，没有请求体与空对象的摘要不同，浮点数与孤立代理项被拒；锁名为 64 个小写十六进制字符且任一项不同时不同；三种决定各有用例；保存判断对 200、404、422、409 业务错误、409 处理中、409 幂等冲突、429、500 的结果正确
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - PR 的必需 CI 检查 unit 与 integration 通过
    allowed_change_paths:
