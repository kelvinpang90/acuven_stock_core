      - 集成测试在真 MySQL 上验证鉴权：缺头、方案名错、令牌格式不对、令牌不存在、令牌已吊销、令牌已到截止时间、凭据已吊销、租户已停用都得同样的 401 错误体；同一凭据的两个令牌在轮换重叠期内都能通过，旧令牌到截止时间后 401
      - 集成测试验证授权：缺 scope 为 403；合并类接口缺两个 scope 之一为 403；写接口缺 Idempotency-Key 为 400；要求角色的接口缺操作者头为 400、角色不被接受为 403、按请求体动作定角色时同一接口两种动作结果不同；池授权按 pool_id 与按对象两类的每个分支，入口已停用时 403；第二租户的凭据看不到第一租户的池与对象，得 404
      - 集成测试验证数据库不可用时鉴权得 503 UNAVAILABLE（例如让测试应用连一个连不上的库）；验证检查顺序：鉴权失败且请求体非法得 401、缺 scope 且池属于别的租户得 403、请求体非法且角色不被接受得 422、未鉴权的大请求得 413
      - 集成测试验证安全事件：401、403、跨租户 404 各写一条，字段与补充说明按契约 7.2（每种 401 原因记对、响应体不含原因），只带一个操作者头时不记操作者，不含令牌与请求体；不存在与跨租户的 404 响应完全相同；业务事务回滚时安全事件仍在；让安全事件写入失败时响应不变
