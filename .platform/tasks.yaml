  - id: CORE-TASK-085
    title: 带业务引用的命令在按引用返回原结果时打标记，供平台事件执行器区分新生效
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 5.10 第 4 步（事件落后于阶段时带业务引用的动作）与第 14 节的漏项（工作包 P2c′）。HTTP 执行器不读这个标记，/v1 行为不变。
