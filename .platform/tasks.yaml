  - id: CORE-TASK-035
    title: 实现 Demo 专用的每日重置命令
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.11 的 6.1（重置命令）、6.2、7.1、8.1 与 10 第 3、4 条，新建 app/api/demo_resets.py 与 app/services/demo_resets.py，
      只在 CORE_ENV 为 demo 时在 app/main.py 挂路由（为 production 时不挂，路径按 8.1 第 1 步得 404 NOT_FOUND，不鉴权）。
      数量规则用 CORE-TASK-001 的 apply_demo_reset；锁池、SKU 两步检查、锁余额行、写流水与 mark_verified 用 CORE-TASK-026 的 app/services/stock.py；
      经 CORE-TASK-025 的执行器（balance_rows 取正文 pool_id 与各 sku_id）。
      一，纯函数：在 app/domain/stock.py 加 parse_business_date(value)，只接受 YYYY-MM-DD 形式（数字为 ASCII，月日两位）的合法日历日期字符串，
      年份 1000 到 9999（MySQL DATE 的范围），返回 date，否则抛 ValueError；不与当前日期比较。单元测试放 tests/unit/test_stock.py。
      二，接口 POST /v1/demo/resets（操作类型 demo_resets.create）：scope demo.reset，不要求角色（操作者头带了照常校验并记录）；
      正文只有 pool_id、business_date、skus（1 到 100 个，批量数组，超过 413；每项只有 sku_id 与 target，target 为 0 到 1000000 的 JSON 整数）；
      未知字段、business_date 不合格、sku_id 重复都 422。池授权按正文 pool_id。
      三，命令（契约 6.1 的九步）：用普通读按 (tenant_id, pool_id, business_date) 查 demo_resets，有则摘要相同返回 200 与 result，
      不同则 409 BUSINESS_REF_CONFLICT 并记 business_ref_conflict 事件，事件与错误的 details 为 ref_type demo_reset、ref 为 business_date、pool_id；
      然后 require_live、require_skus_exist、按升序锁余额行、require_not_merged；逐 SKU 用 apply_demo_reset 算新账面，增量不为 0 时 append_entry 写 DEMO_RESET
      （四个增量为 delta、0、0、0；source_type demo_reset，source_ref 为 reset_id，无 line_ref，reason_code 与 note 为空，occurred_at 为命令时间），
      增量为 0 时调 mark_verified；最后写 demo_resets 一行（reset_id 前缀 drs_，由命令先生成；channel_id 取凭据的销售入口）。
      业务引用的并发照 with_document 的做法在本模块实现：命令的业务 4xx 与写 demo_resets 撞唯一约束都改抛 BusinessRefTaken，
      重新判定时重新查 demo_resets，有则按上面回答，没有则再运行一次命令，这一次的结果为确定结果。
      返回 201 与重置的表示：reset_id、pool_id、business_date、created_at、skus 按请求顺序，每项 sku_id、target、delta、entry_id（delta 为 0 时为 null）、
      写后的四个量、available 与 balance_version；result 存的就是这个 data。
      明确不做：重置的查询接口（契约 6.1：结果未知时原内容重报取回）、网店侧的调用与定时；不改迁移与启动核对。
