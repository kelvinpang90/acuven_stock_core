  - id: CORE-TASK-084
    title: 平台商品的挂上、改挂与解除命令，有生效平台商品的 SKU 不能停用与合并
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 2.9（Q-90）、2.6 第 5 条与 2.8 的 0.22 说明、2.5 的三种 listing 事件、8.3 的 0.22 错误码（工作包 P2c）。命令只给后台用，后台的执行器与接口是第 3 组的任务；本任务只写命令体，测试经 CORE-TASK-074 的执行器核心调用。
      一，新服务模块 app/services/listings.py：三个命令体 link_listing、relink_listing、unlink_listing（收 Execution 与已校验的正文），以及给执行器用的两个钩子：balance_rows 回调工厂 listing_balance_rows(tenant_id, operation, body) 返回执行器要的 BalanceRows（收连接、返回 (pool_id, sku_id) 的可迭代对象；普通读，由入口得出它绑定的池，由平台商品得出原 SKU，加上正文的目标 SKU，返回要预建的余额行；入口、平台商品或 SKU 找不到时少返回那几行，由事务里判），与 before_transaction 钩子工厂 prepare_listing_rows(tenant_id, operation, body)（返回只收连接的 BeforeTransaction）：在目录写锁与余额行预建之后、开事务之前，照契约 2.9 用短事务按 (pool_id, sku_id) 与 (channel_id, sku_id) 升序预建原 SKU（改挂、解除）与目标 SKU（挂上、改挂）在这个入口上的 pool_allocations 与 channel_allocations 行（INSERT … ON DUPLICATE KEY UPDATE 不改值，同现有余额行预建）；入口不存在、不属于这个租户、不是 platform 入口（不论 active 与否：停用的平台入口上也要能解除，解除要锁到它的配额行），或平台商品、SKU 不存在时跳过预建，由事务里判（不给 api、backoffice 入口建配额行）。
      事务里的锁与判定按契约 2.9 的先后（锁 channel_allocations 行按 sku_id 升序 FOR UPDATE → sku_listings 行 FOR UPDATE → 目标 SKU 与所属商品 FOR SHARE），判定顺序：挂上先判正文的入口（不存在或别的租户 404，不是 platform 或不是 active 422 INVALID_REQUEST）；改挂与解除的正文没有入口，先判平台商品不存在或别的租户 404 LISTING_NOT_FOUND，入口取平台商品的；改挂另要求它的入口是 active（否则 422），解除不看入口状态（停用了的平台入口上的平台商品也要能解除，否则 SKU 永远停用不了）→ 版本不符 409（改挂、解除）→ 行是 inactive 409 STATE_CONFLICT（改挂、解除）→ 改挂到它现在的 SKU 200 不改 → 目标 SKU 的 404、SKU_MERGED、SKU_INACTIVE（挂上、改挂）→ SKU_MERGE_IN_PROGRESS（挂上、改挂）→ LISTING_SKU_TAKEN（挂上、改挂）→ LISTING_HAS_QUOTA（改挂、解除）。其余照契约 2.9；挂上没有平台商品不存在与版本两项，在入口之后先判这个平台规格已有 active 的行 409 LISTING_ALREADY_LINKED；改挂与解除对 inactive 的行 409 STATE_CONFLICT（details 带 status）；改挂到它现在的 SKU 时 200 返回当前表示、不加版本、不写记录（同目录“已是目标状态”的做法）。目标 SKU 属于一张未结束的合并单（作来源或规范）时，挂上与改挂 409 SKU_MERGE_IN_PROGRESS（details 同 sku_merges 的写法），判在 SKU 已合并、停用之后：合并只在新建时查平台商品（契约 2.8），不挡这一步，执行完会留下挂着生效平台商品的已合并 SKU（契约没写，据 2.8 补的，PR 里写明）。LISTING_HAS_QUOTA 只对改挂与解除，读的是锁住之后原 SKU 在这个入口上的配额。写 sku_listings（新行用 new_id 的 lst 前缀，version 1；改动版本加一；操作主体列取上下文）与 catalog_changes（changes 只列变了的字段；重新启用 inactive 的行记 listing_linked，status 由 inactive 改为 active，sku_id 变了也列；object_type 为 listing、event_type 为 listing_linked、listing_relinked、listing_unlinked，product_id 为改动后所映射 SKU 的商品，version 为平台商品行的新版本，changes 记 sku_id 与 status 的前后值，reason 取正文，其余列照现有目录变更记录的写法），与幂等记录同一事务。成功返回平台商品的表示（listing_id、channel_id、platform_item_id、platform_model_id、sku_id、status、version、created_at、updated_at），挂上新建 201、其余 200。
      入口、平台商品或目标 SKU 属于别的租户时，照现有目录命令记 cross_tenant 安全事件（随拒绝保留）。目录事件类型 listing_linked、listing_relinked、listing_unlinked 登记进 app/domain/catalog.py 的 EVENT_TYPES（record_change 只收登记过的类型；tests/unit/test_catalog.py 里断言事件类型个数的测试随之改为十二种），写变更记录用 app/services/catalog.py 的 record_change。新错误码放在本模块：LISTING_NOT_FOUND（404）、LISTING_ALREADY_LINKED、LISTING_SKU_TAKEN、LISTING_HAS_QUOTA（409），message 照现有错误的风格。入口不存在或属于别的租户 404 NOT_FOUND（契约 8.3 的 404 列表里没有入口的专用码，两种情形回答完全相同）；入口存在但不是 platform 422 INVALID_REQUEST。
      二，app/api/catalog.py 的 _set_sku_status 与 _set_product_status（停用的命令体在接口模块里）：真要从 active 改为 inactive 时（已是目标状态照旧 200），SKU 在任何入口上有 active 的平台商品，409 SKU_HAS_ACTIVE_LISTINGS，details.listing_ids 按升序列出；停用商品时它的 SKU 里有 active 平台商品的，details 带 sku_id（有几个取最小的）与那个 SKU 的 listing_ids。在锁住 SKU 或商品行之后用 FOR SHARE 读 sku_listings。
      三，app/services/sku_merges.py：新建合并时来源或规范 SKU 有 active 的平台商品，409 SKU_HAS_ACTIVE_LISTINGS（details 带 sku_id 与它的 listing_ids，两个都有时取来源 SKU），放在契约 2.8 新建判定的第 6 步（别的未结束合并单）之后、写合并单之前。
      明确不做：后台接口、角色断言与后台执行器（第 3 组）；改配额（CORE-TASK-090）；平台订单（平台事件执行器的任务）。
    status: ready
    depends_on:
      - CORE-TASK-092
      - CORE-TASK-079
    acceptance_criteria:
      - 新增 app/services/listings.py 与 tests/integration/test_listings_service.py，只改 allowed_change_paths 里的其余文件
      - test_listings_service 在测试模块里挂测试路由，经执行器核心（catalog_lock 为真、read_committed 为真、balance_rows 为 listing_balance_rows、before_transaction 为 prepare_listing_rows）以直接插入的 admin 主体与 catalog_admin 角色组的上下文调三个命令体；数据都在 db 夹具之外提交、在 finally 里按外键先后删掉
      - 挂上：新建得 201、版本 1、catalog_changes 一条 listing_linked；已有 inactive 的行改挂到所给 SKU 并启用、版本加一；已有 active 409 LISTING_ALREADY_LINKED；同入口同 SKU 已有别的 active 409 LISTING_SKU_TAKEN；入口是 api 或 backoffice 得 422；SKU 已合并、停用、不存在与在未结束合并单里得各自的码；改挂到原 SKU 不加版本不写记录；对 inactive 的行改挂或解除 409 STATE_CONFLICT
      - 改挂与解除：版本不符 409 VERSION_CONFLICT；原 SKU 在这个入口上配额不为 0 时 409 LISTING_HAS_QUOTA 且什么也不改；配额为 0 时成功、变更记录的 changes 记 sku_id 或 status 的前后值、product_id 为改动后 SKU 的商品
      - 并发：一个连接锁住某 SKU 在这个入口上的 channel_allocations 行并把配额从 0 改为 3 后提交，另一个同时解除这个 SKU 的平台商品的请求等到它提交之后判，得 LISTING_HAS_QUOTA（用两个连接与事件对象控制先后，照 tests/integration/test_fulfilment_concurrency.py 的做法）
      - 停用 SKU、停用商品（tests/integration/test_catalog_updates_api.py，商品的 details 另带 sku_id）与新建合并（tests/integration/test_sku_merges_api.py）在有 active 平台商品时得 409 SKU_HAS_ACTIVE_LISTINGS 与按升序的 listing_ids，平台商品为 inactive 时照常成功；这两个测试文件只加用例，用例建的 platform 入口放在自己新建的池上，提交的数据在 finally 里删掉，会话结束时 migrated_engine 降到 base 照常成功
      - 同一提交键重放返回原结果、换内容 409 IDEMPOTENCY_CONFLICT，照执行器已有的规则
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
