      platform_events：照契约 5.10 存放的列；主键 event_row_id；platform_order_id 非空 VARCHAR 128；platform_line_id NOT NULL VARCHAR 128（订单级为空串）；action VARCHAR 32，取 created、ready_to_ship、shipped、cancelled、return_requested、return_received；source VARCHAR 16，取 webhook、pull、manual；payload 为 JSON 对象；event_key 非空 VARCHAR 128；manual_key 与幂等键同长度（照 idempotency_records 的列），request_hash CHAR 64，两者在 source 为 manual 时都非空、否则都为空；received_at 非空；result 取 applied、ignored、held、attention，applied_at 与 result 同空同非空；result_code 可空 VARCHAR 64（这个事件的待处理原因或 Core 错误码；平台订单上的 attention 只记第一个原因，后来事件的原因记在这里，不丢；契约没列这一列，是补的），检查 result 为 held 或 attention 时非空、为 ignored 时为空、为 applied 时可空（成功但另标缺陷时记 defect）；外键 (tenant_id, channel_id) 到 sales_channels，credential_id 复合外键到 credentials；去重键与 (tenant_id, credential_id, manual_key) 两条唯一约束；普通索引 (tenant_id, channel_id, platform_order_id, applied_at) 供按订单取未处理事件，普通索引 (applied_at, tenant_id, channel_id) 供作业找有未处理事件的订单。
      order_ref 照契约不超过 112；单据引用超长时怎么派生、补拉以状态时间作 event_key 时同一时刻两个单据怎么不撞去重键，分别由 CORE-TASK-083 与 086 处理，不在表上解决。
