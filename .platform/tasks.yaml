    creates_pull_request: true

  - id: CORE-TASK-015
    title: 给幂等执行器加目录写锁，写目录的命令开事务前取锁
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.7 的 2.7 与 7.1 执行顺序第 3 步，给 CORE-TASK-008 的 run_idempotent 加一个关键字参数，由写目录的命令声明要取目录写锁；锁名用 CORE-TASK-013 的函数，
      数据库名的取法与幂等锁名相同。顺序：取到幂等锁（等待 0）之后、开事务之前，在同一连接上、没有打开事务时执行 GET_LOCK(目录锁名, 5)，照取幂等锁的写法结束这条语句隐式开的事务，然后才开事务，
      所以读快照建立在目录锁之后。返回 1 继续；返回 0、返回 NULL 或数据库出错都为 503 UNAVAILABLE，什么也不写、不保存幂等记录，同键重试可以执行；
      幂等锁返回 0 时照旧立即 409 REQUEST_IN_PROGRESS，不去取目录锁。目录锁与幂等锁都由已有的 RELEASE_ALL_LOCKS 一并释放，命令成功、业务拒绝、抛异常与 503 的路径都释放。
      等待秒数写成模块常量 5，测试可以替换成更短的值。没声明的命令行为不变。
      在模块文档里写明：写目录的命令如何声明；开事务前的先后固定为幂等锁、目录写锁、余额行预建（本任务不做）、开业务事务；不在打开事务或持有行锁时带等待地取锁；凡是写目录变更记录的路径都要声明。
      明确不做：余额行预建、目录命令本身、写变更记录。
    status: done
    depends_on:
      - CORE-TASK-013
    acceptance_criteria:
      - 改在 app/services/idempotency.py，模块文档按 purpose 写明；没声明目录锁的写命令行为不变（已有的幂等测试照常通过）
      - 集成测试：另一个连接持有本租户的目录锁时，声明了目录锁的测试写路由等待后得 503 UNAVAILABLE（测试把等待改短），没有幂等记录、命令数据没有写；锁释放后同键重试正常执行
      - 集成测试：别的租户持有的目录锁不影响本租户；没声明目录锁的测试写路由不受目录锁影响
      - 集成测试：幂等锁被占时立即得 409 REQUEST_IN_PROGRESS，不等待目录锁（测试同时持有两把锁，响应耗时远小于等待秒数）
      - 集成测试：请求结束后目录锁已释放（另一个连接能取到），覆盖成功、业务拒绝、抛异常与 503 四种结果
      - 集成测试验证读快照在目录锁之后：两个不同幂等键的请求并发执行同一个测试命令（在命令里用普通的不加锁 SELECT 读一个计数行、经测试钩子停顿、再写回加一；不用 FOR UPDATE，否则锁的先后不对测试也会通过），最终计数为 2 而不是 1
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试由 PR 的必需 CI 检查 integration 执行并通过
