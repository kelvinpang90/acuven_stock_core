nual_confirmed_quota 与 quota 是否相等判“待生效”，平台卖出时 Q 与平台显示量一起减，会误报；先改契约再登记，见登记 PR）；改配额（CORE-TASK-100）；发布与读回（CORE-TASK-121、122）；前端。
