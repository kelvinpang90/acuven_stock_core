      - 集成测试验证保密与事件失败：所有子命令的标准错误与日志里没有明文令牌；让安全事件写入失败时（例如照 tests/integration/test_api_auth.py 的先例替换写入函数）操作照样生效、退出码 0，传入的标准错误流只有一行警告（带操作类型与目标 ID、没有堆栈），并且在同一个测试里两项都断言：用 caplog 断言调用期间没有来自 app.services.security_events 的日志记录，用 capsys 断言调用期间 sys.stderr 没有任何输出（不做配置时记录被 pytest 的日志捕获截走、sys.stderr 看不到；只关 propagate 时记录落到 logging.lastResort、caplog 收不到但堆栈写进 sys.stderr；所以两项都要）；入口函数返回后日志配置已恢复原状；参数错误的一行不含参数值（例如把明文令牌当位置参数传入时）
