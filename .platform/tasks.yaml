    title: 后台的告警列表与确认、继续销售或停售的决定、手动对账与对账记录接口，对账与推送作业挂进进程
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 8.6 第 2 条（后台的运营操作、对账与自查页）、3.2（platform_alerts、reconciliation_runs、platform_ops_log 的 alert_acknowledged、incident_decision、reconciliation_started）、10 第 3 条的角色表，docs/PLATFORM_CHANNELS.md 第 7、8 节（工作包 P4e 的接口与作业部分；Kelvin 2026-11-24 定这几个后台接口随第 4 组登记）。接口加在 CORE-TASK-109 的 app/api/admin_platform_ops.py，命令体加在 app/services/platform_alerts.py（确认告警、记决定）与 app/services/platform_reconcile.py（请求对账），读查询加在 app/services/admin_queries.py。
      一，GET /api/v1/admin/alerts?acked=&after=&limit=：只要求登录；acked 取 true 或 false（不带为 false），其余值 422；按 created_at 倒序、再按 alert_id 倒序，分页照 CORE-TASK-100 的后台列表规则，游标文本为 created_at 的 RFC 3339 微秒 Z 文本加竖线再加 alert_id；每条为 alert_id、kind、channel_id、platform、sku_id、platform_order_row_id、order_ref、detail、created_at、first_sent_at、last_notified_at、notify_count、escalated_at、acked_at、acked_actor_ref（确认的管理员账号 ID，从 platform_ops_log 的 alert_acknowledged 取，没有为空）。
      二，POST /api/v1/admin/alerts/{alert_id}/ack：经 run_admin（operation platform_alerts.ack，角色 stock_operator 与 stock_admin，断言 stock_admin，上下文的入口与池为空），正文为空对象；alert_id 按 is_admin_id 判格式，不存在 404 NOT_FOUND，别的租户经 admin_not_found；命令体 acknowledge_alert(execution, alert_id) 在事务里 FOR UPDATE 这一行，已确认 409 STATE_CONFLICT（{"reason": "already_acked"}），否则写 acked_credential_id 与 acked_at（数据库时间）和一条 platform_ops_log（alert_acknowledged，object_type alert、object_id 为 alert_id，after 为 alert_id、kind、acked_at）；200 返回这条告警在一里的表示。
      三，POST /api/v1/admin/incident-decisions：经 run_admin（operation platform_ops.incident_decision，角色同二，上下文的入口与池为空），正文 decision（continue_selling 或 stop_selling）、channel_id（可选；给了就须是本租户的 platform 入口，inactive 的也可以，只是一条记录；格式、不存在、别的租户的判定同 CORE-TASK-116）、reason（同 reason 惯例）；命令体只写一条 platform_ops_log（incident_decision，object_type channel 或为空，after 为 decision 与 channel_id），不改任何别的东西（设计第 8 节：Core 故障时记下继续销售或手动停售的决定）；201 返回这条日志的 id、decision、channel_id、reason、actor_ref、created_at。
      四，POST /api/v1/admin/reconciliations：经 run_admin（operation platform_ops.reconcile，角色 stock_admin，上下文的入口与池为空），正文为空对象（契约 8.6 第 2 条：后台写操作都走后台执行器）。命令体 request_reconciliation(execution) 在事务里先 FOR UPDATE 这个租户的 platform_write_pause 行（两个不同幂等键的请求同时来时串行；没有这一行即租户没有平台入口，422 INVALID_REQUEST），再判：这个租户已有 trigger 为 manual、finished_at 为空、started_at 在 15 分钟之内的行时 409 STATE_CONFLICT（{"reason": "reconcile_pending"}）（作业每分钟取一次、一次对账有 5 分钟的预算，15 分钟还没完成的多半是出错了，不再挡管理员重新发起，补的）；否则插入一行 reconciliation_runs（new_id 的 rcn 前缀，trigger manual，credential_id 取上下文，started_at 为数据库时间）并写 platform_ops_log（reconciliation_started，object_type reconciliation、object_id 为 run_id，before 为空，after 为 run_id 与 trigger，操作主体列取上下文）；202 返回 run_id 与 started_at。对账本身由 CORE-TASK-123 的作业在一分钟内执行（对账要在事务外调平台，放不进执行器的一笔事务，也不该让一个 HTTP 请求等它跑完，补的做法）；前端按 run_id 在列表里看结果。
      GET /api/v1/admin/reconciliations?after=&limit=：只要求登录；按 started_at 倒序、再按 run_id 倒序，分页照 CORE-TASK-100 的后台列表规则，游标文本为 started_at 的 RFC 3339 微秒 Z 文本加竖线再加 run_id；每条为 run_id、trigger、actor_ref（发起的管理员账号 ID，从 reconciliation_started 的日志取，定时的为空）、started_at、finished_at、discrepancy_count。
      五，作业：create_app 在后台开关为真时再建两个定时任务 platform-reconcile（调 ReconcileRunner.run_round）与 platform-alert-notify（调 notify_round，sender 由 build_sender(app.state.platform_secrets) 得出），周期取 JOB_INTERVALS；与现有任务一起启动、并行停止，就绪检查列出它们；开关为假时不建、不列。
      明确不做：解除写入暂停、解除待核对等其余运营操作（第 3 组待登记）；前端。
