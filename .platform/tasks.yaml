  - id: CORE-TASK-036
    title: 写出预留状态、到期判定与可售判定的纯函数
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.12 的 5.2 与 5.6，新建 app/domain/reservations.py，只放纯函数与常量（不 import FastAPI、SQLAlchemy
      或任何做 I/O 的库），单元测试放 tests/unit/test_reservations.py，用标准库 unittest。之后的表结构、预留、释放与可售量任务都用它。
      一，常量：预留状态六个取值 active、released、expired、committed、late_payment_review、closed_refunded；释放原因三个取值
      cancelled、payment_failed、checkout_replaced；到期关单的 reason_code expired；流水 source_type reservation；ID 前缀常量的值为 rsv 与 oln（app/domain/ids.py 的 new_id 只收不带下划线的小写前缀，生成的 ID 形如 rsv_ 加 ULID）；
      有效期默认 900、下限 60、上限 3600；订单行数量下限 1、上限 1000000；可售状态 merged、inactive、sellable。
      二，parse_ttl_seconds(value)：只接受 60 到 3600 的 int（不接受布尔与其他类型），返回它，否则抛 ValueError。
      三，compute_expires_at(created_at, ttl_seconds)：返回 created_at 加 ttl_seconds 秒。
      四，is_due(status, expires_at, now)：status 为 active 且 now 不早于 expires_at（相等算到期）时为真。
      五，displayed_status(status, expires_at, now)：is_due 为真时返回 expired，否则原样返回 status（契约 5.6 读接口不写库，Q-54）。
      六，release_decision(status, expires_at, now)：返回枚举 ReleaseDecision 的一个值——active 且未到期为 RELEASE；active 且已到期为 EXPIRE；
      released 或 expired 为 UNCHANGED；committed、late_payment_review、closed_refunded 为 CONFLICT；其他值抛 ValueError（契约 5.6 释放，Q-55）。
      七，find_shortfalls(lines, available_by_sku)：lines 是按请求顺序的 (line_ref, sku_id, quantity) 序列，available_by_sku 是 sku_id 到 available 的映射；
      按请求顺序返回 quantity 大于 available 的行，每项 line_ref、sku_id、quantity、available；都够时返回空列表。
      八，availability_status(merged_into_sku_id, sku_active, product_active)：merged_into_sku_id 非空返回 merged；否则 SKU 或商品不是 active 返回 inactive；
      否则 sellable（契约 5.6 可售量的先后）。
      明确不做：表结构、接口、配置项与服务层（CORE-TASK-037 到 040）。
    status: done
    depends_on: []
    acceptance_criteria:
      - 函数与常量在 app/domain/reservations.py，不 import FastAPI、SQLAlchemy 或做 I/O 的库；单元测试在 tests/unit/test_reservations.py，用 unittest
      - 单元测试验证 parse_ttl_seconds：60、900、3600 通过；59、3601、布尔、字符串、浮点数都抛 ValueError
      - 单元测试验证到期边界：now 早于 expires_at 一微秒不到期，等于或晚于即到期；只有 active 会到期；displayed_status 对到期的 active 返回 expired、其余原样
      - 单元测试逐个状态验证 release_decision 的四种结果，未知状态抛 ValueError
      - 单元测试验证 find_shortfalls：全部够时为空；多行不足时按请求顺序全部列出、每项带 available；available 为 0 与 quantity 恰等于 available 的边界
      - 单元测试验证 availability_status 的先后：已合并且停用报 merged，商品停用而 SKU 有效报 inactive，都有效报 sellable
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
    allowed_change_paths:
      - app/domain/reservations.py
      - tests/unit/test_reservations.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
