    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.13 的 5.7（晚到确认、存放）与 5.2 第 6 条，在 CORE-TASK-044 的 app/services/sale_commits.py 里把 LATE 与 EXPIRE_THEN_LATE 从 503 换成晚到确认；
      关单用 CORE-TASK-039 的 close_if_due，判可售用 CORE-TASK-041 的 sku_shortfalls。
      一，EXPIRE_THEN_LATE 在同一事务里 close_if_due 后走晚到确认；LATE 直接走。晚到确认（池行已读过）按 (pool_id, sku_id) 升序锁订单行各 SKU 的余额行，按 SKU 合计判可售（停用不拦）：
      够则每行一条 LATE_SALE_COMMIT（reason_code 用 commit_reason_code，occurred_at 取预留已记下的 paid_at，没有时取请求的），订单行 committed_qty 设为 quantity，预留改为 committed，late 为真；
      不够则 409 LATE_PAYMENT_INSUFFICIENT_STOCK（details.lines 照 5.7），转入 late_payment_review 用 keep_on_rejection 登记，它写 payment_ref 撞唯一约束时在该写入里抛 RedoCommand。
      二，执行器在业务拒绝时先回滚命令的保存点、再执行保留写入，所以 EXPIRE_THEN_LATE 而缺货时，同一事务里的到期关单会被撤销：这时保留写入里先调 close_if_due 再转入待审，
      使 RELEASE expired 流水、reserved 的减回与 closed_at 和待审一起提交。
      三，存放照 5.7：第一次转入待审记 payment_ref、paid_at、commit_request_hash 与 commit_ 一组列；expired 或待审转为 committed 保留原 closed_at；待审重试成功时 commit_request_hash 与 commit_ 一组列改记成功的那次、payment_ref 与 paid_at 不变；
      重试仍不够时预留的列都不改；reservation_id 为 null 的请求转入待审或确认时 fault_mode 设为真、之后不改回。
