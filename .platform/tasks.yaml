      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-016
    title: 实现商品与 SKU 的查询接口与表示
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.7 的 2.1、2.4 中已合并 SKU 的查询规则、2.6 第 6、7 条与 7.2，实现 GET /v1/products/{product_id}、GET /v1/skus/{sku_id} 与 GET /v1/skus，
      要求 catalog.read，不要求角色；查询参数的取值规则用 CORE-TASK-013 的纯函数，请求处理、鉴权与授权沿用已有的。接口放新文件 app/api/catalog.py（APIRouter，在 app/main.py 挂上），
      读数据库的部分放新文件 app/services/catalog.py；读表示的函数与时间格式化函数写成可复用的，供之后的写命令、批量导入与变更流任务调用。
      一，按 ID 查询：GET 商品与 GET SKU，不存在 404 PRODUCT_NOT_FOUND 或 SKU_NOT_FOUND，属于别的租户时响应完全相同并用 cross_tenant_not_found 记事件；已合并的 SKU 照常返回、带 merged_into_sku_id。
      二，GET /v1/skus：sku_code、barcode、ids 三个查询参数恰好带一个且只出现一次，否则 422，其他查询参数也 422；sku_code 与 barcode 按 CORE-TASK-013 的取值规则校验（不合规 422；barcode 去首尾空白后为空串时也 422，不当作查空条码），
      按比较键精确匹配当前值，返回 0 或 1 个（退役编码查不到）；ids 是逗号分隔的 1 到 100 个 ID，有空项或重复 422，超过 100 个也是 422（查询参数不是请求体，不用 413），ID 不校验格式（查不到即不出现），只返回属于本租户的，不存在或属于别的租户的不出现、不报错、不记事件。
      结果为 skus 数组，按 sku_id 升序，不分页。
      三，表示：商品为 product_id、name、status、version、created_at、updated_at、skus（SKU 的表示，按 sku_id 升序）；SKU 为 sku_id、product_id、sku_code、barcode、name、
      reference_price（null 或含 amount_minor 与 currency 的对象）、status、product_status（所属商品的状态）、merged_into_sku_id、version、created_at、updated_at。
      时间为 UTC 的 RFC 3339 字符串，微秒精度，以 Z 结尾；格式化函数放在 app/api/catalog.py，之后的接口照用。
      明确不做：任何写命令（下一任务起）、批量导入、变更流接口。
