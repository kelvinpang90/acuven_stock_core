      - 集成测试在真 MySQL 上验证导入表：status 为未知值或只差大小写被拒；previewed 却有 result 或任一确认列被拒；confirmed 缺 result 或任一确认列被拒；rows 不是数组被拒；预览凭据或确认凭据属于别的租户被拒
      - 集成测试在真 MySQL 上验证变更记录表：object_type 为未知值被拒；商品事件的 object_id 不等于 product_id 被拒；product_id 指向别的租户的商品被拒；import_id 指向别的租户的导入被拒；credential_id 属于别的租户被拒；version 为 0 被拒；changes 不是对象被拒；event_type 为任意新值可以插入；先后插入的两条 id 递增
