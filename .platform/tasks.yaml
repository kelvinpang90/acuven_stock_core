  - id: CORE-TASK-025
    title: 给幂等执行器加余额行预建与业务引用撞约束后的重新判定
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.10 的 4.1（余额行预建）、2.7 的开事务前先后、7.1 第 2 条最后一段（并发撞业务引用）与 6.2 第 7 条，
      扩展 CORE-TASK-008、015 的 app/services/idempotency.py，供之后的库存命令使用。没用到这些参数的命令行为不变。
      一，run_idempotent 加关键字参数 balance_rows：可空的函数，收连接、返回要预建的 (pool_id, sku_id) 列表。给了时，在取到幂等锁
      （以及目录写锁）之后、开业务事务之前，先在同一连接上调用它（它可以读库，例如期初确认按导入记录取 SKU；读完照已有写法结束隐式事务），
      再开一个短事务：去重后按 (pool_id, sku_id) 升序逐行 INSERT 进 stock_balances（只给 balance_id、tenant_id、pool_id、sku_id 四列，
      balance_id 前缀 bal_，租户取凭据的；四个量、balance_version、CORE-TASK-022 加的 last_book_only_version、last_reconciled_version 与 opening_entry_id 都取数据库默认值），
      ON DUPLICATE KEY UPDATE 只把 balance_id 设为自身，已有的行不改；某行因外键失败（MySQL 1452，SKU 或池不存在或属于别的租户）跳过、
      继续下一行，不报错；提交后才开业务事务。不用 INSERT IGNORE。预建遇到别的数据库错误：什么也不保存，返回 500 INTERNAL_ERROR，
      同键重试会重新执行。同键重放时预建照样做（全零的行与没有行等价，多建无害）。
      二，Execution 加只读属性 request_digest，即本请求的规范化请求摘要，供命令判定换键重报的业务引用。
      三，新异常 BusinessRefTaken(rejudge)：命令在写业务引用撞上唯一约束时抛出，rejudge 是收 Execution、返回 CommandResult 或抛 ApiError 的函数。
      执行器收到后：回滚命令的全部写入，丢弃命令登记的安全事件与 keep_on_rejection 的写入，在同一连接上开新事务（读快照看得到已提交的那一条），
      调用 rejudge，把它的结果（2xx 或 4xx）照常作为确定结果写幂等记录并提交；rejudge 登记的安全事件照常在事务结束后写。
      rejudge 抛别的异常或数据库出错：回滚、不保存、500。写幂等记录撞唯一约束的已有处理照旧。
      四，run_idempotent 加关键字参数 read_committed（默认 False）：为真时，业务事务（以及 BusinessRefTaken 的重新判定事务）以 READ COMMITTED 隔离级别开启，
      只影响这一个事务，事务结束后连接回到默认级别。READ COMMITTED 下普通读每条语句都看到最新已提交的数据，加锁读不加间隙锁；
      供盘点单命令在锁住盘点单行之后用普通读读盘点行（加锁读一个空范围会锁间隙，两张单的首次提交互相等待而死锁）。
      在模块文档里写明 balance_rows、request_digest、BusinessRefTaken、read_committed 的用法与开事务前的先后：幂等锁、目录写锁、余额行预建、开业务事务。
      明确不做：库存命令本身、锁余额行与写流水的服务函数（下一任务）。
    status: done
    depends_on:
      - CORE-TASK-022
    acceptance_criteria:
      - 改在 app/services/idempotency.py，模块文档按 purpose 写明；没传 balance_rows、不抛 BusinessRefTaken 的命令行为不变（已有的幂等测试照常通过）
      - 集成测试：声明了 balance_rows 的测试写路由，在命令运行时（经测试钩子停顿）另一个连接已能看到预建的余额行（证明预建在业务事务之前提交）；已有余额行的四个量与版本不被改动；SKU 属于别的租户、池不存在的那几行跳过而其余照建，响应正常
      - 集成测试：预建的插入顺序按 (pool_id, sku_id) 升序（测试记录执行的语句或插入顺序）；同键重放时命令不再执行而预建照做且无害
      - 集成测试：测试让预建遇到非外键的数据库错误时返回 500，没有幂等记录、命令没有执行
      - 集成测试：命令里 execution.request_digest 等于按契约 7.1 由路径参数与请求体算出的摘要；声明 read_committed 的命令里查询当前事务的隔离级别为 READ-COMMITTED，命令运行中（经钩子停顿）另一个连接提交的行能被普通读看到，请求结束后同一连接再执行的事务回到默认隔离级别
      - 集成测试：两个不同幂等键的请求并发执行同一个测试命令（命令先写一行再插入带唯一约束的引用行，经钩子让两者交错），后到的那个抛 BusinessRefTaken 后，它先写的那一行被撤销，rejudge 读到先到者已提交的引用行并返回其结果；这个结果存为后到者幂等键的确定结果，同键重试原样重放；后到者命令登记的安全事件被丢弃、rejudge 登记的照常写入
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/idempotency.py
      - tests/integration/conftest.py
      - tests/integration/test_idempotency.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true
  - id: CORE-TASK-026
    title: 实现库存写命令共用的锁池、锁余额行、写流水与单据服务
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.10 的 4.1、4.3、6.2 与 8.1 的并发约定，新建 app/services/stock.py，放之后各库存写命令共用的数据库函数。
      函数都在 CORE-TASK-025 的执行器已开的事务里、用 execution.connection 运行，自己不开、不提交、不回滚事务；拒绝抛 ApiError。
      一，lock_pool(execution, pool_id, for_update=False)：按租户用 SELECT FOR SHARE（池切 live 用 FOR UPDATE）读池行，返回状态；
      require_live 在不是 live 时抛 409 POOL_NOT_LIVE，require_initializing 在已 live 时抛 409 POOL_ALREADY_LIVE（details 带 pool_status）。
      二，SKU 检查分两步，因为读快照建立在幂等记录的查询时，普通读看不到之后提交的 SKU 合并：
      require_skus_exist(execution, sku_ids) 在锁余额行之前用普通读按请求顺序查 SKU；不存在或属于别的租户的收集起来，抛 404 SKU_NOT_FOUND，
      details.sku_ids 按请求顺序列全，其中属于别的租户的每个用 execution.record_security_event 登记一条 cross_tenant（对象类型 sku）；
      require_not_merged(execution, sku_ids) 在 lock_balances 之后按 sku_id 升序用 SELECT FOR SHARE 读这些 SKU 行（加锁读看得到最新提交，
      锁序为池行、余额行、SKU 行，与合并执行先锁余额行再改 SKU 行的顺序一致，不成环），第一个已合并的抛 409 SKU_MERGED，details 带 sku_id 与
      merged_into_sku_id；停用的 SKU 与停用商品下的 SKU 照常通过。
      锁余额行时某个 SKU 没有余额行（SKU 在预建之后才建成，极少见）：抛异常、500，同键重试时预建会补上。
      另，命令时间：command_now(execution) 在命令开头用 SELECT CURRENT_TIMESTAMP(6) 读一次数据库时间（返回值由命令自己保存、传给各函数，
      不存在 Execution 上；with_document 在新事务里重新运行命令时，命令照样在开头重读一次），同一命令的各条流水在调用方
      没给 occurred_at 时都用它，单据的 created_at 也用它，所以一张单据的各行与表示里的时间一致。
      三，lock_balances(execution, pool_id, sku_ids)：按 (pool_id, sku_id) 升序 SELECT FOR UPDATE 锁余额行（行已由预建建好），返回按 sku_id 索引的
      当前四个量、balance_version、last_book_only_version、last_reconciled_version、opening_entry_id；行不存在视为程序错误（抛异常，500）。
      四，append_entry(execution, balance, entry_type, deltas, command_id, ...)：由锁住的余额行与四个增量算出写后的四个量（用 app/domain/quantities.py 的
      Quantities 校验不变量，违反时抛给调用方处理），balance_version 加 1，按 CORE-TASK-023 的 last_book_only_version_after 与 last_reconciled_version_after 更新两个判定列；
      OPENING_BALANCE 把 opening_entry_id 设为这条流水，CORRECTION 在原流水的 entry_id 等于 opening_entry_id 时清空它；UPDATE 余额行、
      INSERT 流水（entry_id 前缀 ent_；channel_id 取凭据的销售入口；credential_id、actor_ref、actor_role、request_id、idempotency_key 取自本请求；
      source_type、source_ref、line_ref、reason_code、note、occurred_at、corrects_entry_id 由调用方给，occurred_at 为空时取 command_now；recorded_at 也显式写 command_now，不靠列默认值，所以同一命令的各条流水 recorded_at 相同），
      返回流水的表示；append_entry 就地更新传入的余额对象（四个量、balance_version、两个判定列、opening_entry_id），同一命令对同一行再写流水时用更新后的值。
      同一命令的各条流水共用一个 command_id（前缀 cmd_；在本模块定义 new_command_id()，用 app/domain/ids.py 已有的 new_id 生成，不改 ids.py）。append_entry 另收可选的 reconciled_version：
      给了时 last_reconciled_version 取它而不按默认规则（盘点确认取快照版本，契约 0.10 的 4.1 例外），它小于当前值或大于写后的 last_book_only_version 时抛异常（程序错误）。
      mark_verified(execution, balance, reconciled_version=None)：差额为 0、不写流水的核实，把 last_book_only_version 设为当前 balance_version，
      last_reconciled_version 设为当前 balance_version 或给定的 reconciled_version（同样的检查）。
      五，单据：find_document(execution, document_type, document_ref) 按租户与凭据的销售入口读 stock_documents；answer_existing_document
      按契约 6.2 第 7 条判定（摘要不同时的回答可由调用方替换，供更正报 already_corrected）：request_hash 等于 execution.request_digest 时返回 200 与 result，否则抛 409 BUSINESS_REF_CONFLICT 并登记
      business_ref_conflict 事件（details 带引用类型与值）；new_document_id(document_type) 生成单据 ID（前缀按类型 rcp_、adj_、cor_），命令先拿到 ID 与 command_now 再拼 result；
      insert_document(execution, document_type, document_ref, document_id, created_at, result) 写一行，撞唯一约束时抛 CORE-TASK-025 的
      BusinessRefTaken，rejudge 一律用下面 with_document 的那一个。
      业务引用的检查用普通读，读快照建立在幂等记录的查询时，看不到并发的另一个请求在那之后提交的同一引用；那个请求的写入又会改变本命令
      锁行后看到的账面，使本命令被业务规则拒绝（例如同一不可售调整换键重报，先到者已用掉可售量，后到者得 409 INSUFFICIENT_STOCK 而不是原结果）。
      所以单据命令统一经 with_document(execution, document_type, document_ref, command, on_conflict=None) 执行（on_conflict 是摘要不同时的回答，
      收已有的单据、抛 ApiError；不给时为 409 BUSINESS_REF_CONFLICT 加 business_ref_conflict 事件；首次判定与 rejudge 都用它）：先 find_document，有则 answer_existing_document；
      没有则运行 command（它锁行、写流水、最后 insert_document 并返回结果）；command 抛业务拒绝（ApiError 4xx）时不直接拒绝，改抛 BusinessRefTaken，
      其 rejudge 在执行器开的新事务里（读快照看得到已提交的全部写入）重新 find_document，有则 answer_existing_document，没有则再运行一次 command，
      这一次的拒绝就是确定结果；insert_document 撞唯一约束时的 rejudge 与此相同。
      append_entry 写 CORRECTION 撞上流水表的 (tenant_id, corrects_entry_id) 唯一约束（并发的另一笔更正先提交）时，同样抛 BusinessRefTaken，
      在 with_document 里与单据撞约束走同一个 rejudge，不返回 500。rejudge 里再次撞上唯一约束（第三个并发请求）按 500 处理，
      同键重试会重新执行。代价是被拒的单据命令多一次事务。
      六，entry_representation：契约 6.8 的流水表示（deltas、after 两个对象各含四个量，时间为 UTC 的 RFC 3339 微秒加 Z，不含 idempotency_key 与 credential_id），
      供本任务与之后的流水查询、更正共用。
      明确不做：任何接口、具体命令的规则（期初、收货、调整、盘点、更正）、余额行预建（执行器已做）。
    status: done
    depends_on:
      - CORE-TASK-022
      - CORE-TASK-023
      - CORE-TASK-025
    acceptance_criteria:
