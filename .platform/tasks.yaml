      报 409 POOL_NOT_LIVE 与 404 SKU_NOT_FOUND 之前照 5.7 重查业务引用；有效期取 create_app 放在应用状态里的配置（从 execution.request.app.state 读）；重查命中改按第 1 步回答时，丢弃本次登记的 cross_tenant 事件，没命中时保留（同 5.6 并发重报）。
