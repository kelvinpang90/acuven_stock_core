      - 集成测试在真 MySQL 上验证新建商品：201 与表示；库里的商品、SKU、归属行与表示一致；变更记录先一条 product_created、再按请求顺序每个 SKU 一条 sku_created，before 全为 null，带凭据、操作者、角色、请求 ID、幂等键与原因；条码为空白串时存 NULL；同键重放不重复建
