  - id: CORE-TASK-078
    title: 销售入口加种类与平台两列，开通入口改为在命令行里按组合检查
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 3 入口的种类与组合（Q-81）与 10 第 4 条的 system 主体（工作包 P1e）。
      一，迁移 alembic/versions/20261123_0013_sales_channel_kind.py（revision 0013，down_revision 0012）：sales_channels 加列 kind，取值 api、platform、backoffice（检查约束），默认值 api，已有的行都是 api；加列 platform（shopee、tiktok_shop）与 platform_shop_id（1–64 个字母、数字、点、下划线、冒号或连字符）；检查约束保证 kind 为 platform 时两列都非空、其他时都为空，并约束 platform 的取值与店铺 ID 的字符集；(tenant_id, platform, platform_shop_id) 唯一。
      去掉唯一约束 (tenant_id, pool_id)：它同时是到 stock_pools 的复合外键要用的索引，所以先建同列的普通索引、再删唯一约束。downgrade 反向（一个池有多个入口时降级失败，降级只用于 CI 与开发库）。模型 app/models/inventory.py 同步。
      二，组合规则写成纯函数（新模块 app/domain/channels.py，单元测试 tests/unit/test_channels.py）：给定池里已有入口的种类（不论状态）与要开通的种类，判定是否允许。契约的两种组合（恰好一个 api；或一个以上 platform 加恰好一个 backoffice）是开通完成后的样子，而入口只能逐个开通，所以按“开通之后仍能成为两种组合之一”判：池里已有任何入口时不能加 api；已有 api 时不能加别的；backoffice 最多一个；platform 可以多个。店铺 ID 的格式也在这里判。
      三，命令行 app/cli/provisioning.py 的 channel create：加 --kind（默认 api，现有用法不变）、--platform 与 --platform-shop-id（kind 为 platform 时都必填，别的种类带了就拒绝）；在命令的事务里先以 FOR UPDATE 锁池行、再以 FOR UPDATE 锁租户行（固定这个先后：销售与库存命令是先 FOR SHARE 读池行、再经租户外键对租户行取共享锁，开通入口先锁租户再锁池会与它们死锁；锁租户行是为了下面每个租户只建一个 system 主体，同租户不同池并发开通时也串行）。不对同一行先取共享锁再取排他锁（锁升级会让同租户并发开通死锁），所以 channel create 不调 app/cli/__init__.py 里 FOR SHARE 的 require_tenant，在 provisioning.py 里自己写这两条加排他锁的查询；为了让报错的先后与文字照现在（租户找不到或停用先于池找不到），可以先用不加锁的普通读核对租户，再按上面的先后加锁并复核租户仍为 active。命令行事务是默认的 REPEATABLE READ，读快照在第一条普通读时就建好了（早于等锁），所以锁住之后读池里已有的入口、读这个租户的 system 主体，都必须用加锁读（FOR SHARE），不能用普通读，否则看不到并发的另一个开通刚提交的入口或 system 主体，会在同一个池上开出两个 api 或两个 backoffice、或给同一租户建两个 system 主体（入口组合与 system 主体都没有数据库约束兜底）。按上面的规则判。判定的先后：参数（种类与 platform、platform_shop_id 的搭配，店铺 ID 的格式）→ 租户 → 池 → 组合 → 同租户同平台同店铺 ID 已有；每种拒绝以退出码 2、一行固定的英文原因结束（照现有命令行的写法，不回显参数值），什么也不写；同租户同平台同店铺 ID 并发撞上唯一约束时报同一句（照现在 POOL_HAS_CHANNEL 的兜底写法）。
      开通 platform 入口而这个租户还没有 system 主体时，在同一事务里建一个（kind 为 system，name 为 platform_events，scopes 为空数组，不带入口，active），已有就不再建。开通 platform 入口的输出带键 system_credential_id，值为这个租户的 system 主体的 credential_id（新建的或已有的都给）；api 与 backoffice 入口的输出没有这个键。建 system 主体不记安全事件：它没有令牌，不是签发（契约 10 第 4 条的安全事件只管签发、轮换、吊销），开通命令本来也不记。show 输出每个入口的 kind、platform 与 platform_shop_id。
      逐个开通允许池停在只有 platform、还没有 backoffice 的中间状态（反过来也一样）；之后后台执行器找不到池的 backoffice 入口时怎么处理，留给后台的任务，本任务不管。
      四，app/cli/service_auth.py 的 credential issue：--channel 只接受 api 入口，指向别的种类以退出码 2 结束、什么也不写。app/cli/__init__.py 的 require_channel 不取 kind（也不在本任务路径里），照旧调它之后在 service_auth.py 里另查这个入口的 kind。
      明确不做：配额、平台商品、平台订单、收件箱与连接（第 2 组起）；后台；让 platform、backoffice 入口经任何执行器写。
    status: done
    depends_on:
      - CORE-TASK-077
    acceptance_criteria:
      - 只改 allowed_change_paths；迁移为 alembic/versions/20261123_0013_sales_channel_kind.py、down_revision 为 0012；upgrade 后 alembic check 无差异；降到 0012 再升回 head 照常，在 production 测试库上做、无论成败都在 finally 里升回 head，不动共享的 demo 库；tests/integration/test_service_auth_schema.py 里已有的 test_downgrade_fails_without_changes_while_admin_or_system_principals_exist 适配 0013：MySQL 的 DDL 不在事务里，从 head 降到 0011 时 0013 的降级先成功并提交版本 0012，0012 的降级再因 system 主体失败，所以版本停在 0012 而不是 head。改法二选一：先降到 0012、再试降到 0011 并认定 RuntimeError 后版本停在 0012；或从 head 降到 0011、认定 RuntimeError 后版本停在 0012。不论哪种，finally 里照旧删掉提交的行并升回 head；其余断言（credentials 的 kind 列仍在、system 主体仍是 SYSTEM）保留；0013 的降级不另加对 system 主体的拒绝（它只在一个池有多个入口时拒绝）；模型 SalesChannel 的 kind 列照 Credential.kind 的先例只用 server_default、不加 Python 端的 default（tests/integration/test_reservation_last_changed_at.py 在 0009 的结构上经 conftest 的 channel_insert 插入入口行，带 Python 端默认值会插入当时还没有的 kind 列而失败，这两个文件不在允许路径里）
      - 单元测试逐条验证组合规则：空池加 api、platform、backoffice 都允许；已有 api 时再加任何种类都拒绝；已有 platform 或 backoffice 时加 api 拒绝；已有 backoffice 时再加 backoffice 拒绝；已有两个 platform 与一个 backoffice 时再加 platform 允许；空、65 个字符、含空格或斜杠的店铺 ID 被拒；判定模块不 import 任何做 I/O 的库
      - 约束测试写在 tests/integration/test_inventory_schema.py：kind 取值以外、platform 入口缺 platform 或店铺 ID、api 或 backoffice 入口带了这两列、platform 取值以外、店铺 ID 字符集不对、同租户同平台同店铺 ID 重复，各被预期的那条约束拒绝；同一个池上的第二个入口不再被数据库拒绝（原来断言同池第二个入口被唯一约束拒绝的测试改为断言这一点）
      - 命令行测试写在 tests/integration/test_cli_provisioning.py，覆盖两种组合与各种违反：池上开通 api 之后再开任何种类被拒；开通两个 platform 与一个 backoffice 成功，第二个 backoffice 被拒、再加 api 被拒；被拒时库里没有新行；不带 --kind 的现有用法得 api 入口，已有的拒绝用例照常
      - 第一个 platform 入口建出这个租户的 system 主体（kind、name、空 scopes、无入口、active），不记安全事件；同租户之后的 platform 入口（含开在另一个池上的）不再建；锁住池行与租户行之后读池里已有入口与读 system 主体的两条查询是加锁读（FOR SHARE），不是普通读；show 输出每个入口的 kind、platform 与 platform_shop_id
