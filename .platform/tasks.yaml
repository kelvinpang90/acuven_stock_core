  - id: CORE-TASK-126
    title: 公网的平台授权回调路由，刷新令牌与清理授权 state 两个作业挂进进程
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 8.6 第 3 条（授权回调）、第 4 条（作业）、第 5 条（回调的查询串不进日志），docs/PLATFORM_CHANNELS.md 第 2 节（工作包 P4a 的回调与作业部分，从 CORE-TASK-116 拆出）。新接口模块 app/api/platforms.py（公网平台路由），在 app/main.py 只在后台开关为真时挂上。
      一，GET /api/v1/platforms/{platform}/oauth/callback：公网路由，不要求登录（会话 cookie 是 SameSite=Strict，不随平台的跳转带来，会话的绑定在 CORE-TASK-115 的服务里按 state 行上的会话 ID 查）；platform 只收 shopee、tiktok_shop，其余 404。查询参数 state 必须恰好一个、1 到 512 个字符，不合格直接得 failed、不进服务（这时没有可作废的行）。code 恰好一个、1 到 512 个字符时传给服务；缺、多于一个或超长时传 None（服务得 failed 并作废 state）。其余查询参数作为 extra 传给服务（平台可能在回调里带店铺 ID）：按查询串里的先后取前 10 个不同的参数名（error 之类也算在内），同名的只取第一个值；名或第一个值超过 512 个字符的，这个参数名整个丢掉、不计入 10 个。调 complete_authorization（没有这个平台的适配器时它得 failed 并作废 state，见 CORE-TASK-127）；一律 303 跳到 /admin/connections?oauth=<结果>（authorized、failed、expired），响应不带 code、state 与 extra，带 Cache-Control: no-store 与 Referrer-Policy: no-referrer；数据库不可用回 503（不跳转；第 1 步之后出的错，state 可能已作废，管理员重新发起授权即可）。进程日志只记平台与结果，不记查询串。
      二，作业：create_app 在后台开关为真时建两个定时任务放进 periodic_tasks：platform-token-refresh（周期取 CORE-TASK-111 的 JOB_INTERVALS，调 refresh_tokens，数据库名照现有锁名的取法）与 platform-oauth-state-purge（调 purge_oauth_states）；lifespan 与现有任务一起启动、一起并行停止，就绪检查列出它们。开关为假时不建、就绪检查不列。
      明确不做：webhook（CORE-TASK-119）；其余平台作业（CORE-TASK-119、122、125）。
    status: ready
    depends_on:
      - CORE-TASK-116
    acceptance_criteria:
      - tests/integration/test_platform_callback_api.py 用模拟适配器：先经 CORE-TASK-116 的接口发起授权，再带模拟平台给的 code 与 derive_state 的文本回调，303 跳到 oauth=authorized、连接为 active
      - 同一文件：state 缺或超长、过期、用过、路径里的平台不是 shopee 或 tiktok_shop（404）、state 是给另一个平台发的（failed）、缺 code、code 有两个各一条，跳转目标与状态码如 purpose 所写；缺 code 与 code 有两个时 state 已作废；extra 原样传到模拟平台的 exchange_code
      - 响应头与 Location 里都没有 code、state 与 extra；捕获的进程日志里没有 code 与 state
      - 后台开关为真时就绪检查的 periodic 列出 platform-token-refresh 与 platform-oauth-state-purge，为假时不列，回调路由不挂（404）
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/api/platforms.py
      - app/main.py
      - tests/integration/test_platform_callback_api.py
