      - 同一文件：发起授权成功 201，库里与幂等记录里都没有 state 原文；同键同正文重放得同样的响应、不多写 state 行；未登录、CSRF 不符、缺 Idempotency-Key、正文有键、入口不存在、别的租户（同时记了 cross_tenant）、不是 platform、主密钥未配置、没有适配器各一条，状态码与错误码如 purpose 所写，被拒的都不写 state
      - 同一文件：跳转接口对发起的会话 303 到模拟平台的授权页、地址里的 state 的哈希等于库里那一行的；换一个会话 404、过期与用过的 409、没有适配器 503、未登录 401
