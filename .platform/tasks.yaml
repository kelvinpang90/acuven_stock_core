    title: 让 API 与运维命令行启动时核对库里的实例标记
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.11 的 6.1（启动核对、生产实例的防护），让连库的 Core 进程在开始处理请求或命令之前比对
      库里 core_instance 的 core_env 与 CORE_ENV，用 CORE-TASK-033 的 check_instance_marker 判定。
      一，新建 app/services/instance.py：read_instance_marker(connection) 返回 core_instance 那一行的 core_env，表存在而没有行时返回 None；
      表不存在等数据库错误照常抛出。
      二，API：app/main.py 的 create_app 在建好引擎之后、构造应用之前做核对。CORE_DATABASE_URL 为空、连不上或读失败、表或行不存在、
      与 CORE_ENV 不同，都向标准错误写一行原因（固定文本加两个环境名，不含连接串与异常文本）后抛 SystemExit(1)，
      uvicorn 以工厂方式加载时进程因此以非 0 退出。原来“没配数据库照常启动、readyz 回 503”的行为取消（契约 0.11 写明 API 的连接串从此必填）；
      readyz 对运行中连不上数据库的处理不变。
      三，运维命令行：app/cli/__init__.py 的 run_command 在建好引擎之后、执行 handler 之前做同样的核对，失败时用已有的 fail 输出一行、返回失败退出码，
      不执行命令也不写安全事件；--help 与参数错误在连库之前就结束，不做核对。
      四，测试：tests/integration/conftest.py 加一个上下文管理器，临时把测试库 core_instance 的 core_env 改成给定值并提交，退出时改回 demo；
      tests/integration/test_cli_service_auth.py 的 production_cli 每次调用时才进入这个上下文、调用结束即退出（同一测试里还交替调 demo 的 cli，shop 夹具也用它），生产拒签 demo.reset 的两个测试照旧通过；
      不带数据库或连不上数据库创建应用的测试（tests/integration/test_health_api.py、test_api_requests.py、test_security_event_purge.py、test_api_auth.py 里的，后者是数据库连不上或为空时逐请求得 503 或 401 的几个测试）改为
      连测试库：没配连接串的改为断言创建应用以 SystemExit 失败；验证运行中连不上数据库的（鉴权回 503 UNAVAILABLE、安全事件写不进时缺头仍回 401、readyz 回 database_unreachable）先对测试库创建应用，再让引擎连不上（换掉 app.state.engine，或 monkeypatch 引擎的 connect），断言照旧；不改它们原本验证的其他内容。app/config.py 里 database_url 的注释改为说明 API 必填；readyz 的 database_not_configured 分支随之删去。
      明确不做：迁移与迁移前核对（CORE-TASK-033）、重置命令（CORE-TASK-035）；不改 CORE_ENV 的解析与健康检查的响应。
    status: done
    depends_on:
      - CORE-TASK-033
    acceptance_criteria:
      - 读标记的函数在 app/services/instance.py；API 的核对在 app/main.py 的 create_app，命令行的核对在 app/cli/__init__.py 的 run_command；已有测试除按 purpose 第四点调整的以外照常通过
      - 集成测试验证 API：库标记为 demo、CORE_ENV 为 demo 时创建应用成功；标记改成 production、core_instance 有表无行时都以 SystemExit 失败，标准错误只有一行且不含连接串；连接串为空或连不上时同样以 SystemExit 失败
      - 集成测试验证命令行：标记与 CORE_ENV 不同时返回失败退出码、输出一行、不执行命令（库里没有新增行）且不写安全事件；--help 不连库照常输出
      - 生产拒签 demo.reset 签发与轮换的两个已有测试在 production 标记下照旧通过；测试结束后测试库的标记回到 demo
      - 运行中连不上数据库时鉴权回 503 UNAVAILABLE、缺头仍回 401、readyz 回 database_unreachable 的已有断言照旧保留并通过
