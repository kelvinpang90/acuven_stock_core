      - 集成测试在真 MySQL 上验证四个 create 子命令：输出的 JSON 含新 ID 且前缀正确，库里的行与输出一致，状态按 purpose 所列（库存池为 initializing），名称前后空格被去掉
      - 集成测试验证校验：未知子命令或缺必填参数、名称为空或全是空格或超过 200 个字符或含换行、租户不存在或已停用、地点或库存池属于别的租户、地点已停用、库存池已有销售入口，都是退出码 2、标准错误有一行说明、库里没有多出任何行
