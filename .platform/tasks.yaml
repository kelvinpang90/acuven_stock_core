    title: 实现对有效预留的确认销售、拒绝分支与表示
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.13 的 5.7（通用、确认销售的正文、开事务前与第 1–4 步、表示）与 5.2 第 5–7 条，
      新建 app/api/sale_commits.py 与 app/services/sale_commits.py，在 app/main.py 挂路由；规则用 CORE-TASK-041 的 app/domain/sale_commits.py，
      写流水用 app/services/stock.py 的函数，重做用 CORE-TASK-043 的 RedoCommand。本任务只做有效预留的正常确认与各种不写东西的拒绝；晚到确认与转入待审在 CORE-TASK-045，并发重查与重做在 CORE-TASK-046。
      一，POST /v1/orders/{order_ref}/sale-commits（操作类型 sale_commits.create，scope orders.write，不要求角色）：路径 order_ref 不合格 422；
      正文 reservation_id（1 到 32 个字符的字符串或 null）、payment_ref、paid_at（带时区的 RFC 3339，存为 UTC）、lines（规则同预留，沿用 app/api/reservations.py 的行校验），四个都必填，其他 422；
      池用 app/api/auth.py 的 require_sales_pool，没有入口 403。经 run_idempotent，read_committed=True；balance_rows 为所列 SKU 及其合并去向（普通读）；
      开事务前钩子对同样这些 SKU 先关到期（复用 CORE-TASK-039 新预留用的那段逻辑与它的出错处理）。
      balance_rows 与钩子都在 app/services/sale_commits.py 里实现，由每个请求一个的对象记下最近一次算出的 SKU 集合：集合在 balance_rows 里算出并记下（CORE-TASK-043 重做时重新算出、覆盖），钩子用记下的集合关单，
      命令从同一个对象取它（CORE-TASK-046、047 判“合并去向不在开事务前处理过的 SKU 里”要用）；app/api/sale_commits.py 只把它们交给 run_idempotent。
      二，事务里照 5.7 第 1–4 步：普通读按 payment_ref 查；FOR UPDATE 按 order_ref 读预留行；FOR SHARE 读订单行后比对行集（mismatched_line_refs）；按 commit_decision 分支——
      COMMIT 先 FOR SHARE 读池行，每行一条 SALE_COMMIT（source_type sale_commit、source_ref order_ref、occurred_at 取请求的 paid_at、reason_code 用 commit_reason_code），
      订单行 committed_qty 设为 quantity，预留改为 committed 并记 payment_ref、paid_at、commit_request_hash、committed_at、commit_ 一组列与 closed_at（确认时间），late 为假，reservation_id 为 null 时 fault_mode 为真；
      ANSWER_EXISTING 按第 1 步回答；STATE_CONFLICT 与 PAYMENT_REF_CONFLICT 为 409 STATE_CONFLICT（details 带表示里的状态，后者加 reason payment_ref）。写 payment_ref 撞唯一约束时抛 RedoCommand。
      三，LATE 与 EXPIRE_THEN_LATE（CORE-TASK-045 实现），以及没有预留且 reservation_id 为 null（故障补交新建，CORE-TASK-047 实现）：本任务先返回 503 UNAVAILABLE，不保存。
      四，app/services/reservations.py 的表示加 5.7 的字段（payment_ref、paid_at、committed_at、late、fault_mode、review_closed_at），预留查询与本命令都返回；
      tests/integration/test_reservations_api.py 里核对表示字段集合的常量相应加上这六个字段，该文件其余断言不动。
      若 CORE-TASK-039 把新预留的先关到期写在 app/api/reservations.py 或它的测试写死了表示字段集合、直接构造 ReservationRecord，本任务只为复用把那段提成函数（放进 app/services/reservations.py，服务层不反向引用接口层）、只为新字段改字段集合与构造参数，其余不动。
      合并即部署：PR 正文写明 044 合并后到 046 合并前，晚到确认与故障补交返回 503、报业务拒绝前还不重查业务引用（过渡状态，网店尚未接入）。
      明确不做：晚到确认与待审（CORE-TASK-045）；报业务拒绝前重查业务引用与合并去向变化的重做（CORE-TASK-046）；故障补交新建（CORE-TASK-047）；待审结案（CORE-TASK-048）。
