  - id: CORE-TASK-114
    title: 新增令牌加密主密钥与告警机器人的配置，经 compose 的 secrets 文件注入
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 2、8、9 节与契约 docs/CONTRACT_V1.md 0.22 的 8.6 第 6 条：令牌加密主密钥与 Telegram 机器人令牌经 Docker Compose 的 secrets 文件注入，不进库、不进 Git 与日志（同 ai_billing_hub 的 ADR-0004）（工作包 P4a 的配置部分）。
      一，app/config.py 的 Settings 加 token_key_file（CORE_TOKEN_KEY_FILE，容器里的路径，默认为 compose 文件型 secret 在容器里的默认挂载目录下的 core_token_key）、telegram_token_file（CORE_TELEGRAM_TOKEN_FILE，默认为同一目录下的 core_telegram_token）、telegram_chat_id（CORE_TELEGRAM_CHAT_ID，默认空；不空时只许可选的负号加 1 到 20 位数字）。
      二，新模块 app/services/platform_config.py 的 load_platform_secrets(settings) 读两个文件，返回不可变的 PlatformSecrets(token_key, telegram_token, telegram_chat_id)：文件不存在或内容为空表示未配置（compose 在没配宿主机文件时挂进 Linux 的空设备，见四），对应项为 None；主密钥用 CORE-TASK-111 的 parse_master_key 解；Telegram 令牌去掉末尾换行后只许 1 到 128 个可打印 ASCII 非空白字符。文件存在却读不出或不合格、或 Telegram 令牌与 chat_id 只配了其中一个时报 ValueError，消息只写键名、不写内容。
      三，app/main.py 的 create_app 只在后台开关为真时调它：不合格照现有的启动核对拒绝启动（退出码非 0、标准错误一行原因、不带内容）；结果放在 app.state.platform_secrets；开关为假时不读文件，app.state.platform_secrets 三项都为 None（Demo 不受影响）。未配置不拒绝启动（人工模式的 V1a 用不到平台令牌）：用到主密钥的授权与刷新、用到 Telegram 的推送由各自的任务写明未配置时的表现。启动时进程日志记一行主密钥与告警推送各自是否已配置，不记内容。
      四，docker-compose.yml：顶层 secrets 加 core_token_key 与 core_telegram_token，file 分别取 CORE_TOKEN_KEY_HOST_FILE 与 CORE_TELEGRAM_TOKEN_HOST_FILE（.env 的值），都写成带默认值的 compose 变量，默认取 Linux 的空设备（在 Linux 上文件型 secret 的源不存在会让容器创建失败；默认挂空设备，Demo 与还没配密钥的生产都照常起来，读出为空即未配置）；core_api 引用这两个 secret；environment 加 CORE_TELEGRAM_CHAT_ID（取 .env，默认空）。注释写明：宿主机文件归容器用户、权限 0400，不为了读文件把容器改回 root（compose 的文件型 secret 是绑定挂载，uid、gid、mode 只在 swarm 下生效）。.env.example 的这三项由登记 PR 写好，本任务不改。
      明确不做：用到主密钥与 Telegram 的服务（CORE-TASK-115、124）；部署脚本与运行手册（建宿主机文件是运维步骤）。
    status: ready
    depends_on:
      - CORE-TASK-111
      - CORE-TASK-109
    acceptance_criteria:
      - tests/integration/test_platform_config.py：两个文件都不存在、都为空、都是空设备时三项为 None；合格的主密钥与令牌读出；主密钥不合格、令牌含空白、只配了令牌没配 chat_id、只配了 chat_id 没配令牌都报 ValueError 且消息里不含文件内容
      - 同一测试文件：后台开关为真而主密钥文件不合格时 create_app 拒绝启动（照 tests/integration/test_instance_check.py 的写法验退出码与一行原因，原因里没有文件内容）；开关为假时不读这两个文件（文件不合格也照常启动），app.state.platform_secrets 三项为 None
      - tests/integration/test_deploy_scripts.py 加：compose 配置里两个 secret 的源在没设宿主机变量时都是空设备，core_api 引用它们，environment 里有 CORE_TELEGRAM_CHAT_ID
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI 与部署脚本；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
