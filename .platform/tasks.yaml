      二，在三个服务模块里“按业务引用返回原结果”的分支上调它，只限内容相同、返回原结果的分支（内容不同报 BUSINESS_REF_CONFLICT 的分支不调）：app/services/reservations.py 的 _answer_existing 返回原结果处；app/services/sale_commits.py 的 _answer_committed 与 _answer_by_payment_ref 返回原结果处；app/services/fulfilment.py 的 answer_existing_order_document 返回原结果处。这几个函数也被 rejudge 用，同样打标记。
