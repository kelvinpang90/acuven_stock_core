  - id: CORE-TASK-031
    title: 实现盘点单的开单、提交实数、取消与查询
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.10 的 6（盘点规则）、6.2、6.6 与 10 第 3、4 条，新建 app/api/counts.py 与 app/services/counts.py，在 app/main.py 挂路由。
      锁行用 CORE-TASK-026 的 app/services/stock.py，经 CORE-TASK-025 的执行器；差额用 CORE-TASK-001 的 count_deltas。
      一，开单 POST /v1/counts（counts.create）：stock.write，角色 stock_operator 或 stock_admin；正文 pool_id、count_ref（引用格式），可选 note；
      池授权按正文 pool_id。命令里：按租户与凭据的销售入口找 count_ref，已有时摘要相同返回 200 与当前表示、不同 409 BUSINESS_REF_CONFLICT 并记事件；
      池须为 live（409 POOL_NOT_LIVE）；写盘点单（前缀 cnt_，状态 open，存开单的 request_hash），返回 201 与表示；撞 count_ref 唯一约束或被业务拒绝时，
      照 CORE-TASK-026 的 with_document 的做法经 BusinessRefTaken 在新事务里重新判定一次。
      二，提交实数 POST /v1/counts/{count_id}/submit（counts.submit）：stock.write，角色 stock_operator 或 stock_admin；正文 skus 为 1 到 100 个
      sku_id、shelf_count、unsellable_count（批量数组，超过 413；两项实数 0 到 1000000；sku_id 重复 422）；池授权按盘点单所属的池
      （require_object_pool，404 COUNT_NOT_FOUND）；balance_rows 取盘点单的池与正文的 SKU。命令里先 FOR UPDATE 读盘点单行，不是 open 为 409 STATE_CONFLICT；
      require_skus_exist；盘点单的已有盘点行在盘点单行锁之后用普通读读（四个盘点单命令都以 CORE-TASK-025 的 read_committed 执行，普通读看得到最新提交；
      不用加锁读，它对还没有盘点行的单会锁住空范围的间隙，两张单的首次提交会互相等待而死锁）；升序锁余额行；require_not_merged（按契约 6.2 第 4 条，SKU 已合并先于本命令自己的规则）；
      提交后 SKU 总数超过 100 为 422（details.reason 为 count_sku_limit）；记快照与 count_deltas 算出的 d_shelf、d_u，
      连同实数、提交人、请求 ID、时间写入盘点行，已有的行整行替换；不写流水；返回 200 与表示。
      三，取消 POST /v1/counts/{count_id}/cancel（counts.cancel）：没有请求体；角色 stock_operator 或 stock_admin；池授权同提交。FOR UPDATE 读盘点单行，
      不是 open 为 409 STATE_CONFLICT；改为 cancelled 并记取消人；删除这张单的盘点行（契约 6：取消丢弃已提交的实数与快照；盘点行不是流水，
      没有落账，可以删）；不写流水；返回 200 与表示，lines 为空数组。
      四，查询 GET /v1/counts/{count_id} 与 GET /v1/counts?count_ref=（stock.read）：前者不存在或属于别的租户 404 COUNT_NOT_FOUND，后者记 cross_tenant；
      后者按凭据的销售入口查，返回 counts 数组（0 或 1 个），count_ref 必填且只出现一次，未知参数 422；凭据没有销售入口或入口已停用时
      它不可能有自己的 count_ref，返回空数组；count_ref 不合第 1 节的引用格式为 422。
      五，表示的键固定且都出现：count_id、count_ref、pool_id、status、note、created_at、confirmed_at、reason_code、confirm_note、cancelled_at、lines；
      lines 按 sku_id 升序，每行 sku_id、shelf_count、unsellable_count、snapshot（四个量与 balance_version）、submitted_at、d_shelf、d_u、entry_id。
      表示函数写成可复用的，供下一任务的确认使用：它收盘点单行与盘点行，不自己读库；写命令把锁内读到的行加上本次的改动传进去，
      查询接口用普通读读出后传进去。
      明确不做：确认落账（下一任务）。
    status: done
    depends_on:
      - CORE-TASK-026
    acceptance_criteria:
      - 接口放 app/api/counts.py，数据库读写放 app/services/counts.py，在 app/main.py 挂路由；已有测试照常通过
      - 集成测试在真 MySQL 上验证开单：201 与表示；换键同内容得 200 与当前表示（含已取消的单）、不同内容 409 BUSINESS_REF_CONFLICT 并记事件；池为 initializing 得 409 POOL_NOT_LIVE；两个不同键并发用同一 count_ref 只开一张单
      - 集成测试验证提交：快照等于提交时的账面、d_shelf 与 d_u 按契约 6 的公式；只列部分 SKU 时其他行保留，重新提交只替换所列 SKU；还没有余额行的 SKU 先预建再记全零快照；已合并的 SKU 得 409 SKU_MERGED；总数超过 100 得 422 且原有行不变
      - 集成测试验证状态：对已取消的单提交与取消得 409 STATE_CONFLICT；取消后 count_ref 仍占用、盘点行已删除、表示的 lines 为空；取消不写流水
      - 集成测试验证并发：同一张单的提交与取消并发时串行执行，不会出现取消之后又写入实数
      - 集成测试验证查询与授权：两种查询的结果一致；盘点单不存在与属于别的租户得完全相同的 404 COUNT_NOT_FOUND 并记 cross_tenant；缺 stock.write 403；缺操作者头 400；按 count_ref 查不到时为空数组
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试由 PR 的必需 CI 检查 integration 执行并通过
