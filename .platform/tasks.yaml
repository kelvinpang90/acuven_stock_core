  - id: CORE-TASK-086
    title: 平台事件执行器骨架：写收件箱、按订单加锁排序、一个事件一笔事务，并处理新订单
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 5.10 存放、处理顺序第 1 到 4、7、8 步与“每个动作调哪个命令体”的 created 一行，3.1 下单扣配额（工作包 P2d1）。新服务模块 app/services/platform_events.py；规则调 CORE-TASK-082、083 的纯函数，不在这里重写。只有函数，不挂作业、不挂接口（作业与 webhook 是第 4 组的任务），所以生产上还不会运行。
      一，record_auto_event(engine, tenant_id, channel_id, platform_order_id, platform_line_id, action, event_key, source, payload)：source 只收 webhook、pull，action 不收 return_received（它只由后台登记）；先用 parse_payload 校验（不合格 ValueError，不写）；入口不是这个租户的 platform 入口、或它的连接 mode 为 manual 时不写（契约 5.10 引用格式第 1 条），返回假；payload 带 package_id、refund_id 或 return_id 时，存进去的 event_key 是传入的 event_key 加竖线再加这个单据 ID（超过 128 个字符时换成 h 加它的 SHA-256 前 32 位）：补拉用状态时间作 event_key，同一行同一时刻的两个包裹或两次取消否则会撞去重键、后一个被静默丢掉（是补的）。否则用单独的短事务 INSERT … ON DUPLICATE KEY UPDATE event_row_id = event_row_id 写一行（event_row_id 用 new_id 的 pev 前缀，credential_id 为这个租户的 system 主体，received_at 为数据库时间），重复送达什么也不改，返回真。
      二，orders_with_pending_events(engine, limit)：按 platform_events 的 (applied_at, tenant_id, channel_id) 索引找出有未处理事件的订单（tenant_id、channel_id、platform_order_id），供以后的作业用。
      三，process_order(engine, tenant_id, channel_id, platform_order_id, *, reservation_ttl_seconds)：处理一个订单这一轮的事件（预留有效期由调用方传入，以后作业从 Settings 取，执行器不自己读配置），返回处理了几个、停在哪个事件与原因。
      第 1 步：在没有打开事务的连接上 GET_LOCK(order_lock_name(…), 5)，取不到或出错就什么也不做、返回“锁忙”。
      第 2 步：取这个订单全部未处理的事件，按 sort_key 排序，逐个处理，每个事件一笔事务。
      第 3 步（每个事件开事务之前）：解析这个事件涉及的订单行的 SKU（已有平台订单行的取已定下的 sku_id；created 的各行按当前 active 的平台商品，普通读）；照现有余额行预建的写法用短事务预建 (tenant_id, pool_id, sku_id) 的余额行、pool_allocations 行，以及这个池全部 platform 入口在这些 SKU 上的 channel_allocations 行（按 sku_id、再按 channel_id 升序）；把会话隔离级别设为 READ COMMITTED，再调 app/services/reservations.py 的 close_due_before_reserving 关这些 SKU 上已到期的预留（它要求连接已是 READ COMMITTED，同 HTTP 执行器的先后）。
      第 4 步：开事务，按契约 5.10 第 4 步的锁序加锁，用不到的层跳过：收件箱行 FOR UPDATE（applied_at 已有值就提交空事务，下一个）→ 平台订单行 FOR UPDATE（没有就留到动作里插入）→ 本任务的 created 只再锁这个入口在这些 SKU 上的 channel_allocations 行（按 sku_id 升序 FOR UPDATE）→ 平台商品 FOR SHARE 重新解析 created 各行的 SKU，与第 3 步不同就回滚、从第 3 步重做一次，再不同就回滚、这个订单这一轮停下。然后 classify：ignored 记 ignored、不改任何量；created 的 apply 照下面第四条；本任务还没有处理办法的情形（其余动作，以及 missing_prior、blocked、attention）回滚、这个订单这一轮停下、不改任何东西（CORE-TASK-087 到 089 逐个补上）。
      第 7 步：写收件箱行的 applied_at（数据库时间）与 result，与改动一起提交。这一轮结束（处理完或停下）时在同一连接上 RELEASE_ALL_LOCKS() 并用 SET SESSION transaction_isolation = DEFAULT 复原隔离级别，出错就作废这个连接（照 app/services/idempotency.py 的 _release_locks）。
      第 8 步：数据库错误或程序异常时整笔回滚，收件箱行仍未处理，这个订单这一轮停下；异常不向外抛，记一行进程日志（不含 payload），返回原因。
      四，created：插入平台订单（new_id 的 pfo 前缀，order_ref 由 order_ref(入口的 platform, platform_shop_id, platform_order_id) 得出，stage unpaid）与各行（sku_id 取重新解析的结果，找不到为空）。按 platform_line_id 升序逐行，对有 SKU 的行用 take_quota 从这个入口这个 SKU 的 quota 扣走、记 quota_taken，pending 加这一行的件数。有行找不到生效平台商品时订单设为 held、attention 为 unmapped、attention_code 为空，那些行不计 pending、不扣配额，result 记 held；否则 result 记 applied。
      测试要在第 3、4 步之间插入动作、让某条语句失败：模块里设一个默认为空的模块级钩子 _between_prepare_and_lock(connection)，第 3 步之后、开事务之前调它，测试用 monkeypatch 设它；失败用 monkeypatch 替换本模块里写平台订单的那个函数。
      五，测试辅助模块 tests/integration/platform_fixtures.py：建租户、池、SKU、platform 与 backoffice 入口（直接插行，含 system 主体与连接行）、平台商品，提交；purge_tenant(engine, tenant_id) 在一个连接上 SET SESSION foreign_key_checks = 0，删掉这个租户在所有带 tenant_id 列的表里的行，再设回 1（use_alter 的外键让按表排序删不干净，例如池行上的 went_live_credential_id；只给测试用）。之后的平台事件任务复用它。
      明确不做：取消、待发货、交运、退货的处理（CORE-TASK-087 到 089）；补拉与退避（087）；作业、webhook、告警（第 4 组）；后台的人工登记（第 3 组）。
    status: ready
    depends_on:
      - CORE-TASK-081
      - CORE-TASK-082
      - CORE-TASK-083
    acceptance_criteria:
      - 新增 app/services/platform_events.py、tests/integration/platform_fixtures.py 与 tests/integration/test_platform_events_created.py，不改别的文件；每个测试用自己的租户，在 finally 里 purge_tenant，会话结束时 migrated_engine 降到 base 照常成功
      - 契约 5.10 例子第 1 种的前一半：created 2 件、Q 为 10 时 Q 变 8、pending 变 2、quota_taken 2、stage unpaid、result applied；契约 3.1 例子一第 8 步：16 件而 Q 为 14 时 Q 变 0、quota_taken 14、pending 加 16
      - 一行找不到生效平台商品：订单 held、attention unmapped，那一行 sku_id 为空、不计 pending、不扣配额，别的行照常；result held
      - 例子第 2 种：同一去重键 record_auto_event 两次只有一行；同一事件处理之后再 process_order 不改任何量；例子第 3 种的 created 版：pull 来源以另一个 event_key 再写一个 created，处理得 ignored、不改任何量
      - 连接为 manual 时 record_auto_event 返回假、不写；source 为 manual、payload 不合格、入口不是 platform 时不写
      - 另一个连接先持有这个订单的命名锁时 process_order 返回锁忙、什么也不改；同一订单两个事件按平台时间先后处理；处理中数据库出错（测试里让一条语句失败）时整笔回滚、收件箱行仍未处理
      - 第 3 步与第 4 步之间有人改挂了平台商品（测试用钩子在两步之间提交一次改挂）时，created 按改挂后的 SKU 记账；连续两次都变时这一轮停下、什么也不改；本任务未处理的动作（例如 ready_to_ship）让这一轮停在它这里、它和它之后的事件都仍未处理；一轮结束后连接的隔离级别复原、不再持有命名锁
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
