  - id: CORE-TASK-111
    title: 平台授权规则写成纯函数：令牌加解密、主密钥、授权 state、能力矩阵、作业锁名与退避
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 2 节（state、令牌加密、能力矩阵）、第 3 节（补拉退避）、第 4 节（发布失败退避）、第 8 节（告警种类）与契约 docs/CONTRACT_V1.md 0.22 的 8.6 第 4 条（作业锁名）（工作包 P4a 的规则部分）。新模块 app/domain/platform_auth.py，纯函数：不碰数据库、时钟、网络与文件，时间与随机数由调用方传入。单元测试 tests/unit/test_platform_auth.py（unittest）。
      一，主密钥：parse_master_key(text) 收 secrets 文件的内容：去掉末尾的换行后为空返回 None（未配置）；否则必须是标准 base64、解出恰好 32 字节，返回这 32 字节；其余报 ValueError，消息里不带输入内容。
      二，令牌加解密（AES-256-GCM，用 cryptography 的 AESGCM）：encrypt_token(key, nonce, plaintext, *, tenant_id, channel_id, kind) 返回 版本字节 0x01、12 字节 nonce、密文与 16 字节标签依次拼成的 bytes；nonce 必须恰好 12 字节（调用方每次用 secrets.token_bytes(12) 新取，设计“每次加密一个新的 12 字节随机数”）；kind 取 access、refresh；关联数据为 tenant_id、channel_id、kind 三项以换行连接的 UTF-8（补的：密文挪到别的入口或别的令牌种类上解不开）；结果长于 4096 字节（CORE-TASK-081 的列宽）报 ValueError。decrypt_token(key, blob, *, tenant_id, channel_id, kind) 解出原文；版本不对、长度不够、标签或关联数据不符都报 TokenDecryptError，消息里不含密文与原文。
      三，授权 state：STATE_TTL 为 10 分钟；derive_state(key, oauth_state_id) 为 HMAC-SHA256（密钥为主密钥，消息为字面量 oauth_state 加换行再加 oauth_state_id 的 UTF-8）的 32 字节结果编成 URL 安全、无填充的 base64 文本（补的：state 由主密钥与行 ID 现算，库里与幂等记录里都只有行 ID 与哈希，不存原文，契约 3.2；oauth_state_id 是新 ID 的随机部分，所以 state 仍不可猜）；state_hash(text) 为 UTF-8 的 SHA-256 小写十六进制；check_state(row, *, platform, now) 判回调时读到的 state 行（row 为 None 或带 platform、expires_at、used_at 的只读对象），按先后只报第一个：没有行 unknown、used_at 非空 used、now 不早于 expires_at expired、platform 不一致 platform_mismatch，否则 ok。
      四，能力矩阵：CAPABILITIES 为 read_models、read_stock、write_stock、read_orders、webhook 五项，取值 available、pending、unavailable；normalize_capabilities(value) 收一个字典：只许这五个键、值只许这三个，缺的键补 unavailable，返回五个键齐全的新字典，不合格报 ValueError。auto_sync_allowed(mode, status, capabilities)：mode 为 auto、status 为 active、write_stock 与 read_orders 都为 available 时为真（设计“缺写库存或缺订单事件时不显示自动同步”；补拉要 read_orders，webhook 不是必需）。pull_allowed(mode, status, capabilities)：auto、active、read_orders 为 available。readback_allowed(mode, status, capabilities)：auto、active、read_stock 为 available。
      五，作业：PLATFORM_JOBS 列出第 4 组的作业名 platform-token-refresh、platform-oauth-state-purge、platform-inbox、platform-order-pull、platform-publish、platform-readback、platform-reconcile、platform-alert-notify；job_lock_name(database, job) 为 database、字面量 platform_job、job 三项以换行连接后 UTF-8 的 SHA-256 小写十六进制（同 CORE-TASK-083 order_lock_name 的拼法，锁名照契约 7.1 带数据库名）；job 不在 PLATFORM_JOBS 里报 ValueError。
      六，退避：backoff_minutes(attempts) 为 min(2 的 attempts 次方, 60)，attempts 为 0 得 1，负数报 ValueError（补拉：1 分钟起翻倍、最长 60 分钟；发布失败的重试照同一条，设计第 4 节只写“退避重试”没写数，是补的）。
      七，告警种类：ALERT_KINDS 为 auth_failed、core_rejected、inbox_stuck、publish_failed、readback_mismatch、over_allocated、reconcile_discrepancy、invariant_violation（设计第 8 节的严重异常；人工核对中发现的冲突由记核对的人当场处理，V1 不自动发告警，登记 PR 列为补的规则）。
      八，作业周期（设计只写“定时”“每隔几秒”等，数是补的，集中写在这里，之后的任务照用）：JOB_INTERVALS 为 platform-token-refresh 5 分钟、platform-oauth-state-purge 1 小时、platform-inbox 5 秒、platform-order-pull 2 分钟、platform-publish 1 分钟、platform-readback 30 分钟、platform-reconcile 1 分钟（每轮先做管理员请求的对账，定时对账每 24 小时一次，见 CORE-TASK-123）、platform-alert-notify 60 秒；REFRESH_AHEAD 为 30 分钟（访问令牌到期前这么久就刷新）。之后的任务只用这里的值。
      另：pyproject.toml 的 dependencies 显式加一行 cryptography（下界 42）。它现在随 pymysql[rsa] 间接装上，本模块直接 import，显式列出免得以后换驱动时丢了；不新装依赖。
      明确不做：读文件、读写数据库、调平台（CORE-TASK-114、115）。
    status: ready
    depends_on: []
    acceptance_criteria:
      - 新增 app/domain/platform_auth.py 与 tests/unit/test_platform_auth.py，pyproject.toml 只加 cryptography 这一行；测试用 ast 读模块的 import，只有标准库里不做 I/O 的模块（base64、hashlib、dataclasses、datetime、typing 之类）、cryptography 的 AESGCM 与 app.domain 里的纯模块
      - 加解密往返得原文；同一明文用两个 nonce 得不同密文；改密文任一字节、换 tenant_id、channel_id 或 kind、换密钥都报 TokenDecryptError，消息里没有密文与原文；nonce 不是 12 字节、kind 不认识报 ValueError
      - 主密钥：32 字节的 base64 带或不带末尾换行都解出同样的 32 字节；空串与只有换行返回 None；31 字节、33 字节与非 base64 报 ValueError，消息里不含输入
      - derive_state 同密钥同行 ID 得同一文本、换密钥或换行 ID 得不同文本、长 43 且只有 URL 安全字符；check_state 的五种结果各一条用例；恰好在 expires_at 那一刻为 expired；同时已用过且已过期时报 used
      - 能力矩阵：缺键补 unavailable；多余的键与非法的值报 ValueError；auto_sync_allowed、pull_allowed、readback_allowed 的每个条件各有一条只违反它的用例，全满足为真
      - job_lock_name 长 64、同输入同输出、作业名不认识报 ValueError；backoff_minutes 对 0、1、5、6、10 分别得 1、2、32、60、60
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
    allowed_change_paths:
      - app/domain/platform_auth.py
      - tests/unit/test_platform_auth.py
      - pyproject.toml
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-112
    title: 平台适配器协议、模拟适配器与合同测试夹具，出站请求的日志与异常脱敏
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 10 节（适配器协议、模拟适配器与合同测试夹具）、第 9 节出站请求脱敏与第 15 节相应的验收（工作包 P4b）。新包 app/platforms/（__init__.py、base.py、mock.py、registry.py），只用标准库；单元测试。
      一，base.py 定义 PlatformAdapter 协议（typing.Protocol）。设计第 10 节的七个动作，加授权的两个（设计第 2 节要“在后端用授权码换令牌”、发起授权要拼平台的授权地址，第 10 节没列，是补的）：authorize_url(state) 返回平台授权页的地址（回调地址由适配器自己的配置给，随真实适配器的任务定）；exchange_code(code, extra) 返回 TokenGrant，extra 是回调查询串里 code 与 state 以外的参数（字典，平台可能在回调里带店铺 ID 等，换令牌要用）；refresh_token(shop_id, refresh_token) 返回 TokenGrant；以下各动作的第一个参数都是 ShopAuth（shop_id 与 access_token，平台调用多要店铺 ID）：list_models(auth) 返回 PlatformModel 列表；read_stock(auth, models) 返回以 (item_id, model_id) 为键的件数字典；write_stock(auth, item_id, model_id, quantity) 写绝对值，返回 WriteResult；pull_orders(auth, updated_from, updated_to, page_token) 返回 OrderPage；read_order(auth, platform_order_id) 返回 OrderSnapshot 或 None（平台上没有）；parse_webhook(headers, body) 先验签再解析，返回 WebhookBatch，验签不过抛 SignatureInvalid。
      数据类都是 frozen：ShopAuth（shop_id、access_token）；TokenGrant（access_token、access_expires_at、refresh_token、refresh_expires_at、shop_id、capabilities 字典）；PlatformModel（item_id、model_id、name）；WriteResult（outcome 取 confirmed、unsupported、platform_controlled，confirmed_quantity 可空）；OrderPage（orders、next_page_token 可空）；OrderSnapshot（platform_order_id、shop_id、updated_at（平台记录的订单最近更新时间；pull_orders 返回 updated_from ≤ updated_at < updated_to 的订单，左闭右开）、各状态的平台时间（created、ready_to_ship、return_requested，没有为空）、lines（platform_line_id、platform_item_id、platform_model_id、quantity、cancelled_total）、cancellations（每次取消一项：refund_id 可空、平台时间、各行的 platform_line_id、这一次取消的件数 quantity 与这一次之后的累计 cancelled_total；CORE-TASK-083 的 payload 带 refund_id 时要每行这一次的件数）、packages（package_id、平台时间、各行件数））；WebhookBatch（shop_id、events：每个是 platform_order_id、platform_line_id、action、event_key（平台事件 ID）、payload（CORE-TASK-083 parse_payload 的形状））。时间都是不带时区的 UTC datetime。退货收到不在快照与 webhook 里（return_received 只由后台登记，CORE-TASK-086）。
      异常：PlatformError 基类带 code（平台错误码，可空）；子类 Rejected（明确失败）、Unknown（结果未知：超时、连接中断）、RateLimited（带 retry_after_seconds）、AuthRevoked（撤权）、AuthFailed（令牌失效或 scope 不足）、SignatureInvalid。异常的 str 只含类名与 code。
      二，出站脱敏（设计第 9 节）：describe_call(method, url, status) 只留方法、主机之后的路径与状态码（去掉 scheme、用户信息、主机、端口、查询串与片段）；log_call(logger, method, url, status) 用它记一行；describe_error(exc) 只给类名与平台错误码。适配器只经这几个函数记日志、只抛上面的异常（底层异常不带 cause 往外传：raise … from None）。
      三，mock.py 的 MockPlatform：内存里的一个平台与一个店铺，实现协议的九个动作；构造参数给 platform 名、店铺 ID、webhook 的 HMAC-SHA256 测试密钥；测试可以给某个动作排下一次的结果（成功、Rejected、Unknown、RateLimited、AuthRevoked、AuthFailed），可以设平台上的规格、库存与订单快照；它把访问令牌放进查询串里拼出完整 URL 再经 log_call 记日志，失败时先抛一个 str 里带这个 URL 的底层异常、再包装成上面的异常（用来验脱敏）；记下收到的每次写库存（规格与件数），供之后作业任务的测试断言。
      四，registry.py 的 build_adapters(settings) 返回 {platform: adapter}；V1 先返回空字典（真实适配器随平台获批的任务加，工作包 P4f、P4g）。之后的接口与作业都从 app.state.platform_adapters 取，测试换成模拟适配器；某个平台没有适配器时怎样表现由用到它的任务写明。
      五，合同测试夹具 tests/unit/platform_contract.py：PlatformContractTests（unittest 的 mixin），子类给出 make_adapter 与“让下一次调用得到某种结果”的钩子；覆盖九个动作各自的成功、明确失败、结果未知、限流、撤权（设计第 10 节）；令牌在查询串里时，用 assertLogs 收到的全部日志与异常的 str 里都没有访问令牌、查询串与请求体；验签失败抛 SignatureInvalid；写库存是绝对值（同一个数连写两次，平台上就是这个数）。tests/unit/test_mock_platform.py 用模拟适配器跑这套夹具；真实适配器以后照同一套跑。
      明确不做：真实平台的适配器（P4f、P4g，等平台获批）；作业与接口（CORE-TASK-115 起）。
    status: ready
    depends_on:
      - CORE-TASK-083
    acceptance_criteria:
      - 新增文件只限 allowed_change_paths；用 ast 读 app/platforms 下各模块的 import，只有标准库与 app.domain 里的纯模块；测试由 tests.unit 执行
      - 合同夹具对模拟适配器全绿：九个动作各有成功一条，可失败的动作各有明确失败、结果未知、限流、撤权各一条
      - describe_call 对带用户信息、端口、查询串与片段的地址只留方法、路径与状态码；模拟平台每种失败时 assertLogs 收到的日志与异常的 str 里都没有访问令牌、查询串与请求体
      - 每种异常的 str 只含类名与 code；webhook 签名不对、缺签名头都抛 SignatureInvalid
      - build_adapters 现在返回空字典
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
    allowed_change_paths:
      - app/platforms/__init__.py
      - app/platforms/base.py
      - app/platforms/mock.py
      - app/platforms/registry.py
      - tests/unit/platform_contract.py
      - tests/unit/test_mock_platform.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-113
    title: 补拉拆事件的规则写成纯函数：订单快照拆成通用动作，丢掉接管点之前的，算补拉区间
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 3 节补拉、6.2 第 5 条接管点、第 10 节状态对照与契约 docs/CONTRACT_V1.md 0.22 的 5.10（工作包 P4c 的规则部分）。新模块 app/domain/platform_pull.py，纯函数（可以 import CORE-TASK-112 的 app.platforms.base 里的数据类，它只用标准库），单元测试 tests/unit/test_platform_pull.py。
      一，snapshot_events(snapshot) 把一个 OrderSnapshot 按它当前的状态拆成通用动作的列表，每个是 (platform_line_id, action, event_key, payload)：created（订单有 created 时间就拆，payload 的 lines 为快照的各行）；ready_to_ship（有进入待发货的时间就拆）；每个取消一个 cancelled（快照的 cancellations 逐个：payload 的各行都带 cancelled_total；带 refund_id 的另带 refund_id 与各行这一次的 quantity，不带的不带 quantity，照 CORE-TASK-083 的形状）；每个包裹一个 shipped（package_id 与各行件数）；有退货申请时间就拆 return_requested。platform_line_id 照 CORE-TASK-086、087 对各动作的约定（订单级动作为空串）。event_key 用平台记录的这个状态的时间（设计第 3 节），写成 RFC 3339 微秒 Z 文本；payload 的 platform_time 取同一个时间。拼单据 ID 由 CORE-TASK-086 的 record_auto_event 做，这里不拼。拆出的每个 payload 都用 CORE-TASK-083 的 parse_payload 校验，不合格报 ValueError（是适配器的缺陷，调用方记日志、跳过这个订单）。快照缺某个状态的时间时这个动作不拆（补的：没有时间就没有稳定的 event_key，下一次补拉再看）。
      二，drop_before_takeover(events, takeover_at)：takeover_at 为空时原样返回；否则丢掉 platform_time 早于 takeover_at 的动作，等于的保留（设计 6.2 第 5 条：平台记录的时间早于接管点的事件不再处理，适配器拆动作时就丢掉）。
      三，pull_window(cursor, takeover_at, now, *, lag, max_span)：补拉区间的起点为 cursor；cursor 为空时取 takeover_at；两者都空时取 now 减 12 小时（人工核对的逾期上限，契约 3.2；补的）。终点为 now 减 lag（默认 1 分钟，免得拉到平台还没写完的更新，补的）；区间长于 max_span（默认 24 小时）时终点截到起点加 max_span，剩下的下一轮再拉。返回 (起点, 终点, truncated)，truncated 表示被 max_span 截短；起点不早于终点时返回 None。时间都是不带时区的 UTC datetime，带时区的报 ValueError。
      明确不做：调平台、写收件箱、推游标（CORE-TASK-118）。
    status: ready
    depends_on:
      - CORE-TASK-112
    acceptance_criteria:
