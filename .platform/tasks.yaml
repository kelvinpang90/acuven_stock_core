  - id: CORE-TASK-017
    title: 实现新建商品与加规格的目录写命令
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.7 的 2.2、2.6 第 1、2、3 条与 2.7，在 CORE-TASK-016 的 app/api/catalog.py 与 app/services/catalog.py 上加 POST /v1/products（操作类型 products.create）
      与 POST /v1/products/{product_id}/skus（skus.create）。表用 CORE-TASK-012 的，规则用 CORE-TASK-013 的纯函数，经 run_idempotent 并声明 CORE-TASK-015 的目录写锁，返回用 CORE-TASK-016 的表示函数。
      服务层的建 SKU（SKU 行、归属行、变更记录）与写变更记录的函数写成可复用的，供之后的修改与批量导入任务调用（导入建的变更记录带 import_id）。
      一，共同：authorize 要求 catalog.write 且 write 为真，角色要求 catalog_admin，有请求体；变更记录的 credential_id、actor_ref、actor_role、request_id、idempotency_key 取自本请求，
      reason 取正文规范化后的值，version 为对象改动后的版本，changes 按 CORE-TASK-013 第三条。
      二，新建商品：正文 name、skus（批量数组，1 到 100 个，超过 100 为 413，空数组 422）、可选 reason；每个 SKU 对象含 sku_code、name，可带 barcode、reference_price；未知字段 422。
      字段不合规 422（details 指出字段位置）；同一请求里 sku_code 比较键重复或非空条码比较键重复 422。这两类 422 都在契约 8.1 第 7 步的请求体校验里判（取锁之前，不存幂等记录，改正后可同键重发）。与现有目录的冲突：逐个 SKU 按 CORE-TASK-013 的编码归属判定查归属表、按比较键查现有 SKU 的当前条码，
      收集全部冲突，有冲突时 409（顶层错误码与 details.conflicts 按 CORE-TASK-013 第五条），一个都不建。否则建商品（前缀 prd_，active，版本 1）与各 SKU（前缀 sku_，active，版本 1，
      先插 SKU 行再插归属行），写一条 product_created，再按请求顺序每个 SKU 写一条 sku_created，返回 201 与商品的表示。
      三，加规格：正文是一个 SKU 对象，另可带 reason；商品不存在 404 PRODUCT_NOT_FOUND，属于别的租户时响应完全相同并经执行器登记一条 cross_tenant 安全事件；
      商品 inactive 时照样可以加；不改商品的版本；冲突同上（冲突项不带 index）；写一条 sku_created，返回 201 与 SKU 的表示。
      四，万一写入仍撞上唯一约束（冲突查询之后才被占用等），按撞上的约束报 409、不返回 500：先插 SKU 行，撞 skus 的编码唯一约束为 SKU_CODE_TAKEN（是别的 SKU 的当前编码）；
      SKU 行插入成功而撞归属表主键为 SKU_CODE_RETIRED（编码已登记、但不是任何 SKU 的当前编码）；撞条码唯一约束为 BARCODE_TAKEN。这种 409 的 details.conflicts 只列撞上的那一项
      （field、value、code，新建商品时带该 SKU 在 skus 里的 index），不再补查其他冲突。
      明确不做：修改、停用、重新启用（下一任务）、批量导入、变更流接口、预留对商品状态的检查（随预留任务做）。
    status: done
