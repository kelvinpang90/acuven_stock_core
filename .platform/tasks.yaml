      - tests/unit/test_service_auth.py
      - tests/integration/conftest.py
      - tests/integration/test_cli_service_auth.py
      - README.md
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-011
    title: 实现安全事件满一年的定时清理
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.6 的 7.1 保留期与 7.2（安全日志保留 1 年；满 1 年的事件整批删除，由 Core 自己的定时任务用 Core 的数据库账号执行），
      给 Core 加一个进程内的定时任务机制和第一项定时任务。之后的预留到期扫描（契约 5.2 第 4 条）复用同一机制。
      一，清理函数，放 app/services/security_events.py：删除 occurred_at 不晚于数据库当前时间减 1 年的安全事件（按数据库时间，MySQL 的 INTERVAL 1 YEAR，恰好满 1 年即删除）；
      每批最多删 1000 行、每批一个短事务，直到某批不足 1000 行为止；返回删除总数并写一行进程日志。只删 security_events，不碰别的表。
      清理函数接受一个数据库连接（定时任务从引擎取一个传入），各批都在这个连接上执行，测试因此可以在同一连接上用 SET TIMESTAMP 冻结数据库时间来验证边界。
      清理函数被调用时，传入的连接上不能有打开的事务（与 record_security_event 的约定一致）。
      清理的结果行与定时机制记的异常要在生产上能看到：沿用 app/services/idempotency.py 的先例，写到已挂处理器的 app.api 日志器（或它的子日志器），保证 INFO 级别能输出；
      不给 app.services.security_events 或其他日志器另挂处理器，因为命令行也 import 这个模块，挂上会让命令行把 record_security_event 记的堆栈打到标准错误；本任务不改变命令行的任何输出。
      例：数据库时间为某年 11 月 13 日 12:00:00 时，前一年 11 月 13 日 12:00:00 的事件删除，12:00:01 的保留。
      二，定时机制，放新文件 app/services/periodic.py：一个守护线程按固定间隔反复执行一个函数；启动后先等一段时间再跑第一次（默认 60 秒），之后每隔一段时间跑一次（默认 24 小时）；
      函数抛出异常时记进程日志，线程不退出，下个周期照常；停止时通知线程并等它结束（带超时）。间隔与首次等待由调用代码传入，测试可以传很短的值；不新增配置项。
      三，接入：create_app 在数据库已配置时用 FastAPI 的 lifespan 启动清理任务、在应用关闭时停止；数据库未配置时不启动。uvicorn 单进程运行（Dockerfile 的启动命令不变）；
      将来多个进程同时清理也只是重复删除同一批，结果不变。
      明确不做：别的数据的保留期（流水与幂等记录永久保留）、预留到期扫描、新的配置项、手工清理的命令行。
    status: ready
    depends_on: []
    acceptance_criteria:
      - 清理函数放 app/services/security_events.py，定时机制放 app/services/periodic.py，在 app/main.py 接入；healthz 与 readyz 的行为不变
      - 集成测试在真 MySQL 上按 purpose 第一条的例子验证边界：在传给清理函数的连接上用 SET TIMESTAMP 冻结数据库时间，构造恰好满 1 年、差 1 秒满 1 年与刚写入的事件，只删恰好满 1 年及更早的；测试结束时在该连接上执行 SET TIMESTAMP = DEFAULT 或作废该连接，冻结的时间不留给之后复用连接的测试；别的表的行不受影响
      - 集成测试验证分批：2500 条满 1 年的事件全部删除，返回总数 2500；每个测试结束时清掉自己造的事件，互不影响计数
      - 集成测试验证清理结果的日志行写到 app.api 日志器或它的子日志器，且 app.services.security_events 日志器没有被挂上处理器
      - 集成测试验证定时机制：传很短的间隔时函数被反复调用；函数抛出异常后下个周期照常调用且异常记了日志；停止后不再调用且线程已结束
      - 集成测试验证接入：数据库已配置时进入与退出应用的 lifespan（例如 with TestClient）会启动与停止清理任务，数据库未配置时不启动
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/periodic.py
      - app/services/security_events.py
      - app/main.py
      - tests/integration/test_security_event_purge.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true
