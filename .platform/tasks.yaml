  - id: CORE-TASK-100
    title: 后台的池列表、库存总览、改配额与配额变更记录接口
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 8.6 第 2 条的库存总览与配额两页、3.1 改配额（Q-102）、审计页的配额变更。工作包 P3e 的后一半。
      后台列表的分页规则（本任务定，之后的后台列表都照它；这是对契约 8.1“列表接口用不透明游标分页、游标绑定筛选条件”的偏离，只用于 /api/v1/admin 下的列表，登记 PR 列为补的规则请 Kelvin 认可；不沿用契约 2.5 的游标：那套游标绑定筛选条件、没有新记录时原样返回 after，是给调用方轮询用的）：limit 1 到 100、不带为 100；after 是上一页 next_cursor 的原样文本，即上一页最后一条的排序键，按列表的排序方向取严格在它之后的记录（升序取大于、倒序取小于；复合排序键按各列依次比较）；每次多读一条，有第 limit+1 条时 next_cursor 为这一页最后一条的排序键文本，否则为 null；游标不绑定筛选条件；after 格式不合格 422。每个列表写明排序键与游标文本的格式。
      后台接口的 ID 形状校验（本任务定，之后的后台接口里“格式按 ID 形状校验”都指它）：契约第 1 节的形状，即小写字母前缀、下划线、26 个 Crockford Base32 大写字符，总长不超过 32（app/domain/ids.py 的生成规则），不判前缀是哪种对象；在 app/services/admin_queries.py 提供 is_admin_id(value) 给之后的后台接口用。/v1 只做相等比较、不判形状，行为不变。
      一，POST /api/v1/admin/allocations：正文同 CORE-TASK-082 的 validate_allocation_request（pool_id、sku_id、expected_version、safety_stock、quotas、reason）；第 ⑥ 步只用宽松的模型做 JSON 对象解析（同一个解析函数，键不预先限定），形状校验由 090 的命令体调 validate_allocation_request 做（它要先知道池的 platform 入口）；pool_id 与 sku_id 在调执行器之前先判存在与格式（按上面的 ID 形状校验，不合格 422），再 backoffice_entry 判本租户与后台入口；角色 stock_admin；经 run_admin 调 CORE-TASK-090 的 update_allocations，operation 为 allocations.update，read_committed 为真，before_transaction 为 prepare_allocation_rows；响应与错误照 090。
      二，GET /api/v1/admin/pools/{pool_id}/stock-overview?after=&limit=：只读、不要求角色；pool_id 不合 ID 形状 422（先于查库），再按 backoffice_entry 判本租户（404 同上）。按 sku_id 升序列出这个池有余额行的 SKU，分页照上面的规则，排序键与游标为 sku_id（不是合格的 SKU ID 格式 422），响应 items 与 next_cursor。每项：sku_id、sku_code、SKU 的 status、四个量与 available（同 /v1 余额的表示）、safety_stock 与 allocation_version（没有 pool_allocations 行时 safety_stock 取契约 3.1 的默认值 2（字面量 2，即 CORE-TASK-080 列默认值与 prepare_allocation_rows 建行时用的同一个常量），allocation_version 为 0，即契约 3.1 行不存在时的 expected_version，页面可以直接拿它提交）、unallocated（用 CORE-TASK-082 的 unallocated 算，与 CORE-TASK-090 的求和口径相同）、channels（这个池全部 platform 入口，不论 active 与否、都计入 unallocated，同 090；按 channel_id 升序，各带 channel_id、platform、入口的 status、quota、pending、review_hold、manual_confirmed_quota、manual_confirmed_at（人工模式下页面据后两列显示“待生效”，docs/PLATFORM_CHANNELS.md 第 6.2 节）；没有配额行的入口 quota 与 pending 为 0、review_hold 为假、后两列为 null）。平台读数、最近发布结果与其余异常标记随第 4 组的发布任务加进来，本任务不预留字段。一次只读快照里读完（同 /v1 读接口的做法）。
      三，GET /api/v1/admin/allocation-changes?pool_id=&sku_id=&after=&limit=：只读；pool_id 必填（不合 ID 形状 422，再判本租户同上）、sku_id 可选（格式按 ID 形状校验，不合格 422；不存在或属于别的租户的 SKU 得空列表，不报 404、不记事件：查询本来就限在本租户的池里）；按变更的主键倒序（最新在前），分页照上面的规则，排序键与游标为主键（正整数的十进制文本）；每项为 id（自增主键，输出为整数）、pool_id、sku_id、changes（原样输出）、reason、actor_ref、actor_role、request_id、created_at（不输出 tenant_id 与 credential_id，同契约 6.8 流水的表示不给 credential_id）。时间格式用 app/api/catalog.py 的 RFC 3339 格式化函数。
      四，GET /api/v1/admin/pools：只读；列出管理员租户的全部池（按 pool_id 升序，不分页：V1 每租户一个池），每项 pool_id、status 与 went_live_at（同 /v1 池表示里的这两个字段），以及 channels（这个池的全部入口按 channel_id 升序：channel_id、kind、platform、platform_shop_id、status；platform 入口另带连接的 mode 与 status，键名为 connection_mode 与 connection_status，backoffice 入口这两个键为 null）。后台页面据此知道 pool_id 与 channel_id（补的：别的后台接口都要它们）。
      读的查询放新模块 app/services/admin_queries.py；接口放 app/api/admin_allocations.py，在 app/main.py 只在后台开关为真时挂上。
      明确不做：发布到平台与读回（第 4 组）；前端。
    status: ready
    depends_on:
      - CORE-TASK-099
      - CORE-TASK-090
      - CORE-TASK-086
    acceptance_criteria:
      - 只改 allowed_change_paths；接口测试写在 tests/integration/test_admin_allocations_api.py，用后台开关为真的生产应用、真实登录，数据用 tests/integration/platform_fixtures.py 建、finally 里 purge_tenant
