  - id: CORE-TASK-124
    title: 严重告警推送到 Telegram：首次发出，未确认每 15 分钟重复，满 1 小时转为超时待办
    purpose: >-
      按 docs/PLATFORM_CHANNELS.md 第 8 节（只推严重异常、15 分钟重复、1 小时超时、两条告警链路的区分）与第 9 节（令牌不进日志），契约 docs/CONTRACT_V1.md 0.22 的 3.2（platform_alerts 的列）（工作包 P4e 的推送部分）。在 CORE-TASK-115 的 app/services/platform_alerts.py 上补，发送放新模块 app/services/telegram.py。
      一，TelegramSender(token, chat_id).send(text)：用标准库 urllib.request 调 Telegram Bot API 的 sendMessage 方法（地址的常量写在代码里），POST 表单，超时 10 秒，HTTP 状态 200 且响应 JSON 的 ok 为真才算成功；地址里带机器人令牌，所以任何失败只记并抛出不带地址、不带响应原文的异常（类名与 HTTP 状态码），日志同样只记这两项（同 CORE-TASK-112 的出站脱敏）。
      二，notify_round(engine, sender, *, limit=20)：作业 platform-alert-notify 的一轮（sender 为空即 Telegram 未配置：不发送、记一行警告，只做下面的转超时待办）。按 created_at、再按 alert_id 升序取未确认的告警：first_sent_at 为空的，或 last_notified_at 早于数据库时间减 15 分钟的，至多 limit 条（一轮最多推 20 条，补的：防止积压时把机器人刷到限流）；逐条发送，成功后用短事务写 first_sent_at（为空时）、last_notified_at、notify_count 加 1；一条失败就不改它、结束这一轮的发送，下一轮再试（Telegram 多半整个不通，免得一轮 20 次超时拖过关停的截止时间，补的）。然后把首次发出的时间（没发出过的用 created_at）早于数据库时间减 1 小时、仍未确认、escalated_at 为空的告警设上 escalated_at（设计“发出满 1 小时仍未确认，记一条超时待办”：超时待办就是这一列，后台告警列表按它显示；Telegram 不通或没配时一直没发出的告警也照 created_at 转成超时待办，免得后台看不到，补的落法；sender 为空时也做这一步），之后照常每 15 分钟提醒。
      三，正文：第一行固定为 Core 平台告警（与巡检那条链路区分，设计第 8 节），之后每行一项：告警种类、入口的 platform 与 channel_id、sku_id、平台订单的 order_ref、detail（按 CORE-TASK-115 的规则只有 ID、件数与错误码，整个对象写成紧凑的 JSON）、是否已超时、alert_id；不含令牌、平台返回的原文与顾客资料；超过 1000 个字符截断。
      四，build_sender(secrets)：telegram_token 与 telegram_chat_id 都有时返回 TelegramSender，否则返回 None。
      明确不做：挂作业与告警的后台接口（CORE-TASK-125）。
