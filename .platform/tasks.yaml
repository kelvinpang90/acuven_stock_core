      - 集成测试验证重做一次：命令第一次写一行并登记一个安全事件后抛 RedoCommand，第二次正常返回；结果是第二次的响应并作为确定结果保存，第一次的写入与事件都不在，第二次的事件写入
      - 集成测试验证重做时重新预建与调用钩子：balance_rows 与钩子各被调用两次，第二次 balance_rows 返回的新行被预建；重做期间同一幂等键的并发请求得到 409 REQUEST_IN_PROGRESS
      - 集成测试验证被拒仍保留的写入抛 RedoCommand：命令以确定的 4xx 拒绝并登记一个写入，该写入第一次抛 RedoCommand、第二次正常写入，结果是第二次的拒绝与写入并保存
      - 集成测试验证重做后再抛：返回 503 UNAVAILABLE 且 retryable 为真，没有幂等记录、两次的写入与事件都不在，同键再发会重新执行
      - 集成测试验证重做在 READ COMMITTED 下：read_committed 为真时重做的事务仍是 READ COMMITTED，请求结束后连接的隔离级别复原
