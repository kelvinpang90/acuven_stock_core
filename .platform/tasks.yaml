    creates_pull_request: true

  - id: CORE-TASK-019
    title: 实现商品批量导入的预览、确认与查询接口
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.7 的 2.3、2.7 与第 10 节第 4 条的 scope 表，实现 POST /v1/catalog-imports（catalog_imports.preview）、POST /v1/catalog-imports/{import_id}/confirm（catalog_imports.confirm）
      与 GET /v1/catalog-imports/{import_id}。表用 CORE-TASK-012 的 catalog_imports，判定用 CORE-TASK-014 的纯函数，建商品、SKU 与变更记录复用 CORE-TASK-017 的服务层函数（变更记录带 import_id）。
      接口放新文件 app/api/catalog_imports.py（在 app/main.py 挂上），数据库读写放新文件 app/services/catalog_imports.py。
      一，预览：要求 catalog.write 与 catalog_admin，经 run_idempotent，不声明目录写锁（预览不写目录）。正文顶层只有 rows，它是 1 到 100 个元素的数组（批量数组，超过 100 为 413），
      每个元素是 JSON 对象；顶层多字段、rows 不是数组、为空数组或元素不是对象都整单 422；行内字段的问题不整单拒绝，由 CORE-TASK-014 记为 invalid_format。
      按本次导入出现的编码与条码查出本租户现有归属编码与现有 SKU 当前条码（任何状态的 SKU）的比较键，调用预览判定；保存一行导入：前缀 imp_，status previewed，
      expires_at 为数据库当前时间加 24 小时（在同一条 SQL 里算），记预览的凭据、操作者与请求 ID。rows 列（MySQL 8 保留字，手写 SQL 里加反引号）存各行原文与预览结果：每行的原文按 json.dumps（ensure_ascii 为假）序列化成字符串再存，
      不把调用方的原始值直接放进 JSON 列（MySQL 的 JSON 列限嵌套 100 层、超出 64 位的整数会转成浮点丢精度，原始值不合规时会 500 或被改写）；
      预览结果与合格行规范化后的字段值（只有字符串、null 与不超过 9007199254740991 的整数）直接存。返回 201 与导入的表示。
      二，确认：要求 catalog.write 与 catalog_admin，没有请求体（非空 422），经 run_idempotent 并声明目录写锁。事务里用 SELECT FOR UPDATE 按 ID 读导入行，依次判定：
      不存在 404 IMPORT_NOT_FOUND，属于别的租户时响应完全相同并经执行器登记 cross_tenant；已确认过返回 200 与当前表示，不再执行；已过有效期（expires_at 不晚于数据库当前时间）409 IMPORT_EXPIRED；
      否则按当前目录重查预览为 ok 的各行的编码与条码冲突，调用确认计划，按组建商品与 SKU 并写变更记录（带 import_id），把导入改为 confirmed，存逐行结果与确认的凭据、操作者、请求 ID 与数据库时间；
      一组都没建成也算确认完成。全部在执行器的一个事务里。返回 200 与当前表示。
      三，查询：要求 catalog.read，不要求角色；不存在与跨租户同上，跨租户用 cross_tenant_not_found 记事件。
      四，表示：import_id、status（previewed、expired 或 confirmed；expired 由 previewed 且 expires_at 不晚于数据库当前时间推出，不存）、expires_at、created_at、confirmed_at（未确认为 null）、
      rows（每行 index、external_ref、product_ref、result、invalid_fields；invalid_fields 在 invalid_format 时为出错字段名的列表，其余为空列表）、
      summary（counts 为六种结果各自的行数、executable_groups、executable_rows）、
      result（未确认为 null；确认后为逐行对象，键都在：index、external_ref、product_ref、outcome 为 created、skipped 或 failed；product_id 与 sku_id 在 created 时有值、否则为 null；
      preview_result 在 skipped 时为预览结果、否则为 null；failure 在 failed 时为 conflicts_existing 或 group_blocked、否则为 null）。
      表示里的 external_ref 与 product_ref 在行里是字符串时原样回显，否则（没带、数字、对象等）为 null，这样响应体（也存进幂等记录的 JSON 列）里不会出现调用方的任意值。
      时间格式用 CORE-TASK-016 的函数。
      明确不做：往现有商品加规格、修改现有商品、CSV 解析、过期导入的清理、变更流接口。
    status: done
    depends_on:
      - CORE-TASK-012
      - CORE-TASK-014
      - CORE-TASK-017
    acceptance_criteria:
      - 接口放 app/api/catalog_imports.py 并在 app/main.py 挂上，数据库读写放 app/services/catalog_imports.py
      - 集成测试在真 MySQL 上验证预览：201、import_id 前缀 imp_、status previewed、expires_at 为数据库时间加 24 小时（允许几秒误差）、逐行结果与汇总按 CORE-TASK-014；库里一行导入记录带凭据、操作者与请求 ID；目录没有新行；另一个连接持有本租户目录锁时预览照常成功；编码或条码只与别的租户的 SKU 相同的行为 ok
      - 集成测试验证预览的整单拒绝：非法 JSON、顶层多字段、rows 不是数组、空数组、元素不是对象都为 422，101 行为 413；行内缺字段只让那一行 invalid_format；某行的 sku_name 是嵌套 120 层的数组、external_ref 是超出 64 位的整数时，那一行 invalid_format、external_ref 回显为 null，预览照常 201，库里存的原文与发来的一致
      - 集成测试验证确认：按组建商品与 SKU，变更记录带 import_id；逐行 created 带 ID、预览不合格的行 skipped；预览之后测试在库里占用某组一个编码，确认时那组不建、冲突行 failed conflicts_existing、同组别的行 failed group_blocked，别的组照建；导入记录为 confirmed 并记了确认人；一组都没建成也为 confirmed
      - 集成测试验证确认的判定：不存在与跨租户得完全相同的 404 IMPORT_NOT_FOUND，跨租户记 cross_tenant；已确认后换新键再确认得 200 与当前表示且不再建；同键重试原样重放；测试把 expires_at 改到过去后确认 409 IMPORT_EXPIRED 且什么也不建；带请求体 422
      - 集成测试验证查询：previewed、expired（库里 status 仍为 previewed）与 confirmed 三种表示；跨租户 404 并记事件；只要 catalog.read
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/api/catalog_imports.py
      - app/services/catalog_imports.py
      - app/services/catalog.py
      - app/main.py
      - tests/integration/conftest.py
      - tests/integration/test_catalog_imports_api.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-020
    title: 实现目录变更流的拉取接口
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.8 的 2.5 与 2.7，实现 GET /v1/catalog-changes，要求 catalog.read，不要求角色。接口放新文件 app/api/catalog_changes.py（在 app/main.py 挂上），
      游标与 limit 的解析用 CORE-TASK-013 的函数，时间格式用 CORE-TASK-016 的函数。
      一，参数：after 可选，是上一页返回的 next_cursor；limit 可选，不带为 100；不合格、同一参数出现两次或带其他查询参数都为 422 INVALID_REQUEST。
      二，查询：只查本租户（凭据的租户）id 大于 after 的记录，按 id 升序，最多 limit 条；after 格式合格但对应的记录不存在（如整机恢复后，契约 0.8）时照常返回 id 比它大的记录，不报错、不查它存不存在；读接口不取目录写锁（写入方已按提交顺序串行）。
      三，响应 data：changes 数组与 next_cursor；next_cursor 为最后一条的游标，没有新记录时原样返回请求里的 after，没带 after 时为 null。
      每条为 cursor、event_type、object_type、object_id、product_id、version、changes（存的 JSON 原样）、actor_ref、reason、import_id、request_id、occurred_at（取 created_at）；
      不输出 credential_id、actor_role 与 idempotency_key。
      明确不做：推送、按对象或事件类型筛选、Core 侧保存消费进度。
      整机恢复后抬高自增起点是运行手册的一步（契约 0.8 的 12.1 第 3 条），不在本任务里做。
    status: done
    depends_on:
      - CORE-TASK-012
      - CORE-TASK-013
      - CORE-TASK-018
    acceptance_criteria:
      - 接口放 app/api/catalog_changes.py 并在 app/main.py 挂上
      - 集成测试在真 MySQL 上验证：不带 after 从头按 id 升序返回本租户的记录、看不到别的租户的；用较小的 limit 翻页，按 next_cursor 接着拉不重不漏；没有新记录时 next_cursor 原样返回 after，没带 after 且没有记录时为 null；用旧游标重拉得到同样的记录；after 是格式合格、但比本租户任何记录都大或落在空隙里的游标时照常返回其后的记录
