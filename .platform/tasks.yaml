  - id: CORE-TASK-022
    title: 建立期初导入、库存单据、盘点单三类表并给余额行与池加列
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.10 的 4.1（余额行的三个判定列）、6.2 第 7 条、6.3、6.6 的存放与 6.7（流水表唯一约束），
      在 app/models/inventory.py 改模型，写第五个 Alembic 迁移（revision 0005，接在 0004 之后），为之后的库存管理命令打底。
      沿用 CORE-TASK-002、012 的列约定：稳定 ID 为类型前缀加 ULID、VARCHAR(32)、utf8mb4_bin；tenant_id 外键到 tenants；
      表间引用用 tenant_id 加 ID 的复合外键，被引用的表另设 tenant_id 加 ID 的唯一约束作引用目标；状态列 VARCHAR(16) 加检查约束；
      时间列 DATETIME(6)，created_at 默认 CURRENT_TIMESTAMP(6)；request_id、actor_ref、业务引用为 VARCHAR(128) utf8mb4_bin；
      reason_code 与 actor_role 为 VARCHAR(32) utf8mb4_bin；note 为 VARCHAR(500)；request_hash 为 CHAR(64) utf8mb4_bin。
      一，改 stock_balances：加 last_book_only_version，BIGINT 非空默认 0，检查约束不小于 0 且不大于 balance_version；
      加 last_reconciled_version，BIGINT 非空默认 0，检查约束不小于 0 且不大于 last_book_only_version（契约 0.10）；
      加 opening_entry_id，VARCHAR(32) utf8mb4_bin 可空，不加外键（契约 4.1：流水表已有外键指向余额行，反向引用会成环）。
      二，改 stock_pools：加 went_live_at（DATETIME(6)）、went_live_credential_id（复合外键指向同租户的凭据）、went_live_actor_ref、
      went_live_request_id，都可空；检查约束：四列要么全空要么全非空，且 status 为 live 当且仅当 went_live_at 非空。
      三，改 ledger_entries：加唯一约束 (tenant_id, corrects_entry_id)，一条流水最多被更正一次；MySQL 唯一索引允许多个 NULL。
      0002 的外键 (tenant_id, corrects_entry_id) 用的是 MySQL 按外键名隐式建的索引，加了同列的唯一索引后 InnoDB 改用唯一索引支撑外键、删掉隐式索引，
      直接删唯一约束会报 1553；所以降级时先删这个外键，再删唯一约束，然后重建外键，回到 0004 的结构（0003 的降级注释讲过同一现象）。
      四，新表 stock_imports（前缀 simp_，一次期初导入一行，永久保留）：列与检查约束照 CORE-TASK-012 的 catalog_imports
      （import_id 主键、tenant_id、status 取 previewed 或 confirmed、expires_at、rows 为 JSON 数组、result 为 JSON 可空、
      预览的 credential_id 与 actor_ref 与 request_id 非空、created_at、确认的四列可空；status 为 previewed 时 result 与确认四列都空，
      为 confirmed 时都非空），另加 pool_id 非空，以复合外键指向同租户的池；tenant_id 加 import_id 唯一作引用目标。
      五，新表 stock_documents（只追加，永久保留）：document_id 主键；tenant_id；channel_id 与 pool_id 非空，各以复合外键指向同租户的
      销售入口与池；document_type 检查约束取 receipt、unavailable_adjustment、correction；document_ref 非空；request_hash 非空；
      result 为 JSON 非空，检查约束要求是对象；credential_id 非空（复合外键）；actor_ref、actor_role 非空（三种命令都要求角色）；
      request_id 非空；created_at；唯一约束 (tenant_id, channel_id, document_type, document_ref)。
      六，新表 stock_counts（前缀 cnt_）：count_id 主键；tenant_id；channel_id、pool_id 非空（复合外键）；count_ref 非空；
      status 取 open、confirmed、cancelled；note 可空；request_hash 非空；开单的 credential_id、actor_ref、request_id 非空、created_at；
      确认的 confirmed_credential_id、confirmed_actor_ref、confirmed_request_id、confirmed_at、confirmed_reason_code 与 confirm_note；
      取消的 cancelled_credential_id、cancelled_actor_ref、cancelled_request_id、cancelled_at。检查约束：open 时确认与取消各列全空；
      confirmed 时确认五列（不含 confirm_note）非空、取消四列全空；cancelled 时取消四列非空、确认各列全空。
      唯一约束 (tenant_id, channel_id, count_ref) 与 (tenant_id, count_id)。
      七，新表 stock_count_lines：主键 (count_id, sku_id)；tenant_id、pool_id 非空；shelf_count、unsellable_count 为 BIGINT，
      检查约束 0 到 1000000；快照五列 snapshot_stock_balance、snapshot_reserved、snapshot_unavailable、snapshot_paid_pending_dispatch、
      snapshot_balance_version，检查约束照余额行的不变量（四个量非负、reserved 加 unavailable 不超过 stock_balance、版本不小于 0）；
      d_shelf、d_u 为 BIGINT 非空，检查约束 d_shelf 等于 shelf_count 减 (snapshot_stock_balance 减 snapshot_unavailable 加
      snapshot_paid_pending_dispatch)、d_u 等于 unsellable_count 减 snapshot_unavailable（契约 6 的公式）；提交的 actor_ref、request_id、
      submitted_at 非空；entry_id 可空。外键：(tenant_id, count_id) 指向 stock_counts，(tenant_id, pool_id, sku_id) 指向 stock_balances，
      (tenant_id, entry_id) 指向 ledger_entries。
      多个以 tenant_id 开头、指向凭据表的外键按命名约定会同名：stock_counts 的确认人与取消人外键在模型与迁移里显式命名
      （如 fk_stock_counts_confirmed_credential_id_credentials、fk_stock_counts_cancelled_credential_id_credentials），
      开单人的照约定命名；stock_imports 照 CORE-TASK-012 显式命名确认人的外键。超过 64 字符的约束名照先例由命名约定生成，迁移里用 op.f 引用。
      已有的 tests/integration/test_inventory_schema.py 里直接插入 live 池的测试，改为同时填上 went_live 四列（只改造数，不改它验证的内容）。
      已有的 tests/integration/test_cli_provisioning.py 里建池的测试把库里整行与 CLI 输出逐列比较，池加列后库里多出 went_live 四列；改为期望这四列为空（新池还没有上线记录），不改 CLI 代码，也不改它验证的其他内容。
      明确不做：写这些表的代码、接口、领域规则；不改流水类型的检查约束。
    status: done
    depends_on: []
    acceptance_criteria:
      - 模型改在 app/models/inventory.py（该模块已在 alembic/env.py 登记，不改 env.py）；迁移文件放 alembic/versions，revision 0005 接在 0004 之后，upgrade 与 downgrade 都写全；约束名遵循 app/db.py 的命名约定
      - 集成测试在真 MySQL 上验证余额行与池：last_book_only_version 为负或大于 balance_version 被拒、last_reconciled_version 为负或大于 last_book_only_version 被拒；不带新列插入时取默认 0、0 与 NULL；池为 live 而 went_live_at 为空被拒、为 initializing 而 went_live 各列非空被拒、四列只填一部分被拒、went_live 凭据属于别的租户被拒
      - 集成测试验证流水表：两条 CORRECTION 引用同一条原流水被拒；别的类型（corrects_entry_id 为空）的多条流水照常插入
      - 集成测试验证 stock_imports：状态与确认列的一致性检查照 CORE-TASK-012 的四种被拒情形；rows 不是数组被拒；pool_id 或任一凭据属于别的租户被拒
