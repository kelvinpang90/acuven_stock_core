  - id: CORE-TASK-049
    title: 写出发货、退款回库、退货验收的余量判定与订单查询游标的纯函数
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.14 的 5.8（与 5.1），新建 app/domain/fulfilment.py，只放纯函数与常量（不 import FastAPI、SQLAlchemy
      或任何做 I/O 的库），单元测试放 tests/unit/test_fulfilment.py，用标准库 unittest。之后的建表、三个命令与订单库存查询任务都用它。
      流水类型沿用 app/domain/ledger.py 的 EntryType，件数校验沿用 app/domain/stock.py 的 is_positive_quantity、is_non_negative_quantity 与 QUANTITY_MAX，不另写一份。
      一，常量：三种单据类型 dispatch、refund_restock、return_receipt（也是流水的 source_type）与它们的元组；单据 ID 前缀 shp、rfr、rtn；
      业务引用字段 shipment_ref、refund_ref、return_ref；冲突时 details 的 ref_type shipment、refund、return。都按单据类型给出映射。
      二，OrderLineTotals：一行订单行的 line_ref、sku_id、quantity 与 5.1 的五个累计量。line_limit(document_type, totals)：
      发货与退款回库为 committed_qty − dispatched_qty − refund_restocked_qty，退货验收为 dispatched_qty − returned_sellable_qty − returned_unsellable_qty；未知类型抛 ValueError。
      三，请求行：数量行 line_ref 加 quantity；退货行 line_ref 加 sellable_quantity、unsellable_quantity。requested_quantity(document_type, line) 返回本行件数（退货为两数之和）。
      parse_return_quantities(sellable, unsellable)：两个都是 0 到 QUANTITY_MAX 的整数（布尔不算）且和至少 1，否则抛 ValueError，供接口层的 422 用。
      四，unknown_line_refs(request_line_refs, order_line_refs)：请求里有、订单里没有的 line_ref，升序。
      exceeding_lines(document_type, request_lines, order_lines)：按请求顺序列出件数超过余量的行，每项 line_ref、sku_id（订单行的）、quantity（退货为两数之和）、limit；请求里有订单没有的 line_ref 时抛 ValueError（调用方先查 unknown_line_refs）。
      五，line_entries(document_type, line)：本行要写的流水，按顺序给出 (EntryType, 件数)：发货一条 DISPATCH，退款回库一条 REFUND_RESTOCK；
      退货验收 sellable_quantity 大于 0 时一条 RETURN_SELLABLE，unsellable_quantity 大于 0 时再一条 RETURN_UNSELLABLE（可售在前）。
      apply_line(document_type, totals, line)：返回加上本行件数后的累计量；超过余量抛 ValueError。
      六，订单库存查询的游标：format_order_stock_cursor(document_seq, reservation_id) 得到 v1、document_seq 十进制、reservation_id 的 SHA-256 小写十六进制前 16 个字符，以点连接；
      parse_order_stock_cursor(value) 只校验格式并返回 (document_seq, 摘要)，格式不对抛 ValueError（前缀不是 v1、document_seq 不是无前导零的正整数或超过 app/domain/catalog.py 的 CURSOR_MAX、摘要不是 16 个小写十六进制字符；同流水游标的上限）；
      cursor_matches(digest, reservation_id) 判摘要是否属于这个订单。格式校验与绑定检查分开，是因为契约规定格式错先 422、查不到订单 404、绑定不符最后 422。
      明确不做：表结构、接口与服务层（CORE-TASK-050 起）。
    status: done
    depends_on: []
    acceptance_criteria:
      - 函数与常量在 app/domain/fulfilment.py，不 import FastAPI、SQLAlchemy 或做 I/O 的库；单元测试在 tests/unit/test_fulfilment.py，用 unittest
      - 单元测试验证 line_limit：发货与退款回库在部分发货、部分回库、两者都有、全部用完时的余量；退货验收在部分退货、可售与不可售都有、全部退完时的余量；未确认的行（committed_qty 为 0）发货余量为 0；未知类型抛 ValueError
      - 单元测试验证 parse_return_quantities：0 加 1、1 加 0、上限都放行；两个都是 0、负数、超过上限、小数、布尔、字符串都抛 ValueError
      - 单元测试验证 unknown_line_refs 与 exceeding_lines：全部在订单里为空；多出的 line_ref 升序；超过的行按请求顺序、limit 等于余量、恰好等于余量的不列；退货按两数之和比较；有未知 line_ref 时 exceeding_lines 抛 ValueError
      - 单元测试验证 line_entries 与 apply_line：三种类型各自的流水类型与件数；退货只有可售、只有不可售、两者都有时的条数与先后；apply_line 加对应的累计量、超过余量抛 ValueError；用 app/domain/ledger.py 的 apply_entry 验证每种流水对四个账面量的增量与契约 5.8 写的一致
