      三，拒绝旧 SHA：选了生产时，远端在 git fetch 之后、git checkout 之前，用 git merge-base --is-ancestor 核对 CORE-TASK-067 在 main 上的合并提交 ab482a47b91da88c7bd98205d5156a511f8f2e7e 是要部署的 SHA 的祖先（067 是 squash 合并，这是它在 main 上的那个提交；登记时用 git log 沿 main 的 first-parent 历史按 CORE-TASK-067 查出，Worker 沙箱里查不了 git，照写即可）；不是就以失败结束，不动检出。Demo 不做这项核对。
      四，并发组按实例分开：deploy- 加 inputs.instance，没有时为 demo；cancel-in-progress 仍为 false。跨实例的串行交给主机部署锁。
