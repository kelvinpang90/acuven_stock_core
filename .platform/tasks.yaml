  - id: CORE-TASK-010
    title: 实现服务凭据签发、轮换与吊销的运维命令行并记安全事件
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.6 的 7.2 与第 10 节第 4 条，在 CORE-TASK-009 的命令行入口上加凭据与令牌的操作。规则调用 CORE-TASK-004 的纯函数
      （generate_token、token_digest、validate_issued_scopes），表用 CORE-TASK-005 的模型，写安全事件用 CORE-TASK-007 的 record_security_event，
      错误与退出码约定、事务包装等共用部分用 CORE-TASK-009 放在 app/cli/__init__.py 的（需要时可小幅补充）。
      不碰数据库的规则写成纯函数加进 app/domain/service_auth.py，用 tests/unit 测：--reason 与 --overlap-hours 的校验、轮换时选出要改截止时间的旧令牌（用第三条的例子写单元测试）；
      --actor 的格式复用 app/domain/requests.py 的引用格式规则：在那里加一个公开的引用格式校验函数（不改现有函数的行为），单元测试加在 tests/unit/test_requests.py。
      一，共同参数：会改变权限的四个子命令都必须带 --actor 与 --reason。--actor 是运维人员标识，格式同契约第 1 节的引用
      （1 到 128 个字母、数字或点、下划线、冒号、连字符），不含姓名与邮箱；--reason 去首尾空格后 1 到 500 个字符、单行、不含控制字符。
      改已有行（吊销凭据，轮换与吊销令牌）时同时按数据库时间写 updated_at（CORE-TASK-005 的约定）。
      二，credential issue 加 --tenant、--name（去首尾空格后 1 到 200 个字符、单行、不含控制字符）、可重复的 --scope、可选的 --channel：租户须存在且为 active；
      带 --channel 时入口须属于该租户且为 active；scope 按 validate_issued_scopes 校验（非空、无重复、已知值，ops.read 单独出现且不带入口）；
      CORE_ENV 为 production 时拒绝带 demo.reset 的凭据（契约 6.1、10.4），demo 时允许。
      在一个事务里建凭据（前缀 cred_，active）与它的第一个令牌（前缀 ctk_，无截止时间），库里只存令牌摘要。安全事件 credential_issued，补充说明记原因与令牌 ID。
      三，credential rotate 加 --credential 与 --overlap-hours（必填，0 到 168 的整数，即不晚于轮换时刻后 7 天）：凭据须存在且为 active，在事务里锁住凭据行；
      所属租户须为 active（与签发一致）；CORE_ENV 为 production 时，带 demo.reset 的凭据同样拒绝轮换（与拒绝签发一致）；
      签发新令牌（无截止时间）；截止时间等于数据库时间的轮换时刻加重叠小时数；该凭据其余未吊销的令牌中，没有截止时间或截止时间晚于它的，截止时间改成它，已更早到期的不动。
      例：令牌 A 无截止时间，在 T 时刻以 24 小时轮换，得新令牌 B，A 的截止时间为 T 加 24 小时；在 T 加 1 小时再以 0 小时轮换，得新令牌 C，
      A 与 B 的截止时间都改为 T 加 1 小时，即刻失效。安全事件 token_issued，补充说明记原因、新令牌 ID 与被设截止时间的旧令牌 ID 及其截止时间。
      四，token revoke 加 --token：令牌须存在且未吊销，记吊销时间（数据库时间），立即生效；安全事件 token_revoked。
      credential revoke 加 --credential：凭据须为 active，改为 revoked 并记吊销时间，令牌行不动（凭据已吊销时鉴权一律 401）；安全事件 credential_revoked。
      吊销不可撤销，再吊销已吊销的对象是错误；吊销在事务里锁住目标行（或用带未吊销条件的 UPDATE 按受影响行数判断），两次并发吊销只有一次成功、只写一条事件。--token 传入以 csk_ 开头的值（误把明文令牌当令牌 ID）时单独报错，提示要传 ctk_ 开头的令牌 ID；
      所有报错（含对象不存在）都不回显参数值。
      五，credential list 加 --tenant：列出该租户的凭据（ID、名称、入口、scope、状态、吊销时间）与各自的令牌（ID、创建时间、截止时间、吊销时间），不输出摘要；只读，不写事件；租户不存在时向标准错误写一行、退出码 2（与 show --tenant 一致）。
      六，安全事件与输出：一次成功的操作在业务事务提交之后另开短事务写一条事件（契约 7.2），操作者记 --actor，request_id、HTTP 方法、路径与 User-Agent 为空，
      凭据与租户记目标对象的；失败的操作什么也不改、不写事件，只在标准错误报一行（校验错误退出码 2，其他失败退出码 1）。
      事件写入失败时向标准错误报一行警告（带操作类型与目标凭据或令牌 ID，便于运维手工补记审计；不带堆栈、SQL 与连接信息），操作照样算成功、退出码 0（契约 7.2 写入失败不改变结果）；
      命令行入口为此配置日志，使 record_security_event 自己记的那行异常在命令行里不输出（标准错误上只有命令行这一行警告，没有堆栈）；
      这项日志配置只在一次入口函数调用期间生效、返回前恢复原状，不影响同一进程里的其他代码与测试（例如 tests/integration/test_api_auth.py 对该日志器的日志捕获）。
      明文令牌只在事务提交之后向标准输出写一次（成功输出的 JSON 里），不落库、不进安全事件、不进标准错误与日志、不进异常信息；输出丢了就吊销那个令牌再轮换。
      在 README.md 的命令行一节补上这些子命令与令牌只显示一次的说明。
      明确不做：HTTP 管理接口、修改凭据的 scope 或入口（契约 10.4：要改就签发新凭据、吊销旧的）、恢复已吊销的对象、到期清理。
    status: ready
    depends_on:
      - CORE-TASK-009
    acceptance_criteria:
      - 新子命令放 app/cli/service_auth.py，在 app/cli/__main__.py 里挂上；README.md 的命令行一节有这些子命令；纯规则加在 app/domain/service_auth.py，单元测试覆盖 --reason 与 --overlap-hours 的边界（0、168、169、负数、非整数、500 与 501 个字符、换行）和第三条的轮换例子
      - 集成测试在真 MySQL 上验证签发：输出的令牌符合格式，库里只有它的摘要、没有明文；签发的令牌能通过 CORE-TASK-007 的鉴权（测试应用挂一个要求鉴权的测试路由）；写了一条 credential_issued 事件，操作者、原因与令牌 ID 对、不含明文令牌
      - 集成测试验证签发被拒时退出码 2、库里没有新凭据、令牌与事件：未知或重复的 scope、ops.read 与别的 scope 同时出现或带入口、入口属于别的租户或已停用、租户已停用、缺 --actor 或 --reason 或格式不对、CORE_ENV 为 production 时带 demo.reset（demo 时可以签发）
      - 集成测试按 purpose 第三条的例子验证轮换：重叠期内新旧令牌都能鉴权通过，截止时间到后旧令牌 401（例如测试把截止时间改到过去）；重叠小时数为负数、169 或不是整数时被拒；已吊销的凭据或已停用租户的凭据不能轮换，CORE_ENV 为 production 时带 demo.reset 的凭据不能轮换；轮换后改过的行 updated_at 已更新；写了一条 token_issued 事件，记了旧令牌的截止时间
      - 集成测试验证吊销：吊销令牌后用它鉴权立即 401、同凭据的其他令牌不受影响；吊销凭据后它的所有令牌 401；再吊销已吊销的令牌或凭据被拒且不多写事件；--token 传明文令牌时单独报错且标准错误里没有该值；list 只列该租户的凭据与令牌、不含摘要
      - 集成测试验证保密与事件失败：所有子命令的标准错误与日志里没有明文令牌；让安全事件写入失败时（例如照 tests/integration/test_api_auth.py 的先例替换写入函数）操作照样生效、退出码 0，传入的标准错误流只有一行警告（带操作类型与目标 ID、没有堆栈），且用 caplog 断言入口函数调用期间没有来自 app.services.security_events 的日志记录（pytest 的日志捕获会截走记录，只查 sys.stderr 守不住）；入口函数返回后日志配置已恢复原状；参数错误的一行不含参数值（例如把明文令牌当位置参数传入时）
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
