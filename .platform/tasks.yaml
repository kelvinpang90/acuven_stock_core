  - id: CORE-TASK-064
    title: 就绪检查正文加进程内定时任务的运行状态与停转判定
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.17 的 8.5，让巡检能看出进程内的两个定时任务（预留到期扫描、安全事件清理）是否停转或一直失败。
      一，停转判定写成纯函数，放新文件 app/domain/periodic.py：输入线程是否在跑、运行间隔、首次等待、启动时刻、最近一次正常结束的时刻、最近一次结束的结果与当前时刻（都是单调时钟的秒数），
      按 8.5 的三条判 stale（线程不在跑；最近一次结束的运行抛了异常；距最近一次正常结束，或从没正常结束过时距启动后第一次应运行的时刻，超过 2 个间隔加 300 秒）；再由各任务的结果得出 periodic 的 status。
      二，app/services/periodic.py 的 PeriodicTask 在启动时记下启动时刻，每次运行结束时记下结果：正常结束记单调时钟与 UTC 墙钟两个时间，抛出异常同样记两个时间；判定只用单调时钟，墙钟只作展示；提供一个读出当前状态的方法，线程安全。
      三，app/main.py 的就绪检查：状态码仍只看数据库能否执行一条查询（200 或 503），不因定时任务变化；200 与 503 的正文都加 periodic，含 status 与按名字升序的 tasks，每项 name、alive、last_success_at、last_failure_at、stale；
      时间格式同其他时间字段（UTC、微秒、Z 结尾），本进程里还没有过时为 null。还没启动的任务（lifespan 未进入）照样列出、alive 为 false：两个任务的名字、间隔与首次等待在 create_app 里就定下来，不等 lifespan；
      进入 lifespan 后 app.state 上的 security_event_purge 与 reservation_expiry 仍是已启动的 PeriodicTask（已有的接入测试断言这一点）。
      现有 PeriodicTask 的行为（首次等待、间隔、异常记日志后继续、停止）与就绪检查原有的 status、reason 不变；两个已有测试把就绪检查的正文断言为全等，只把它们改成核对 status 为 ok，原本验证的内容不变。
      明确不做：巡检脚本、cron 与运行手册（CORE-TASK-065）；新的配置项；改 /healthz 或任何 /v1 接口。
    status: done
    depends_on: []
    acceptance_criteria:
      - 改动在 app/domain/periodic.py（新）、app/services/periodic.py、app/main.py；单元测试在 tests/unit/test_periodic.py（新）；PeriodicTask 记录结果的测试加在 tests/integration/test_security_event_purge.py（已有的 PeriodicTask 测试在这里），就绪检查的测试在 tests/integration/test_health_api.py；已有的测试照常通过
      - tests/integration/test_api_requests.py 与 tests/integration/test_catalog_queries_api.py 里把就绪检查正文断言为全等的两处，只改成核对状态码与 status 为 ok，这两个文件不做别的改动
      - 单元测试按到期扫描（间隔 30 秒、首次等待 30 秒）与安全事件清理（间隔 24 小时、首次等待 60 秒）两组参数各验证：刚好不超过与刚好超过 2 个间隔加 300 秒；从没正常结束过时从第一次应运行的时刻起算；最近一次失败即 stale；失败后又正常结束即恢复；线程不在跑即 stale；任一任务 stale 时 status 为 stale，否则为 ok；纯函数文件不 import FastAPI、SQLAlchemy 或任何做 I/O 的库，也不读时钟
      - PeriodicTask 的测试验证：一次正常结束后记下成功、一次抛出异常后记下失败且线程继续跑、停止后线程不在跑；读出的状态与纯函数的判定一致
      - 集成测试验证就绪检查：随应用启动（进入 lifespan）后回 200，periodic 的 status 为 ok，两个任务按名字升序、alive 为 true、两个时间为 null、stale 为 false；不进入 lifespan 时仍回 200、两个任务都列出、alive 为 false、stale 为 true、status 为 stale
      - 集成测试验证数据库连不上时仍回 503 与原来的 reason，正文同样带 periodic；把某个任务记成最近一次失败后，就绪检查报它 stale、last_failure_at 为带 Z 的 UTC 时间、状态码不变
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
