  - id: CORE-TASK-041
    title: 写出确认销售的状态判定、行集比对与按 SKU 合计缺货的纯函数
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.13 的 5.7（与 5.2 第 5–7 条），新建 app/domain/sale_commits.py，只放纯函数与常量（不 import FastAPI、SQLAlchemy
      或任何做 I/O 的库），单元测试放 tests/unit/test_sale_commits.py，用标准库 unittest。之后的确认销售、故障补交与待审结案任务都用它。
      状态取值、is_due 等沿用 app/domain/reservations.py，流水类型沿用 app/domain/ledger.py 的 EntryType，请求摘要沿用 app/domain/idempotency.py 的 request_digest，不另写一份。
      一，常量：流水 source_type sale_commit；reason_code late_payment 与 fault_mode。
      二，merge_destination(sku_id, merged_into)：merged_into 是 sku_id 到 merged_into_sku_id（未合并为 None）的映射；顺着映射一直走到未合并的 SKU 并返回它；
      sku_id 不在映射里、或顺着走到一个不在映射里的 SKU 时返回 None；走的步数超过映射的大小（成环）抛 ValueError。
      三，mismatched_line_refs(request_lines, order_lines, destinations)：两组都是 (line_ref, sku_id, quantity) 序列，destinations 是 sku_id 到合并去向（或 None）的映射；
      返回升序的 line_ref 列表：只在一边出现的、quantity 不同的、请求 SKU 的去向为 None 或与订单行 SKU 的去向不同的；全部一致时为空列表（契约 5.7 第 3 步，Q-59）。
      四，commit_decision(status, expires_at, now, recorded_payment_ref, payment_ref)：返回枚举 CommitDecision 的一个值——active 且未到期为 COMMIT；active 且已到期为 EXPIRE_THEN_LATE；
      expired 为 LATE；late_payment_review 且 recorded_payment_ref 等于 payment_ref 为 LATE，不等为 PAYMENT_REF_CONFLICT；committed 且 recorded_payment_ref 等于 payment_ref 为 ANSWER_EXISTING，
      不等为 STATE_CONFLICT；released、closed_refunded 为 STATE_CONFLICT；其他值抛 ValueError（契约 5.7 第 4 步，Q-57）。
      五，sku_shortfalls(lines, available_by_sku)：lines 是按请求顺序的 (line_ref, sku_id, quantity)；按 sku_id 合计后与 available 比较，
      按请求顺序返回所在 SKU 合计超过 available 的全部行，每项 line_ref、sku_id、quantity、available（该 SKU 的可售量）；都够时为空列表（契约 5.7 按 SKU 合计）。
      六，commit_reason_code(entry_type, fault_mode)：fault_mode 为真时返回 fault_mode；否则 LATE_SALE_COMMIT 返回 late_payment、SALE_COMMIT 返回 None；其他流水类型抛 ValueError。
      七，reserve_request_digest(order_ref, lines)：返回“同内容的预留请求”的摘要，即 request_digest 对 path 为空对象、body 为 order_ref 与 lines（每项 line_ref、sku_id、quantity）的结果（契约 5.7 第 5 步）。
      明确不做：表结构、接口与服务层（CORE-TASK-042 起）。
    status: done
    depends_on:
      - CORE-TASK-036
    acceptance_criteria:
      - 函数与常量在 app/domain/sale_commits.py，不 import FastAPI、SQLAlchemy 或做 I/O 的库；单元测试在 tests/unit/test_sale_commits.py，用 unittest
      - 单元测试验证 merge_destination：未合并返回自己；一级与两级合并链返回最终 SKU；不在映射里、链走到不在映射里的 SKU 都返回 None；成环抛 ValueError
      - 单元测试验证 mismatched_line_refs：完全一致为空；多出、缺少、数量不同、请求 SKU 不存在都列出且升序；请求报原 SKU、订单行在规范 SKU 时算一致；订单行未改挂（仍在已合并的来源 SKU）时两边去向相同也算一致
