  - id: CORE-TASK-032
    title: 实现盘点单的确认落账
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.10 的 6（盘点规则、COUNT_STALE、COUNT_BELOW_COMMITMENTS）、4.1（判定列）与 6.6 的确认，
      在 CORE-TASK-031 的 app/api/counts.py 与 app/services/counts.py 加 POST /v1/counts/{count_id}/confirm（counts.confirm）。
      规则用 CORE-TASK-001 的 apply_count_adjustment 与 CORE-TASK-023 的 is_stale，锁行与写流水用 CORE-TASK-026 的 app/services/stock.py。
      一，stock.write，角色 stock_admin；正文 reason_code（必填）、可选 note；池授权按盘点单所属的池（404 COUNT_NOT_FOUND）。
      二，命令里依次：FOR UPDATE 读盘点单行，不是 open 为 409 STATE_CONFLICT；命令以 CORE-TASK-025 的 read_committed 执行，盘点行在盘点单行锁之后用普通读读（看得到最新提交，不加间隙锁）；没有盘点行为 422（details.reason 为 count_has_no_lines）；
      按 sku_id 升序 FOR UPDATE 锁全部盘点行 SKU 的余额行；（契约 6.6 确认的步骤里没有“SKU 已合并”一步：提交之后被合并的 SKU 有成对的迁移流水，由下面的 COUNT_STALE 拦下）
      对每个 SKU 用 is_stale(判定列, 快照版本) 检查，有为真的整笔 409 COUNT_STALE，details.sku_ids 按 sku_id 升序列出；
      逐 SKU 用 apply_count_adjustment 算落账后的账面，有违反不变量的整笔 409 COUNT_BELOW_COMMITMENTS，details.skus 只列违反的 SKU（按 sku_id 升序），每项 sku_id、stock_balance、reserved、
      unavailable、paid_pending_dispatch（落账后的值）与 shortfall；
      都通过后，差额不全为 0 的 SKU 各写一条 COUNT_ADJUSTMENT（四个增量为 d_shelf 加 d_u、0、d_u、0；source_type count，source_ref 为 count_ref；
      reason_code、note 取正文），append_entry 传 reconciled_version 为该 SKU 的快照版本；两个差额都为 0 的不写流水，调 mark_verified 并传
      reconciled_version 为快照版本（契约 0.10 的 4.1 与 6.6 第 6 步：点数核实的是快照那一刻）；
      盘点行记下 entry_id；盘点单改为 confirmed，记确认人、reason_code、confirm_note；返回 200 与表示（CORE-TASK-031 的表示函数，传入锁内读到的盘点单行与盘点行加上本次的改动，不另用普通读）。
      被拒时什么也不写（只保存幂等记录）。
      明确不做：SKU 合并的定数（随合并任务做）、Demo 重置。
    status: done
    depends_on:
      - CORE-TASK-023
      - CORE-TASK-029
      - CORE-TASK-030
      - CORE-TASK-031
    acceptance_criteria:
      - 接口与写入加在 app/api/counts.py 与 app/services/counts.py；CORE-TASK-031 的测试照常通过
      - 集成测试在真 MySQL 上验证差额法：提交时点到 20、之后收货 10、确认时差额为 0 不写流水且账面仍是 30；点数少于账面时写 COUNT_ADJUSTMENT 且两个增量正确；只改不可售件数时 stock_balance 与 unavailable 同增；流水带正文的 reason_code 与 note
      - 集成测试验证判定列：写了流水的 SKU 的 last_book_only_version 为该流水的版本、差额为 0 的为当时的 balance_version；两种 SKU 的 last_reconciled_version 都是快照版本；快照之后、确认之前录的收货在确认后仍可更正（判定列小于它的版本）；之后经更正接口对这些 SKU 快照之前的收货做更正得 superseded
      - 集成测试验证 COUNT_STALE：两张盘点单都提交了同一 SKU，先确认的写了流水后，后确认的得 409 COUNT_STALE 且列出该 SKU，什么也没写；重新提交该 SKU 后可确认；快照与差额为 0 的核实之间没有别的流水时不报
