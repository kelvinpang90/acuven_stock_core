      一，配置：app/config.py 加 reservation_ttl_seconds（环境变量 CORE_RESERVATION_TTL_SECONDS，默认 900），用 parse_ttl_seconds 校验，不合格时 Settings 构造失败；
      docker-compose.yml 把这一项传进容器、没设时取 900（.env.example 已由登记 PR 写好）；create_app 在进程日志写一行当前值；
      app/cli/__main__.py 配置不合格时的提示加上 CORE_RESERVATION_TTL_SECONDS（命令行读同一份配置，契约 5.6）。
      二，POST /v1/reservations（操作类型 reservations.create，scope orders.write，不要求角色，操作者头带了照常校验并记录）：正文只有 order_ref 与 lines
      （1 到 100 个，批量数组，超过 413；每项只有 line_ref、sku_id、quantity，quantity 为 1 到 1000000 的 JSON 整数）；未知字段、引用格式不对、line_ref 重复、sku_id 重复都 422。
      三，命令按契约 5.6 的七步：普通读按 (tenant_id, channel_id, order_ref) 查预留，有则摘要相同 200 与当前表示、不同 409 ORDER_REFERENCE_CONFLICT（details 为 ref_type order 与 ref）并记 business_ref_conflict；
      然后 require_live、require_skus_exist、升序锁余额行、按 sku_id 升序 FOR SHARE 读 SKU 行与按 product_id 升序 FOR SHARE 读商品行判已合并（SKU_MERGED）与停用（SKU_INACTIVE，details.sku_ids 按请求顺序列全）、
      find_shortfalls 判可售（INSUFFICIENT_STOCK，details.lines）；都通过则 created_at 取一次数据库时间，写预留行、订单行与每行一条 RESERVE 流水（source_type reservation、source_ref 为 order_ref、line_ref、reason_code 为空）；201 返回表示。
      第 2 到 6 步得出业务拒绝时，在同一事务里再用普通读查一次 order_ref（READ COMMITTED 下看得到已提交的那一条）：查到则 raise BusinessRefTaken，按第 1 步重新判定；
      查不到则照常抛出原来的拒绝，第 3 步登记的 cross_tenant 事件保留。插入撞 (tenant_id, channel_id, order_ref) 唯一约束同样走 BusinessRefTaken。
      四，表示照 5.6：reservation_id、order_ref、pool_id、status（用 displayed_status，已到期的 active 显示 expired）、expires_at、created_at、released_at 与 release_reason（只在 released 时有值）、lines 按 line_ref 升序。
      五，查询（scope orders.read）：GET /v1/reservations/{reservation_id}，不存在或属于别的租户 404 RESERVATION_NOT_FOUND，后者记 cross_tenant；
      GET /v1/reservations?order_ref=…，按凭据的销售入口查，返回 reservations 数组 0 或 1 个，凭据没有入口时为空数组，order_ref 缺少或格式不对 422。
      明确不做：释放、到期关单、定时任务与新预留之前的关单（CORE-TASK-039）；可售量查询（CORE-TASK-040）；确认销售。
