  - id: CORE-TASK-005
    title: 建立服务凭据、令牌与安全事件的数据库表并补凭据外键
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.6 的 7.2 与第 10 节第 1、4 条，建立三张表的 SQLAlchemy 模型和第三个 Alembic 迁移，
      并给已有的幂等记录与流水表补上指向凭据的外键，为之后的鉴权与幂等执行器打底。沿用 2.2 的数据库列约定与 CORE-TASK-002、003 的写法：
      稳定 ID 为类型前缀加 ULID、VARCHAR(32)、utf8mb4_bin；主键都是单列稳定 ID；tenant_id 外键到 tenants；表间引用用 tenant_id 加 ID 的复合外键，
      被引用的表另设 tenant_id 加 ID 的唯一约束作引用目标；状态列 VARCHAR(16) 加检查约束；时间列 DATETIME(6)，created_at 默认 CURRENT_TIMESTAMP(6)，
      updated_at 插入时同默认、之后由应用写入；只追加的表没有 updated_at。
      一，credentials（前缀 cred_）：credential_id 主键、tenant_id 非空、channel_id 可空，非空时复合外键指向同租户的销售入口；name VARCHAR(200)；
      scopes 为 JSON，检查约束要求是非空数组（scope 的取值由应用校验）；status 取 active 或 revoked；revoked_at 可空，检查约束要求 status 为 revoked 时它非空、否则为空；
      created_at、updated_at；tenant_id 加 credential_id 唯一，作引用目标。
      二，credential_tokens（前缀 ctk_）：token_id 主键、tenant_id 非空、credential_id 非空并以复合外键指向同租户的凭据；
      token_digest CHAR(64) utf8mb4_bin 非空，全表唯一（鉴权时还不知道租户，按契约 10.4 全库唯一），检查约束要求是 64 个小写十六进制字符；
      expires_at 与 revoked_at 可空；created_at、updated_at；不存明文令牌。
      三，security_events（前缀 sev_）：只追加；event_id 主键；event_type VARCHAR(32) utf8mb4_bin，检查约束限定为 invalid_credential、forbidden、cross_tenant、
      idempotency_conflict、business_ref_conflict、rate_limited、credential_issued、token_issued、token_revoked、credential_revoked 十种；
      occurred_at 默认 CURRENT_TIMESTAMP(6) 并建索引（满 1 年清理按它）；tenant_id 可空，非空时外键到 tenants；credential_id 可空，
      非空时以复合外键指向同租户的凭据，检查约束要求 credential_id 非空时 tenant_id 也非空；request_id VARCHAR(128) 可空（命令行操作没有请求）；
      actor_ref VARCHAR(128) utf8mb4_bin 可空（命令行操作的操作者，契约 7.2）；http_method VARCHAR(10) 可空，path VARCHAR(512) 可空（不含查询串），
      user_agent VARCHAR(200) 可空，details JSON 可空（原因、目标令牌、旧令牌截止时间等）。轮换记为 token_issued，不另设类型。
      令牌摘要全表唯一、不含 tenant_id，是契约第 10 节第 1 条写明的唯一例外。
      四，补外键：idempotency_records 的 tenant_id 加 credential_id 复合外键指向凭据；ledger_entries 的 tenant_id 加 credential_id（可空）复合外键指向凭据。
      超过 64 字符的约束名照先例由命名约定生成，迁移里用 op.f 引用。明确不做：鉴权、命令行、写安全事件的代码、到期清理；不改领域层与目录表。
    status: done
    depends_on:
      - CORE-TASK-003
    acceptance_criteria:
      - 三张表的模型放新文件 app/models/service_auth.py，在 alembic/env.py 里 import 登记；补的两个外键改在 app/models/inventory.py；迁移文件放 alembic/versions，revision 接在 0002 之后，upgrade 与 downgrade 都写全
      - 主键、唯一约束、复合外键、检查约束与索引按 purpose 所列在数据库层生效；约束名遵循 app/db.py 的命名约定
      - 集成测试在真 MySQL 上验证凭据：指向别的租户的销售入口被拒，scopes 为空数组或不是数组被拒，status 为 revoked 却没有 revoked_at 或 active 却有 revoked_at 被拒，状态只差大小写被拒
      - 集成测试在真 MySQL 上验证令牌：两个令牌摘要相同被拒（即使属于不同租户），摘要不是 64 个小写十六进制字符被拒，令牌指向别的租户的凭据被拒
      - 集成测试在真 MySQL 上验证安全事件与补的外键：未知事件类型被拒，有 credential_id 而无 tenant_id 被拒；幂等记录与流水的 credential_id 指向不存在或别的租户的凭据被拒，流水的 credential_id 为空可以
      - CI 的迁移往返（upgrade、downgrade 到底、再 upgrade）与 alembic check 通过；集成测试经 tests/integration/conftest.py 的 migrated_engine 夹具升降迁移；已有的库存表测试若因新外键要先建凭据，补建凭据的夹具，并可把用例里写死的凭据 ID 换成夹具建好的（按用例需要建，同一租户可以有多个），不删用例、不改断言要验证的约束
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试与迁移检查由 PR 的必需 CI 检查 integration 执行并通过
