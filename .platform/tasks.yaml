  # 后台接口（工作包 P3e～P3g）：路径一律在 /api/v1/admin 下；与 /v1 对应的命令沿用 /v1 的路径（去掉开头的 /v1）、请求模型、判定与响应形状，只换身份、入口与幂等键的来源（契约 8.6 第 2 条）。
  - id: CORE-TASK-099
    title: 后台执行器与后台写接口的公共检查：会话、CSRF、提交键、角色、本租户与后台入口
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 8.6 第 2 条（写接口的检查顺序、角色、后台发起的库存管理命令）、5.10 命令体共用（后台执行器一行与入口检查）与 7.1 的后台表单防重复（Q-84、Q-86）。工作包 P3e 的前一半。只写公共部分，不挂业务路由。
      新模块 app/api/admin_executor.py，给之后的后台接口用：
      一，写接口的依赖按检查顺序组合：会话与 CSRF 用 CORE-TASK-098 的 require_admin_csrf（③④，拒绝时是 {"detail"} 形状）→ Idempotency-Key 用现有的 parse_idempotency_key 判格式，缺或不合格 400 INVALID_REQUEST（⑤，/v1 的错误形状）→ 请求体用现有的 json_body（⑥，同样的 422 与批量上限 413）→ 角色（⑦）→ 本租户（⑧，由各接口给出池或对象）。读接口的依赖只做 require_admin 与本租户。
      二，角色：ADMIN_ROLES 为 catalog_admin、stock_admin、stock_operator 三个（V1 每个管理员都持有，契约 8.6 第 2 条）；assert_role(accepted) 按 Q-86 的写死规则得出断言的角色（只接受一个的断言它；接受 stock_operator 与 stock_admin 的断言 stock_admin；不要求角色的订单命令断言 stock_admin），它不在 ADMIN_ROLES 里时 403 FORBIDDEN，并照现有 require_role 的做法记一条 forbidden 安全事件（details 为 {"category": "role", "role": 断言的角色}；V1 不会发生，测试替换 ADMIN_ROLES 验证）。
      三，安全事件的身份：本模块提供 record_admin_event(request, principal, event_type, details)，事件的 tenant_id、credential_id 取管理员的租户与主体，actor_ref 为账号 ID，request_id、方法、路径与 User-Agent 照现有 app/api/auth.py 的写法；admin_not_found(request, principal, *, object_type, object_id, code) 在对象属于别的租户时用它记一条 cross_tenant（details 同现有 cross_tenant_not_found：object_type 与 id），返回与不存在完全相同的 404。之后的后台接口在第 ⑧ 步遇到别的租户的池、对象、入口时都用它（契约 7.2）。记事件前先结束本请求连接上的读事务（同现有写法）。
      四，backoffice_entry(request, principal, pool_id)：用本请求的连接普通读、读完结束事务；池不存在 404 POOL_NOT_FOUND，属于别的租户经 admin_not_found 记 cross_tenant 后同样 404；池没有 active 的 backoffice 入口 422 INVALID_REQUEST（契约没写，补的：只有组合 2 的池有后台入口）；返回入口 ID。
      五，admin_context(request, principal, *, role, idempotency_key, channel_id, pool_id)：组 CORE-TASK-074 的命令上下文：租户取 principal.tenant_id，入口与池取参数（目录、平台商品类命令两者都为空），操作主体取 principal.credential_id，操作者为 (principal.account_id, 断言的角色)，request_id 取中间件生成的，预留有效期为空，HTTP 三项取请求。
      六，run_admin(request, context, operation, command, **执行器选项)：入口是 backoffice、而 operation 是契约 5 的七个订单命令之一（预留、释放、确认销售、发货、退款回库、退货验收、待审结案；取 app/api 下 reservations、sale_commits、fulfilment 三个模块里这七个命令的操作类型常量，只 import、不改那三个模块）时 403 FORBIDDEN，在调执行器之前判出、不取锁、不保存，记一条 forbidden 安全事件（details 为 {"category": "entry_kind", "operation": operation}）（契约 5.10）；否则调 CORE-TASK-074 的执行器核心，幂等作用域、重放与冲突、安全事件全照执行器。
      明确不做：任何业务路由（CORE-TASK-100 起）；平台订单的人工操作（不走幂等记录，CORE-TASK-105 起）；后台前端。
    status: ready
    depends_on:
      - CORE-TASK-098
      - CORE-TASK-079
      - CORE-TASK-078
    acceptance_criteria:
      - 只改 allowed_change_paths；测试 tests/integration/test_admin_executor.py 在测试模块里给后台开关为真的生产应用挂测试路由（一个带 pool_id 正文的写命令与一个读命令），真实登录取得会话 cookie 与 CSRF 令牌
      - 检查顺序逐步各有一条：请求体超过 128 KiB 413（先于会话）；没有会话 401 not_authenticated；CSRF 不符 403 csrf_failed；缺 Idempotency-Key 与格式不对各 400 INVALID_REQUEST；正文不合格 422；替换 ADMIN_ROLES 后 403 FORBIDDEN 并多一条 forbidden 事件；别的租户的池与不存在的池 404 POOL_NOT_FOUND 且两者响应只差 request_id，前者多一条 cross_tenant 事件（主体为管理员的）；没有后台入口的池 422；每种拒绝都不写幂等记录与流水
      - 成功的写命令：幂等记录的 credential_id 是管理员的主体，命令体经 execution.context 读到的租户、入口（所选池的 backoffice 入口）、池、操作者 ref（adm 前缀的账号 ID）与角色、request_id 与提交键都如上；同键同内容重放得原响应与 Idempotency-Replayed，同键换内容 409 IDEMPOTENCY_CONFLICT
      - 两个管理员用同一个提交键各提交一次互不冲突（作用域含主体）；响应形状是 /v1 的 data 与 request_id，request_id 是中间件生成的
      - operation 为七个订单命令之一而入口是 backoffice 时 403 FORBIDDEN、多一条 forbidden 事件，命令体没有被调用、没有幂等记录、没有取命名锁（测试替换执行器核心断言没被调用）
      - assert_role 的三种规则各有一条
      - 测试提交的数据在 finally 里按外键先后删掉，会话结束时 migrated_engine 降到 base 照常成功
