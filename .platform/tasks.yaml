  - id: CORE-TASK-043
    title: 给幂等执行器加回滚后整个命令重做一次的机制
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.13 的 5.7 通用一节的“重新判定”与 7.1 第 2 条的例外，在 app/services/idempotency.py 的 run_idempotent 加一种重做：
      命令抛新的异常 RedoCommand 时，执行器回滚业务事务，丢弃这次登记的安全事件与被拒仍保留的写入，在同一连接上（幂等命名锁与 READ COMMITTED 仍在）
      从开业务事务之前的余额行预建那一步整个重做一遍：重新调用 balance_rows 取要预建的行并预建、重新调用 CORE-TASK-039 加的开事务前钩子，再开新事务执行同一个命令。
      每个请求最多重做一次；重做里命令再抛 RedoCommand 时回滚，返回 503 UNAVAILABLE（retryable 为真），不保存幂等记录，两次登记的安全事件都丢弃。
      RedoCommand 无论由命令本身抛出，还是由命令用 keep_on_rejection 登记、在业务拒绝之后执行的写入抛出，都按同样方式重做（被拒仍保留的写入撞唯一约束时也要能重做，契约 5.7 撞唯一约束一条）。
      已有的 BusinessRefTaken 行为不变；不抛 RedoCommand 的命令行为不变。
      明确不做：确认销售本身（CORE-TASK-044）。
    status: done
    depends_on:
      - CORE-TASK-039
    acceptance_criteria:
