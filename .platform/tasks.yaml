  - id: CORE-TASK-096
    title: 管理员密码哈希、登录锁定、后台会话与账号变更的规则和服务
    purpose: >-
      按 docs/ADMIN_AUTH.md 0.3 第 4.1 到 4.5 节（登录二，规则与服务）。工作包 P3b。
      一，app/domain/pw_hash.py：用户名规范化与合法判定（整串匹配）、密码规则、标准库 scrypt 的哈希与校验（参数、盐长、摘要长、maxmem、存储格式与越界处理照 4.1）、DUMMY_PASSWORD_HASH。它要加载 _hashlib，测试放 tests/integration/test_pw_hash.py（pytest，不需要数据库）。
      二，app/domain/login_throttle.py：normalize_source（IPv4、IPv4 映射的 IPv6 取其中的 IPv4、其他 IPv6 取所在 /64 网段的规范文本、其余原样）、throttle_key、source_key（无法按 UTF-8 编码的用户名与来源文本都按 errors=replace 编码）与窗口、两道上限的判定（4.2），纯函数、只用标准库的 hashlib.sha256 与 ipaddress；单元测试 tests/unit/test_login_throttle.py（unittest）。
      三，app/services/admin_auth.py：utc_now（截到整秒、不带时区）；authenticate（4.3 的六步，在给的连接上完成并提交一个事务、恰好写一条登录尝试、查账号 SELECT … FOR UPDATE、数据库出错回滚后原样抛出；LoginResult 不可变、repr 不含 token）；resolve_session、revoke_session、csrf_token_for（HMAC 常量 b"core-admin-csrf"）、csrf_token_matches（4.4，ActiveSession 带 tenant_id 与 credential_id）；create_account、reset_password、disable_account、enable_account、account_exists 与 AccountError（4.5 的检查顺序与错误码）。另加只读的 get_account(connection, *, username) -> AccountInfo | None（不可变：account_id、tenant_id、credential_id、username、disabled；用户名先规范化，不合格返回 None、不查库），给账号命令输出与记安全事件用（设计 4.6 要账号 ID 与主体，而 4.5 的改动函数不返回它们，补的）。create_account 查租户用 SELECT … FOR SHARE 锁住租户行到本事务提交（照现有服务读租户时加锁的写法），并发停用租户时串行。
      create_account 在同一事务里先在 credentials 建一个 kind 为 admin 的主体（name 为规范用户名、scopes 为空数组、channel_id 为空、status active，ID 用 new_id 的 cred 前缀，时间列取传入的 now，同账号行），再建账号行（new_id 的 adm 前缀）指向它（契约 10 第 4 条，CORE-TASK-077 的约束）；撞唯一约束回滚并转成 already_exists。disable_account 不吊销账号的主体。所有收 now 的函数对带时区或带小数秒的 now 报 ValueError。
      密码、哈希、会话令牌、CSRF 令牌、throttle_key 与 source_key 不进日志与异常消息。
      明确不做：账号命令（CORE-TASK-097）、接口与 cookie（098）、登录尝试的清理作业与查看（设计第 6 节，以后另登记）。
