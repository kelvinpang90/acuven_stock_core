    title: 平台事件执行器加人工路径：先取订单锁，同一事务写收件箱并处理，按提交键去重
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 5.10 引用格式（人工登记与“平台没有给 ID”）、“后台的人工操作”的写法与情形表（Q-98、Q-100）。工作包 P3h 的人工登记部分（服务层）；接口是 CORE-TASK-106。
      一，app/services/platform_events.py 加 process_manual_event(engine, *, tenant_id, channel_id, platform_order_id, action, payload, manual_key, request_hash, credential_id, actor_ref, actor_role, no_platform_id, confirm_possible_duplicate, reservation_ttl_seconds)：action 取 created、ready_to_ship、cancelled、shipped、return_received；payload 照 CORE-TASK-083 的 parse_payload（不合格 ValueError）。返回不可变的结果（replayed 真假、event_row_id、result、result_code、platform_order_row_id），被拒时抛 ManualRejected（status、code、details），被拒一律什么也没写。按这个先后：
      1. 在没有打开事务的连接上 GET_LOCK(order_lock_name(…), 5)，取不到 503 UNAVAILABLE。
      2. 普通读 (tenant_id, credential_id, manual_key) 已有的人工事件：request_hash 相同则不再处理、返回它的 result 与 result_code、replayed 为真；不同则 409 IDEMPOTENCY_CONFLICT（安全事件由调用方记）。
      3. 平台订单不存在而 action 不是 created：404 PLATFORM_ORDER_NOT_FOUND。这个订单已有 webhook 或 pull 来源的事件、而 action 是 created、ready_to_ship、cancelled、shipped 之一：409 STATE_CONFLICT，details 为 {"reason": "auto_events_exist"}。这个订单还有别的未处理事件：409 STATE_CONFLICT，details 为 {"reason": "events_pending"}（补的：人工事件只处理它自己，先让作业处理完）。
      4. classify（CORE-TASK-083）：missing_prior 409 STATE_CONFLICT，details 为 {"reason": "missing_prior_action", "missing": 缺的动作}；blocked 409 STATE_CONFLICT，details 为 {"reason": "order_held"}（补的：待发货被拒在待处理，先重试，CORE-TASK-107）；ignored、attention、apply 照常往下。
      5. 单据 ID（补的：人工登记必须填平台的 ID，契约 5.10），只在 classify 为 apply 时判（ignored 与 attention 照常记，不判 ID；对 committed 订单的 cancelled 不带 refund_id、no_platform_id 又为假时，本步的 422 先于 CORE-TASK-089 的过期判断，不当作过期忽略：人工登记是运营者当场填的，缺 ID 要提示补上）：shipped 缺 package_id、return_received 缺 return_id、对 committed 订单的 cancelled 缺 refund_id 时，no_platform_id 为真才可以，否则 422 INVALID_REQUEST（details 带 field）；no_platform_id 为真而 payload 带了那个 ID、或用在其余动作与阶段上（created、ready_to_ship、扣数之前的 cancelled）、或这个入口的连接 mode 不是 manual（契约 5.10：m 加数字的引用只在人工模式下出现，自动模式下用它会与之后带平台 ID 的自动事件重复发货），422 INVALID_REQUEST。对 committed 订单的 cancelled 在 no_platform_id 为真时，payload 的各行要带这次退款取消的 quantity（parse_payload 原本只在带 refund_id 时收 quantity：本任务给 parse_payload 加关键字参数 manual_no_id，为真时 cancelled 不带 refund_id 也必须带 lines 且每行带 quantity，其余规则不变；自动来源照旧）。
      6. 可能重复（同样只在 classify 为 apply 时判）：no_platform_id 为真、confirm_possible_duplicate 为假，而这个订单已有同一动作、payload 也没带单据 ID、result 为 applied 的人工事件（对 cancelled 只算对 committed 订单登记的那些，即生成了退款回库单据的），平台行与件数完全相同（按 platform_line_id 比较各行的件数键），且平台时间（payload 的 platform_time，没有时用 received_at；这次没有 platform_time 时用数据库当前时间）相差不超过 24 小时：409 POSSIBLE_DUPLICATE，details 为 {"events": [{"event_row_id", "platform_time"}]}，按 event_row_id 升序。判定写成 app/domain/platform_events.py 里的纯函数，单元测试加在 tests/unit/test_platform_events.py。
      7. 照 CORE-TASK-086 第 3 步预建与关单、设 READ COMMITTED；开事务；写收件箱行（new_id 的 pev 前缀，source 为 manual，platform_line_id 为空串，event_key 与 manual_key 都是这次的提交键，request_hash、credential_id 取参数，received_at 为数据库时间）；然后照 086 第 4 步的锁序与 087 到 089 的处理办法处理这一个事件，执行 Core 命令的身份是 credential_id，操作者为 actor_ref 与 actor_role：为此改 app/services/platform_commands.py（CORE-TASK-088 让待发货的预留与确认销售固定用 system 主体，089 的三个动作对 manual 来源已用收件箱行上的 credential_id）：manual 来源的事件四个 Core 命令都用收件箱行上的 credential_id 与调用方传入的操作者，自动来源照旧用 system 主体、不带操作者。no_platform_id 为真时单据引用用 CORE-TASK-083 的 manual_document_ref(order_ref, kind, n)（089 对缺单据 ID 的 manual 事件写待处理的分支，在 no_platform_id 为真时改走这条），n 为这个订单生成了同种 Core 单据（发货、退款回库、退货验收）的、payload 没带单据 ID、result 为 applied 的人工事件数加一（在订单锁下数，确定；扣数之前的取消不生成单据，不算）。第 6、7 步读已存的人工事件时直接读 payload 的 JSON（有没有单据 ID 键、各行的 platform_line_id 与件数键），不经 parse_payload、不另加列：payload 没带单据 ID 就是当时用了 no_platform_id；以后要再解析人工行时，没带 refund_id 而各行带 quantity 的 cancelled 按 manual_no_id 为真解析。no_platform_id 要传到处理里，所以 process_order 内部处理一个事件的函数加一个默认为假的参数，自动路径不传。插入收件箱行撞上 (tenant_id, credential_id, manual_key) 的唯一约束（同一提交键的并发请求指向不同订单，各持不同的订单锁）时整笔回滚，再普通读那一行，按第 2 步回答重放或 409 IDEMPOTENCY_CONFLICT（照契约 7.1 第 4 步），不回 500。写 applied_at 与 result、result_code，与改动一起提交；释放锁与复原隔离级别照 086 第 7 步。
      8. 人工路径不留给下一轮：重新解析 SKU 两次都与预建时不同、或命令两次要求整个重做，整笔回滚、503 UNAVAILABLE；数据库错误或程序异常整笔回滚后原样抛出（接口回 500），都什么也没写。
      process_order 的行为不变（人工事件在登记时已处理完，不会留给它；CORE-TASK-089 的测试直接插 manual 行再调 process_order，照常通过）；已有的自动路径行为不变。
      明确不做：接口与平台订单的读（CORE-TASK-106）；待处理重试、映射补上后继续处理、关闭待处理单（CORE-TASK-107）；契约 5.10 第 6 步的改正事件（已确认之后录错了、补登改正的那条事件，不受 auto_events_exist 限制；CORE-TASK-089 把它留给第 3 组，本组没有定它的形状，记在 docs/TODO.md 的待登记里，另行设计登记）。
    status: ready
    depends_on:
      - CORE-TASK-089
    acceptance_criteria:
      - 只改 allowed_change_paths；集成测试写在 tests/integration/test_platform_events_manual.py，数据用 platform_fixtures 建（连接 mode 为 manual）、每个测试用自己的租户并在 finally 里 purge_tenant
      - 人工模式下依次登记 created、ready_to_ship、shipped（带包裹 ID）得契约 5.10 例子第 1 种同样的账面结果，收件箱三行都是 manual、applied_at 有值，流水上的操作主体是传入的 credential_id、actor_ref 与角色如传入
      - 情形表逐行各一条，被拒后收件箱、平台订单、配额与流水都没有变化：另一个连接持有订单锁 503；未建订单就登记 ready_to_ship 404 PLATFORM_ORDER_NOT_FOUND；未登记待发货就登记交运 409 missing_prior_action；有 webhook 事件的订单登记 shipped 409 auto_events_exist（而登记 return_received 不受限）；有别的未处理事件 409 events_pending；held 且待发货已处理过的订单登记交运 409 order_held
      - 同一提交键同内容再交 replayed 为真、不再处理；换内容 409 IDEMPOTENCY_CONFLICT
      - 平台没有给 ID：第一次交运的引用以 m1 结尾，第二次（新提交键、件数不同）以 m2 结尾；与已有的无 ID 交运平台行件数相同、时间在 24 小时内时 409 POSSIBLE_DUPLICATE 列出那个事件，带确认再交生效且得 m2；缺包裹 ID 又没勾选 422，勾选了又带 ID 422
      - 处理中让一条语句失败（monkeypatch）时整笔回滚、没有收件箱行，异常抛出；登记的 ready_to_ship 生成的预留与确认销售、流水上的操作主体是管理员的而不是 system 主体；对 committed 订单无 ID 的取消按 payload 各行的 quantity 退款回库、引用以 m1 结尾
      - 单元测试覆盖可能重复的判定：件数不同、动作不同、时间相差超过 24 小时、对方带单据 ID、对方未生效各不算重复，恰好 24 小时算
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/platform_events.py
      - app/services/platform_commands.py
      - app/domain/platform_events.py
      - tests/unit/test_platform_events.py
      - tests/integration/test_platform_events_manual.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-106
    title: 后台的平台订单人工登记接口，平台订单列表与详情
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 8.6 第 2 条（人工登记、待处理与审计页；写接口的检查顺序第 ⑨ 步换成平台事件执行器）、5.10“后台的人工操作”（工作包 P3h 的人工登记部分，接口层）。
      一，POST /api/v1/admin/platform-orders/events：正文 channel_id、platform_order_id（1 到 128 个字符、不含控制字符）、action、payload（JSON 对象，用 parse_payload(action, payload, manual_no_id=no_platform_id) 校验）、no_platform_id 与 confirm_possible_duplicate（可选布尔，默认假）；多出来的键或值为 null 都 422（同 /v1 的请求模型）。检查顺序：require_admin_csrf → Idempotency-Key（缺或不合格 400）→ 正文 422 → 角色（stock_operator 与 stock_admin，断言 stock_admin）→ 本租户：入口不存在或属于别的租户 404 NOT_FOUND（两种只差 request_id；后者经 CORE-TASK-099 的 admin_not_found 记 cross_tenant，object_type 为 channel），是本租户的但不是 platform 或不是 active 422 INVALID_REQUEST → request_hash 用现有 /v1 的 request_digest，路径参数为 {"operation": "register"}、正文为请求正文（操作名放进摘要：manual_key 的作用域不含操作名，否则同一个键先后用于不同操作会被当成重放）→ 调 CORE-TASK-105 的 process_manual_event（credential_id 为管理员的主体，actor_ref 为账号 ID，actor_role 为断言的角色，提交键作 manual_key，预留有效期取 app.state 上的设置）。不经幂等执行器、不写幂等记录。
      成功 200，data 为 event_row_id、result、result_code 与 platform_order（平台订单的表示，见下）；replayed 时同样 200 并带响应头 Idempotency-Replayed 为 true；ManualRejected 按它的 status、code、details 回 /v1 的错误形状；IDEMPOTENCY_CONFLICT 时照执行器的写法记一条 idempotency_conflict 安全事件，details 为 {"operation": 操作名}（人工登记为 register，同上面摘要里的操作名）；其余异常回 500 INTERNAL_ERROR。
      二，GET /api/v1/admin/platform-orders?channel_id=&stage=&attention=&after=&limit=：只读、只要求登录、只列管理员租户的；过滤都可选（stage 取 unpaid、held、committed、cancelled；attention 取 any 时列出 attention 非空的，否则取一个具体的原因值（只判形状：1 到 32 个小写字母或下划线；不列封闭集合，不认识的值得空列表），按相等过滤；channel_id 格式按 CORE-TASK-100 的 ID 形状校验，别的租户的或不存在的入口得空列表）；取值或格式不合格 422；按 platform_order_row_id 倒序（最新在前），分页照 CORE-TASK-100 的后台列表规则，排序键与游标为 platform_order_row_id；每项是下面平台订单表示去掉 lines 与 events 的部分。GET /api/v1/admin/platform-orders/{platform_order_row_id}：平台订单的表示（platform_order_row_id、channel_id、platform_order_id、order_ref、stage、attention、attention_code、ready_at、created_at、updated_at、lines 与 events）；lines 为各行除 known_discrepancy_note 外的列（按 platform_line_id 升序），events 为各事件的 event_row_id、action、source、event_key、payload、received_at、applied_at、result、result_code（按 received_at、event_row_id 升序）；platform_order_row_id 格式不合格 422；别的租户的或不存在的 404 PLATFORM_ORDER_NOT_FOUND，两种只差 request_id，前者经 admin_not_found 记 cross_tenant（object_type 为 platform_order）。
      接口放新模块 app/api/admin_platform_orders.py，在 app/main.py 只在后台开关为真时挂上；读的查询加在 app/services/admin_queries.py。
      明确不做：待处理重试、继续处理、关闭待处理单与人工核对的接口（CORE-TASK-108）；前端。
    status: ready
    depends_on:
      - CORE-TASK-105
      - CORE-TASK-104
    acceptance_criteria:
      - 只改 allowed_change_paths；接口测试写在 tests/integration/test_admin_platform_orders_api.py，用后台开关为真的生产应用、真实登录，数据用 platform_fixtures 建、finally 里 purge_tenant
      - 经接口登记 created、ready_to_ship、shipped 成功，响应的 platform_order 与库里一致，流水的 actor_ref 为账号 ID、actor_role 为 stock_admin、credential_id 为管理员的主体；没有新的幂等记录
      - 同键同内容再交 200 带 Idempotency-Replayed；换内容 409 IDEMPOTENCY_CONFLICT 并多一条 idempotency_conflict 安全事件
      - 检查顺序：没有会话 401、CSRF 不符 403、缺提交键 400、payload 不合格 422、别的租户的入口 404、本租户的 backoffice 入口 422，都不写收件箱；105 的情形经接口各挑两条（503 用另一个连接持有订单锁，409 missing_prior_action）得到同样的码与 details
      - 列表按三种过滤与分页各有一条，只含本租户；详情的 lines 与 events 如上，别的租户的 404
      - 后台开关为假的生产应用上这些路径都是 404
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/api/admin_platform_orders.py
      - app/services/admin_queries.py
      - app/main.py
      - tests/integration/test_admin_platform_orders_api.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-107
    title: 平台事件执行器加待处理重试、映射补上后继续处理与关闭平台已取消的待处理单
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 8.6 第 2 条（待处理重试、映射补上之后继续处理、关闭平台已取消的待处理单）、5.10“后台的人工操作”与 3.2 的 held_order_closed（工作包 P3h 的其余部分，服务层）。
      三种操作都照 CORE-TASK-105 的人工路径做（第 1、2 步的订单锁与提交键去重、第 7、8 步的事务、预建、撞唯一约束时的重读与“不留给下一轮”），写一条 source 为 manual 的收件箱行；不经 classify，不受 auto_events_exist 限制（契约 5.10 引用格式第 3 条），只受 events_pending 限制（这个订单有别的未处理事件时仍 409 events_pending）；但锁下按当前订单状态用 classify 判为 blocked 的未处理事件不算（held 订单在 ready_at 已记时收到的 shipped、return_received 会被作业判 blocked 留着不处理；算进去订单就永远解不开），它们在订单离开 held 之后由下一轮作业照常处理。这条豁免只对 retry 与 resume；close 不豁免，被判 blocked 留着的事件也算 events_pending（留着的 shipped 或 return_received 说明平台已经发货，这张单不是平台取消的，关闭之后那次交运只会报 stage_conflict、Core 永远扣不到；要先重试或继续处理，补的；重试一直被 Core 拒绝时，这张单与留着的事件一直停在 held、积压告警一直报，接受：按告警查 Core 一侧、改好后再重试，登记 PR 请 Kelvin 确认）。CORE-TASK-083 说这两种“不是收件箱事件、不经 classify”，这里按契约 8.6 第 2 条“都写成收件箱里的一条事件”记一行以便去重与审计，处理仍不经 classify。
      新函数 process_held_operation(engine, *, tenant_id, platform_order_row_id, operation, manual_key, request_hash, credential_id, actor_ref, actor_role, reservation_ttl_seconds)，operation 取 retry、resume、close，与 process_manual_event 共用内部的锁、去重与事务部分（可以提成模块内的私有函数），返回值与 ManualRejected 同 105；由平台订单行 ID 指定订单：先在没有打开事务的连接上普通读这一行（不存在或属于别的租户 404 PLATFORM_ORDER_NOT_FOUND，在取锁之前判出），读完结束事务，再用它的入口与平台订单号算 order_lock_name 取订单锁（105 第 1 步），锁下做提交键去重并重新读订单判各操作的前提（订单的状态以锁下读到的为准）；收件箱行的 action 与 payload 如下。
      一，retry（待处理重试）：订单须为 held、ready_at 已记、attention 不是 unmapped，否则 409 STATE_CONFLICT，details 为 {"reason": "not_retryable", "stage", "attention"}。收件箱行 action 为 ready_to_ship、payload 为空对象。照 CORE-TASK-088 再做一次待发货：一个保存点里预留并确认销售，成功则 committed、pending 照减、清空 attention 与 attention_code，但 CORE-TASK-088 的两种“成功但缺陷”（rejudge 成功、按引用返回原结果）照 088 写 attention 为 defect、attention_code 为空、result_code 为 defect（088 的写法优先于清空，补的）；再被拒则留在 held、attention 与 attention_code 照 088 改写。result 与 result_code 照 088。
      二，resume（映射补上后继续处理）：订单须为 held 且 attention 为 unmapped，否则 409 STATE_CONFLICT，details 为 {"reason": "not_unmapped", "stage", "attention"}。照 CORE-TASK-086 的做法，开事务之前先普通读解析、按结果预建，锁住 channel_allocations 之后再用 FOR SHARE 读平台商品复核（与预建时不同就照 105 第 8 步重做一次、再不同 503），解析的对象是 sku_id 为空、且剩余件数（quantity 减 cancelled_qty）大于 0 的各行（剩余为 0 的行已全部取消，不要求映射、sku_id 留空，补的：否则这种单永远继续不了）；仍有解析不到的 409 STATE_CONFLICT，details 为 {"reason": "still_unmapped", "platform_line_ids": 按升序}，什么也不写。都解析到时：写这些行的 sku_id，对它们按剩余件数做 CORE-TASK-086 的 created 记账（take_quota 的件数与 pending 的增量都是剩余件数，quota_taken 记扣走的；manual_confirmed_quota 非空时照 CORE-TASK-086 减去 min(剩余件数, manual_confirmed_quota)，契约 0.24），清空 attention 与 attention_code、stage 改回 unpaid；ready_at 已记的再照一做一次待发货：成功时收件箱行 result 为 applied，被拒时订单留在 held、attention 与 attention_code 照 CORE-TASK-088 改写、result 为 held、result_code 照 088；ready_at 未记的 result 为 applied。锁按全局锁序一次取齐两段要用的行：收件箱行 → 平台订单行 → 池行 FOR SHARE → 余额行 → pool_allocations 行 → channel_allocations 行（按 sku_id、再按 channel_id 升序）→ 平台商品 → SKU → 商品，与 CORE-TASK-088 待发货的锁序一致，created 要锁的配额行含在其中。收件箱行 action 为 created、payload 为这个订单各行的 created 形状（platform_line_id、platform_item_id、platform_model_id、quantity），quantity 取平台行的原件数（总大于 0，过得了 parse_payload；不是剩余件数：这一行只作去重与审计，记账按剩余件数，补的）。
      三，close（关闭平台已取消的待处理单）：订单须为 held，否则 409 STATE_CONFLICT，details 为 {"reason": "not_held", "stage", "attention"}。收件箱行 action 为 cancelled、payload 为空对象（取消全部剩余件数），照 CORE-TASK-087 扣数之前的取消处理；同一事务里写一条 platform_ops_log，action 为 held_order_closed，object_type 为 platform_order、object_id 为 platform_order_row_id，before 与 after 为 {"platform_order_row_id", "stage"}（stage 为 held 与 cancelled），reason 为空，credential_id、actor_ref、actor_role 取参数（actor_role 为调用方断言的角色），request_id 为这一行的 event_row_id。
      明确不做：接口（CORE-TASK-108）；清除已确认单的待处理标记、记已知差异（以后与其余运营操作一起登记）。
