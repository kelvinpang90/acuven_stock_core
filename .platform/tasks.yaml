  - id: CORE-TASK-008
    title: 实现通用幂等执行器，含命名锁、重放、冲突与结果保存
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.6 的 7.1 与 8.3，实现所有 /v1 写命令共用的幂等执行器，规则调用 CORE-TASK-004 的纯函数，请求处理与错误封装用 CORE-TASK-006 的，鉴权、授权与写安全事件的函数用 CORE-TASK-007 的。
      执行顺序：契约 8.1 第 1 到 9 步都在执行器之前完成，它们的拒绝不保存。写接口声明固定的操作类型。
      执行器用处理请求的连接（鉴权等前几步用过的连接，先结束它上面的事务），在没有打开事务时按 7.1 取命名锁（等待 0）：返回 0 为 409 REQUEST_IN_PROGRESS 加 Retry-After 为 1，返回 NULL 为 503 UNAVAILABLE，都不写任何东西；
      返回 1 之后才在同一连接上开事务，按作用域查幂等记录：摘要相同则原样重放原状态码与原响应体，加 Idempotency-Replayed 为 true，X-Request-ID 头是本次的；
      摘要不同为 409 IDEMPOTENCY_CONFLICT，不产生变化，并写一条安全事件；没有记录则在同一事务里执行命令并写幂等记录后提交。
      命令成功时，幂等记录与命令的写入同一事务提交；命令以业务 4xx 拒绝时默认撤销命令的全部写入、只保存幂等记录；
      命令可以声明被拒时仍要保留的写入（契约 7.1，如 5.2 的晚到支付转待审），这些写入与幂等记录同一事务提交；
      命令抛出未处理异常或数据库错误时回滚、不保存，返回 500 INTERNAL_ERROR。写幂等记录撞上唯一约束时回滚命令，另开事务读出已有记录，按重放或冲突返回，
      得到冲突时照常写幂等冲突事件，被回滚的命令登记的安全事件丢弃；命令抛出未处理异常时，它在异常之前登记的事件照样在回滚并释放锁之后写入（契约 7.2：有业务事务的事件在事务结束后写），同键重试再登记的会再写一次。
      无论结果如何，最后在同一连接上执行 RELEASE_ALL_LOCKS；释放出错或连接已坏时把连接从连接池作废，不放回池里。
      安全事件：命令在事务里发现的安全事件（跨租户 404、业务引用冲突）交给执行器暂存，与幂等冲突的事件一样，在事务结束并释放锁之后用同一连接写，
      连接已作废时从池里另取一个（契约 7.2）；重放时不再写。执行器提供命令登记这类事件的方法。
      保存的响应体就是首次返回的完整响应体（含当时的 request_id）。本任务不新增业务接口；集成测试给应用挂测试专用的写路由，命令在事务里插一行可观察的数据。
      明确不做：业务引用层的去重（随各命令做）、限流、到期清理、命令行。
    status: done
    depends_on:
      - CORE-TASK-007
    acceptance_criteria:
      - 执行器放 app/services/idempotency.py；写接口怎么声明操作类型、怎么接入执行器在模块文档里写明，供之后的命令任务照用
      - 集成测试在真 MySQL 上验证：首次成功写入命令数据与幂等记录；同键同内容重放得到相同状态码与响应体并带 Idempotency-Replayed 头，命令数据不重复；请求体键序不同仍算同内容
      - 集成测试验证：同键不同内容为 409 IDEMPOTENCY_CONFLICT，命令数据不变并写了安全事件；命令登记的安全事件在命令成功、以业务 4xx 被拒或抛异常时都在事务结束后写入，撞唯一约束被回滚时丢弃，重放时不写；换操作类型或换凭据用同一个键互不影响；同一凭据轮换后用新令牌、同一个键重试得到重放
      - 集成测试验证：测试先在另一个连接上持有同一锁名，请求得到 409 REQUEST_IN_PROGRESS 与 Retry-After 为 1，且没有写幂等记录；锁释放后同键重试正常执行
      - 集成测试验证：命令以业务 4xx 拒绝时命令数据回滚、幂等记录保存了该 4xx，同键重试重放 4xx、换新键可以重新执行；声明了被拒仍保留的写入时，这些写入与幂等记录都在；命令抛异常时返回 500、命令数据与幂等记录都没有，同键重试会重新执行；鉴权或格式被拒的请求没有幂等记录，改正后同键可以执行
      - 集成测试验证：每个请求结束后命名锁已释放（另一个连接能取到同名锁），包括命令抛异常的请求；写幂等记录撞唯一约束时返回重放或冲突而不是 5xx（测试在执行器查完幂等记录之后、写入之前，从另一个连接绕过锁提交一条同键记录，例如经测试命令里的钩子）
      - 改动只落在 allowed_change_paths；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推
      - 集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/idempotency.py
      - app/api/requests.py
      - tests/integration/conftest.py
      - tests/integration/test_idempotency.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-009
    title: 实现开通租户、地点、库存池与销售入口的运维命令行
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.6 的第 1 节、第 3 节与第 10 节第 4 条，给 Core 加一个只在 Core 容器里由运维执行的命令行，先做开通：
      Core 没有 HTTP 管理接口（契约 10.4），租户、地点、库存池与销售入口只能这样建，下一任务的凭据签发也接在这个入口上。
      一，入口：python -m app.cli 加子命令（标准库 argparse），读 app/config.py 的 Settings（CORE_ENV 与 CORE_DATABASE_URL，与服务同一个数据库账号）；
      入口函数放 app/cli/__main__.py，接受参数列表、Settings、标准输出流与标准错误流，返回退出码，测试直接调用它并传入测试库的 Settings；
      参数错误由入口函数自己接住（不让 argparse 打印多行用法后退出进程），向标准错误写一行、返回 2；这一行不含任何参数值（argparse 的报错文本会带上传入的值，不能原样输出，以免运维误传的明文令牌被打出来）。数据库未配置时向标准错误写一行、返回 1，不打印连接串；
      python -m app.cli 的进程入口构造 Settings 时缺少或写错 CORE_ENV 等配置的校验异常也要接住，写一行、退出码 1、不打印堆栈。
      之后各子命令共用的部分（错误与退出码约定、事务包装、按 ID 查租户与入口、输出一行 JSON）放 app/cli/__init__.py，子命令模块只 import 它、不 import __main__，下一任务的凭据子命令照用。
      二，子命令：tenant create 加 --name；location create 加 --tenant 与 --name；pool create 加 --tenant、--location 与 --name；
      channel create 加 --tenant、--pool 与 --name；show 不带参数时列出全部租户，加 --tenant 时列出该租户的地点、库存池与销售入口（ID、名称、状态、所属），租户不存在时向标准错误写一行、退出码 2。
      新建对象的 ID 用 app/domain/ids.py 的 new_id，前缀依次为 ten、loc、pool、chan；租户、地点、销售入口状态为 active，库存池为 initializing
      （契约第 6 节，期初只在 initializing 可用；切到 live 随期初任务做，本任务不做）。
      三，校验：名称去首尾空格后 1 到 200 个字符、单行、不含控制字符；引用的租户须存在且为 active；地点须属于该租户且为 active；库存池须属于该租户；
      一个库存池已有销售入口时拒绝再建（契约第 3 节，C-07，数据库已有唯一约束），并发时撞上唯一约束也报同样的说明而不是堆栈。
      V1 每租户一个地点、一个池、一个入口（契约第 1、3 节）由运维照做，命令行不另加数量限制，数据键保留这些维度。
      四，事务与输出：一个命令一个数据库事务，失败时什么也不写；成功时向标准输出写一行 JSON（新对象的 ID 与字段；show 输出 JSON），退出码 0；
      参数或校验错误向标准错误写一行说明、退出码 2；数据库不可用等其他失败写一行说明、退出码 1；都不打印连接串、密码与堆栈。
      五，不写安全事件（契约 7.2 的事件类型只含凭据与令牌的操作，不含开通）。
      在 README.md 加一节说明怎样在服务器上执行这些命令：写法同 deploy/healthcheck.sh，按 compose 项目 acuven_stock_core、服务 core_api 的标签找到运行中的容器，
      再用 docker exec 在里面执行 python -m app.cli；写明不用 docker compose exec（要展开只由部署脚本设置的镜像变量，没有它直接报错）
      与 docker compose run（输出经容器的日志驱动落盘，下一任务的明文令牌会进日志）；不写主机名与服务器路径。
      明确不做：停用、改名、删除，库存池切 live，凭据与令牌（下一任务），HTTP 接口，新的配置项。
    status: ready
    depends_on: []
