为 note，操作主体列取上下文。不改账、不改 attention（清除标记是另一个操作）；记了已知差异的订单在对账里整单不比（CORE-TASK-123 已实现）。 两个命令都返回这个平台订单在 CORE-TASK-106 详情里的表示（lines 照 106 不含说明文字），用 106 的详情读法在同一事务里读出拼好，200。 二，接口加在 CORE-TASK-106 的 app/api/admin_platform_orders.py：POST /api/v1/admin/platform-orders/{platform_order_row_id}/clear-attention 与 POST /api/v1/admin/platform-orders/{platform_order_row_id}/known-discrepancies，经 CORE-TASK-099 的依赖与 run_admin（operation 分别为 platform_orders.clear_attention 与 platform_orders.mark_known_discrepancy，角色 stock_operator 与 stock_admin、断言 stock_admin，上下文的入口与池为空）。正文如上，多出来的键或值为 null 都 422；行 ID 按 is_admin_id 判形状，不合格 422。调执行器之前用本请求的连接普通读预检：不存在 404 PLATFORM_ORDER_NOT_FOUND，属于别的租户经 admin_not_found（object_type platform_order）记 cross_tenant 后同样 404，两种只差 request_id。 明确不做：撤销已知差异、改说明；已知差异的说明文字的读接口；平台运营日志的列表（缺口 G9）；前端。
