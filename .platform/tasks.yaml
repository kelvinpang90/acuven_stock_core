  - id: CORE-TASK-030
    title: 实现流水更正命令
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.10 的 4.3、6.2、6.7 与 10 第 3、4 条，在 CORE-TASK-029 的 app/api/stock_documents.py 与
      app/services/stock_documents.py 加 POST /v1/corrections（corrections.create）。规则用 CORE-TASK-023 的 correction_blocker 与 apply_correction，
      锁行、写流水与单据用 CORE-TASK-026 的 app/services/stock.py。
      一，stock.write，角色 stock_admin；正文 entry_id、reason_code（必填），可选 note、occurred_at；未知字段 422。
      池授权按原流水所属的池（require_object_pool，原流水不存在或属于别的租户 404 ENTRY_NOT_FOUND，后者记 cross_tenant）；池状态不限。
      不需要 balance_rows（原流水的余额行已存在）。
      二，命令经 CORE-TASK-026 的 with_document 执行（被业务拒绝时在新事务里重新判定一次，见该任务），依次：业务引用（correction 类型、
      document_ref 为原 entry_id）——已有单据且摘要相同返回 200 与 result；摘要不同时不报
      BUSINESS_REF_CONFLICT，改为 409 ENTRY_NOT_CORRECTABLE，details.reason 为 already_corrected，带已有单据的 document_id，不记安全事件
      （用 with_document 的 on_conflict 参数）；
      然后 FOR SHARE 读池行，FOR UPDATE 锁原流水的余额行，按 correction_blocker 判定（契约 6.7 的步骤里没有“SKU 已合并”一步：合并按 2.4 第 1 步总会成对写迁移流水，
      来源 SKU 上更早的流水由判定列判为 superseded，所以不另查 SKU）（409 ENTRY_NOT_CORRECTABLE，details.reason 为 entry_type、
      pool_live 或 superseded，superseded 时带 details.last_reconciled_version）；apply_correction 违反不变量时 409 CORRECTION_BREAKS_INVARIANTS，
      details 为一个对象：sku_id、stock_balance、reserved、unavailable、paid_pending_dispatch（落账后的值）与 shortfall；通过则写一条 CORRECTION（四个增量为原流水的相反数，corrects_entry_id 为原流水，source_type correction，
      source_ref 为原 entry_id），append_entry 照 CORE-TASK-026 更新判定列并在原流水是有效期初时清空 opening_entry_id，写单据，
      返回 201：document_id、corrected_entry_id、entry（流水的表示）。
      三，两个不同幂等键并发更正同一条流水：后到者的读快照看不到先到者的单据，锁行后可能因先到者的 CORRECTION 已写入、反向后账面不合法等原因被拒；
      这个拒绝经 with_document 在新事务里重新判定，按第二条的业务引用规则得到 200 原结果或 already_corrected，而不是 superseded；
      撞流水表或单据表唯一约束时同样重新判定。
      明确不做：盘点、期初接口；不改 CORE-TASK-029 的两个命令。
    status: done
    depends_on:
      - CORE-TASK-028
      - CORE-TASK-029
    acceptance_criteria:
      - 接口与写入加在 app/api/stock_documents.py 与 app/services/stock_documents.py；CORE-TASK-029 的测试照常通过
      - 集成测试在真 MySQL 上验证成功的更正：收货后更正得 201，余额回到收货前、流水的四个增量为原流水的相反数、corrects_entry_id 正确、判定列更新；initializing 池上更正期初后 opening_entry_id 清空，可以用新导入再导期初（用服务层或接口造期初）
      - 集成测试验证类型与池状态：合并之后（测试照契约 2.4 写一对迁移流水并设好判定列）更正来源 SKU 上更早的收货得 superseded；更正 RESERVE 类流水（测试直接造流水）、COUNT_ADJUSTMENT、CORRECTION 得 entry_type；池已 live 时更正期初得 pool_live
