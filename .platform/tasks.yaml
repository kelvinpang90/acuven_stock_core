    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-089
    title: 平台订单的交运、已确认后的取消与退货验收调 Core 命令，被拒只写待处理标记
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 5.10 第 4 步（带业务引用的动作落后于阶段）、第 6 步已确认之后、派生正文的三行与“每个动作调哪个命令体”的三行，3.1 已确认后取消的加回（工作包 P2e2）。在 CORE-TASK-088 的 app/services/platform_commands.py 上补，命令执行的写法同 088。
      一，三个动作都只在订单 committed 时 apply。return_received 处理时这个订单还有未处理的 shipped 事件，就先处理它们（同 CORE-TASK-087 的“先处理前序”，否则退货会因尚未记发货被 Core 拒绝）。return_received 只由后台登记（source 为 manual），后台在同一事务里写收件箱并调本任务的处理（第 3 组）；本任务的测试直接插入 manual 来源的收件箱行再调 process_order。执行 Core 命令的身份：自动来源用 system 主体；manual 来源用收件箱行上的 credential_id（登记它的管理员），操作者由调用方传入（后台传管理员的 actor_ref 与 stock_admin，process_order 处理 manual 行时为空）。写 attention 照 CORE-TASK-087 的通用规则。已确认之后的 cancelled，按这个先后判：带 lines 时，若各行的 cancelled_total 都不大于这一行的 cancelled_qty（是付款前那次取消从另一个来源晚到，不论带不带 refund_id；已确认之后的取消不记 cancelled_qty，所以真正的新取消必然大于它），记 ignored；不带 refund_id 时写待处理原因 refund_id_missing（带不带 lines 都是）；带 refund_id 而不带 lines（订单级）时不调 Core，原因 cancel_lines_missing（件数里可能含已交运的，契约要求取平台的件数）。payload 的 platform_line_id 经平台订单行的 line_ref 对到 Core 行；有平台行不属于这个订单或没有 line_ref 时不调 Core，写 attention 为 line_not_committed，result attention。
      shipped 要 package_id、return_received 要 return_id：缺了不调 Core，写 attention 为 missing_platform_id（已确认后的 cancelled 缺 refund_id 照上一段记 refund_id_missing，不用这个码），result attention（契约 5.10“平台给不出稳定的 ID 时”按订单、动作、平台行、件数、时间判断同一动作；V1 先一律进待处理，判断的办法随第 4 组适配器另定，PR 里写明）。引用由 document_ref 派生，正文由 dispatch_body、refund_restock_body、return_receipt_body 派生；整理后一行不剩记 ignored；请求模型校验不过写 attention 为 invalid_request、attention_code INVALID_REQUEST。
      二，SAVEPOINT → create_document（发货、退款回库、退货验收三种单据，照 app/services/fulfilment.py 现有的入口）→ RELEASE SAVEPOINT。命令成功且 execution.answered_by_reference 为假（新生效）：shipped 与 return_received 不再改别的（退货增量进 F），result applied；cancelled 在命令之后锁 pool_allocations 与这个池全部 platform 入口在这些 SKU 上的 channel_allocations 行、再 FOR SHARE 读平台商品（跳过池行与余额行：命令体已锁过余额行，available 从它读；平台行的 SKU 已被合并时它不会有生效平台商品（CORE-TASK-084、094），恢复条件第 2 项必不满足、不加回，不必另读规范 SKU 以外的余额行；在命令体之后再锁池行会颠倒池行在余额行之前的先后；契约的锁序里预留行与订单行在余额行之前，所以配额行只能在命令体之后锁；前提是发货、退款回库、退货验收的命令体只锁预留、订单行与余额行，不锁 SKU 与商品行，现有 app/services/fulfilment.py 如此，实现时核对，不成立就在 PR 里写明并停下）、平台商品 FOR SHARE，照 087 的加回规则（按平台行 quota_taken 减 quota_returned 封顶、按 SKU 判恢复条件、整份加或不加）加回 quota 与 quota_returned，result applied。命令成功而 answered_by_reference 为真：result ignored，不改 Q 与 pending。
      三，命令以业务拒绝结束：ROLLBACK TO SAVEPOINT，阶段不变、pending 不动，写 attention 为 core_rejected（错误码属于 088 第三条那三种时为 defect）与 attention_code，result attention。BusinessRefTaken 与 RedoCommand 照 088 第四条：rejudge 成功时，收件箱 result 记 applied、result_code 记 defect（与 CORE-TASK-093 的约束相容：ignored 才要求 result_code 为空），订单 attention 写 defect；app/services/fulfilment.py 的 rejudge 一律走按引用返回原结果，标记总是为真，所以这条路上不改 Q 与 pending、不加回配额。rejudge 以业务拒绝结束照第三条，attention 写 defect。
      明确不做：后台的退货验收登记与改正事件（第 3 组）；没有稳定 ID 时的同一动作判断（第 4 组）。
    status: ready
    depends_on:
      - CORE-TASK-088
    acceptance_criteria:
      - 只改 allowed_change_paths；新增 tests/integration/test_platform_events_after_commit.py（复用 platform_fixtures，在 finally 里 purge_tenant）
      - 契约 3.1 例子一第 7 步：A 交运 2 件，paid_pending_dispatch 3 变 1，Q 与 pending 不变；部分交运两次（两个包裹）各生效一次；同一包裹换 event_key 再到一次得 ignored、不改任何量
      - 例子第 7 种：包裹件数 3 而 Core 行只余 2，409 QUANTITY_EXCEEDS_OUTSTANDING，账面不变、阶段仍 committed、pending 不动、attention_code 为该码、result attention
      - 已确认后取消 1 件未交运的：Core 退款回库生效，quota 照恢复条件加回 min(1, quota_taken − quota_returned)、quota_returned 加 1；恢复条件不满足时不加回；同一 refund_id 换 event_key 再到得 ignored、quota 不再变
      - 退货验收：sellable 与 unsellable 件数照登记进 Core，Q 与 pending 不变；同一 return_id 重到得 ignored
      - 缺 package_id 或 return_id 时不调 Core、attention 为 missing_platform_id；已确认后的取消缺 refund_id 时为 refund_id_missing；平台行没有 line_ref 时 attention 为 line_not_committed；unpaid 订单收到这三个动作照 CORE-TASK-087 的乱序规则处理
      - CORE-TASK-086 到 088 的测试照常通过（它们里“未处理的动作停下”的用例不再有可用的动作，改为断言对应动作的新行为或删去，PR 里逐条写明）
      - 改动只落在 allowed_change_paths；已有的单元与集成测试照常通过；不改 .platform/、CI、部署配置；不装依赖；allowed_commands 里的检查全部零退出，skipped 如实报告且不算 passed；以 Draft PR 交付，不合并、不直推；集成测试由 PR 的必需 CI 检查 integration 执行并通过
    allowed_change_paths:
      - app/services/platform_commands.py
      - app/services/platform_events.py
      - tests/integration/platform_fixtures.py
      - tests/integration/test_platform_events_created.py
      - tests/integration/test_platform_events_cancel.py
      - tests/integration/test_platform_events_ready.py
      - tests/integration/test_platform_events_after_commit.py
    allowed_commands:
      - tests.unit
      - lint.check
      - format.check
    creates_branch: true
    creates_pull_request: true

  - id: CORE-TASK-090
    title: 改配额与安全库存的命令：锁内重算未分配，记只追加的配额变更
    purpose: >-
      按契约 docs/CONTRACT_V1.md 0.22 的 3.1 改配额与安全库存（Q-102）与锁序（工作包 P2f 的前一半）。命令只给后台用；本任务只写命令体与预建钩子，测试经 CORE-TASK-074 的执行器核心调用，后台接口是第 3 组的任务。
      一，新服务模块 app/services/allocations.py：update_allocations(execution, body) 与 before_transaction 钩子工厂 prepare_allocation_rows(tenant_id, pool_id, sku_id)（返回只收连接的 BeforeTransaction）：开事务之前用短事务预建这个池这个 SKU 的余额行、pool_allocations 行与这个池全部 platform 入口的 channel_allocations 行（池或 SKU 不属于这个租户、池没有 platform 入口时跳过，由事务里判）。
      事务以 READ COMMITTED 开启（执行器的 read_committed），锁：池行 FOR SHARE → 余额行 FOR UPDATE → pool_allocations 行 FOR UPDATE → 各入口的 channel_allocations 行 FOR UPDATE（按 channel_id 升序）→ 各入口的平台商品 FOR SHARE → SKU 行 FOR SHARE。pool_id 与 sku_id 的格式在调执行器之前按现有 ID 的校验（同 /v1 路径参数的规则）判，不合格 422。判定：池不存在或属于别的租户 404 POOL_NOT_FOUND；池没有 platform 入口 422 INVALID_REQUEST（契约没写，据 3.1“只有组合 2 的池有这两张表的行”补的）；正文按 validate_allocation_request（这个池的 platform 入口）校验，不合格 422；SKU 不存在 404 SKU_NOT_FOUND；这个池的 platform 入口不论 active 与否都算在 F 的求和与表示里；要增加 inactive 入口的配额 422 INVALID_REQUEST（补的）；SKU 已合并或停用不拒（只判不存在；减配额要能做）。池或 SKU 属于别的租户时照现有库存命令记 cross_tenant 安全事件。然后组快照（逾期按 manual_check_overdue，连接行与 manual_checks 普通读，now 为数据库时间）调 judge_allocation_update，按它的结果回 409 与 details。
      新值与当前值全部相同时 200 返回当前表示、不加版本、不写记录（同目录“已是目标状态”）。否则写新的 safety_stock 与各入口的 quota，pool_allocations.version 加一，写一条 allocation_changes：changes 为 {"safety_stock": {"before", "after"}, "quotas": {入口 ID: {"before", "after"}}}，只列变了的（没变的键不写），reason 取正文，操作主体列取上下文；与幂等记录同一事务。返回 200 与表示：pool_id、sku_id、version、safety_stock、available、unallocated、channels（各 platform 入口的 channel_id、quota、pending，按 channel_id 升序）。
      新错误码 NO_ACTIVE_LISTING、ALLOCATION_EXCEEDS_UNALLOCATED、MANUAL_CHECK_OVERDUE、QUOTA_CHANGED 的常量放在本模块（判定本身在 CORE-TASK-082 的纯函数里）。
      明确不做：后台接口、角色断言与发布（第 3、4 组）；读接口（库存总览随后台）。
    status: ready
    depends_on:
      - CORE-TASK-081
      - CORE-TASK-082
      - CORE-TASK-084
    acceptance_criteria:
      - 新增 app/services/allocations.py 与 tests/integration/test_allocations_service.py，不改别的文件；测试在测试模块里挂测试路由，经执行器核心以直接插入的 admin 主体与 stock_admin 角色组的上下文调用（read_committed 为真、before_transaction 为 prepare_allocation_rows）；数据提交、finally 里按外键先后删掉
      - 契约 3.1 例子一第 6 步：Q[shp] 改为 14 成功、version 加一、allocation_changes 一条、表示里 unallocated 为 2；第 6′ 步改为 17 得 409 ALLOCATION_EXCEEDS_UNALLOCATED、details 各量与例子一致、什么也不改
      - 版本不符 409 VERSION_CONFLICT（details.current_version）；某入口的 expected_quota 与当前不等 409 QUOTA_CHANGED、只列这些入口；只改别的入口时不冲突
      - 增加配额而这个入口没有生效平台商品 409 NO_ACTIVE_LISTING；manual 入口逾期时增加别的入口 409 MANUAL_CHECK_OVERDUE；只减配额或只改 S 时这三种都不报，超额时只改 S 也照常
